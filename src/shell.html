<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-attention, from first principles</title>
<style>
/* =====================================================================
   0. TOKENS (BRIEF section 1, fixed)
   ===================================================================== */
:root{
  --paper:#F7F8FA; --ink:#14171F; --ink-2:#4A5160; --ink-3:#8A91A0; --line:#D9DDE5; --card:#FFFFFF; --grid:#E3E6EC;
  --c-e:#2563EB; --c-q:#9333EA; --c-k:#D97706; --c-v:#0D9488; --c-a:#E11D48; --c-d:#16A34A;
  --c-ep-grad:linear-gradient(90deg,var(--c-e),var(--c-d));
  --c-mask:#9CA3AF; --warn:#B45309;
  --t-e:#E4ECFF; --t-q:#F1E5FC; --t-k:#FCEFD9; --t-v:#D9F2EF; --t-a:#FDE2E7; --t-d:#DDF3E4;
  --t-neutral:#EEF0F4;
  --font-ui:"Avenir Next","Segoe UI Variable Display","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --font-mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --font-math:KaTeX_Math,KaTeX_Main,"Times New Roman",serif;
  --radius:12px; --radius-s:8px;
  --strip-h:58px;
  --maxw:1120px; --pad:24px;
  --dur:200ms;
}
/* Object colour scoping: any element with .obj-X exposes --oc (colour) and --ot (tint) to its subtree. */
.obj-e{--oc:var(--c-e);--ot:var(--t-e)}
.obj-q{--oc:var(--c-q);--ot:var(--t-q)}
.obj-k{--oc:var(--c-k);--ot:var(--t-k)}
.obj-v{--oc:var(--c-v);--ot:var(--t-v)}
.obj-a{--oc:var(--c-a);--ot:var(--t-a)}
.obj-d{--oc:var(--c-d);--ot:var(--t-d)}
.obj-m{--oc:var(--c-v);--ot:var(--t-v)}
.obj-ep{--oc:var(--c-e);--ot:var(--t-e);--oc2:var(--c-d)}
.obj-neutral{--oc:var(--ink-3);--ot:var(--t-neutral)}

/* =====================================================================
   1. RESET + BASE TYPOGRAPHY
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--strip-h) + 16px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.5;font-weight:400;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
@media (min-width:1400px){body{font-size:18px}}
h1,h2,h3,h4{font-family:var(--font-ui);font-weight:700;letter-spacing:-0.01em;line-height:1.15;margin:0 0 .5em;color:var(--ink)}
h1{font-size:clamp(34px,4.6vw,52px);letter-spacing:-0.02em}
h2{font-size:clamp(28px,3.5vw,44px);letter-spacing:-0.015em}
h3{font-size:1.2em;margin-top:0}
h4{font-size:1em}
p{margin:0 0 1em}
a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-3)}
a:hover{text-decoration-color:var(--ink)}
strong{font-weight:700}
code,kbd,samp,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.92em}
pre.torch-snippet,pre.pytorch{max-width:100%;margin:.8em 0;padding:.75em 1em;border-left:3px solid var(--ink-3);border-radius:0 var(--radius-s) var(--radius-s) 0;background:var(--t-neutral);color:var(--ink);font-family:var(--font-mono);font-size:.92em;line-height:1.5;tab-size:4;white-space:pre;overflow-x:auto;overscroll-behavior-inline:contain}
pre.torch-snippet code,pre.pytorch code{font:inherit;color:inherit;background:none;padding:0}
small,.small{font-size:.88em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.warn-text{color:var(--warn);font-weight:500}
ul,ol{margin:0 0 1em;padding-left:1.4em}
li{margin:.2em 0}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
button{font:inherit;color:inherit}
input,output,select{font:inherit}
svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--t-e)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
@media (max-width:640px){:root{--pad:16px}}

/* Math colour classes (KaTeX \htmlClass output) */
.m-e{color:var(--c-e)} .m-q{color:var(--c-q)} .m-k{color:var(--c-k)} .m-v{color:var(--c-v)}
.m-a{color:var(--c-a)} .m-d{color:var(--c-d)}
.m-ep{color:var(--c-e);border-bottom:2px solid var(--c-d);padding-bottom:1px}
.katex{font-size:1.06em}
.katex-display{margin:.7em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.katex-display>.katex{white-space:normal}
.tex-display{margin:.6em 0;overflow-x:auto}

/* Inline object symbol (for prose): <span class="sym sym-q">Q</span> */
.sym{font-family:var(--font-math);font-style:italic;font-weight:400;padding:0 .12em;border-radius:3px;white-space:nowrap}
.sym-e{color:var(--c-e)} .sym-q{color:var(--c-q)} .sym-k{color:var(--c-k)} .sym-v{color:var(--c-v)}
.sym-a{color:var(--c-a)} .sym-d{color:var(--c-d)} .sym-ep{color:var(--c-e);border-bottom:2px solid var(--c-d)}

/* =====================================================================
   2. NOTATION STRIP (sticky)
   ===================================================================== */
#strip{position:sticky;top:0;z-index:50;background:rgba(247,248,250,.92);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);
  border-bottom:1px solid var(--line);min-height:var(--strip-h)}
#strip .wrap{display:flex;align-items:center;gap:16px;min-height:var(--strip-h);padding-top:6px;padding-bottom:6px;flex-wrap:wrap}
.nchips{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;list-style:none;margin:0;padding:0}
.nchips li{margin:0}
.nchip{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:32px;padding:0 10px;border-radius:999px;
  border:1.5px solid var(--oc);background:var(--card);color:var(--oc);font-family:var(--font-math);font-style:italic;font-size:17px;line-height:1;cursor:pointer;
  opacity:.38;filter:grayscale(.75);transition:opacity var(--dur),filter var(--dur),background var(--dur),transform var(--dur)}
.nchip.is-lit{opacity:1;filter:none;background:var(--ot)}
.nchip.is-lit.obj-ep{border:2px solid var(--oc2);background:var(--t-e)}
.nchip.is-current{transform:translateY(-1px);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--oc)}
.nchip:hover{opacity:1;filter:none}
.nchip .up{font-family:var(--font-ui);font-style:normal;font-size:12px;font-weight:600;margin-left:1px}
.nchip::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:240px;max-width:340px;padding:8px 10px;border-radius:8px;
  background:var(--ink);color:#fff;font-family:var(--font-ui);font-style:normal;font-size:13px;line-height:1.35;text-align:left;white-space:normal;
  opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity var(--dur),transform var(--dur);box-shadow:0 8px 24px rgba(20,23,31,.18)}
.nchip:hover::after,.nchip:focus-visible::after{opacity:1;transform:none}
.nchips li:nth-child(n+5) .nchip::after{left:auto;right:0}
.strip-sec{margin-left:auto;display:flex;align-items:baseline;gap:10px;color:var(--ink-2);font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip-sec .snum{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.strip-sec .stitle{overflow:hidden;text-overflow:ellipsis}
#progress{position:absolute;left:0;bottom:-1px;height:2px;width:0%;background:var(--ink);transition:width 120ms linear}
.reading{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:13px;color:var(--ink-3)}
.reading-lab{font-weight:600;letter-spacing:.02em}
.reading-seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.reading-btn{border:0;background:transparent;padding:4px 11px;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer;line-height:1.2}
.reading-btn+.reading-btn{border-left:1.5px solid var(--line)}
.reading-btn[aria-pressed=true]{background:var(--ink);color:#fff}
.reading-btn:hover{color:var(--ink)}
.reading-btn[aria-pressed=true]:hover{color:#fff}
.reading-btn:focus-visible{outline-offset:-2px}
@media (max-width:640px){
  :root{--strip-h:76px}
  #strip .wrap{gap:8px}
  .nchip{min-width:34px;height:28px;padding:0 8px;font-size:15px}
  .strip-sec{margin-left:0;flex:1 1 120px;min-width:0;width:auto;font-size:13px}
  .reading{margin-left:auto;flex:none}
  .reading-lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .nchip::after{min-width:200px;max-width:min(300px,calc(100vw - 32px))}
}

/* =====================================================================
   3. HERO + ROADMAP + LEGEND
   ===================================================================== */
.hero{padding:56px 0 8px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:start}
.hero-sub{font-size:clamp(18px,2vw,22px);color:var(--ink-2);max-width:34em;margin-bottom:24px}
.hero-meta{font-size:14px;color:var(--ink-3)}
.hero-central{margin:18px 0 0;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.hero-central .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
@media (max-width:900px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:28px}.hero{padding-top:36px}}
@media (max-width:640px){.hero-central{padding:12px 12px}.hero-central .katex{font-size:.8em}}
.roadmap{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;align-items:stretch}
.roadmap .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:10px}
.roadmap li{display:flex;flex-direction:column;align-items:stretch}
.roadmap a{display:flex;align-items:center;gap:12px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--card);
  text-decoration:none;font-weight:500;font-size:15px;line-height:1.25;transition:border-color var(--dur),transform var(--dur)}
.roadmap a:hover{border-color:var(--ink);transform:translateX(2px)}
.roadmap a .n{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);min-width:2.2em}
.roadmap .arrow{align-self:center;height:16px;width:14px;color:var(--ink-3)}
.roadmap .arrow svg{width:14px;height:16px}
.legend-wrap{padding:12px 0 8px}
.legend-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 8px}
.legend-note{font-size:14px;color:var(--ink-2);margin:10px 0 0;max-width:40em}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0;padding:0;list-style:none}
.legend li{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2)}
.legend .sw{width:14px;height:14px;border-radius:4px;background:var(--oc);flex:none}
.legend .obj-ep .sw{background:var(--c-e);box-shadow:0 0 0 2px var(--c-d)}
.legend .sy{font-family:var(--font-math);font-style:italic;color:var(--oc);font-size:16px}
.legend .obj-ep .sy{border-bottom:2px solid var(--c-d)}

/* =====================================================================
   4. SECTIONS
   ===================================================================== */
main{padding-bottom:96px}
.sec{margin-top:128px;scroll-margin-top:calc(var(--strip-h) + 12px)}
.sec:first-child{margin-top:64px}
@media (max-width:640px){.sec{margin-top:96px}.sec:first-child{margin-top:48px}}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;margin-bottom:40px;padding-top:20px;border-top:2px solid var(--ink)}
.sec-num{font-family:var(--font-mono);font-size:30px;font-weight:600;line-height:1;color:var(--ink);padding-top:6px;letter-spacing:-.02em}
.eyebrow{font-size:14px;letter-spacing:.02em;color:var(--ink-2);margin:0 0 6px;font-weight:500}
.sec-head h2{margin:0}
.prose{max-width:68ch}
.prose p{margin-bottom:.9em}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.row.top{align-items:flex-start}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
/* Vector rows must not impose their intrinsic width on a narrow pipeline grid. */
.pipe>*{min-width:0}
.grid-2,.side-by-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:820px){.grid-2,.grid-3,.side-by-side{grid-template-columns:1fr}}
.scroll-x{overflow-x:auto;overflow-y:hidden;max-width:100%;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.dotgrid{background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:18px 18px;background-position:center;border-radius:var(--radius-s)}
.center{text-align:center}
.spacer{height:16px}

/* Card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;margin:0 0 24px;min-width:0}
@media (max-width:640px){.card{padding:20px 16px}}
.card-title{font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--ink-2);margin:0 0 16px;text-transform:none}
.card>:last-child{margin-bottom:0}

/* Companion prose for self-study (hidden in the lean reading mode) */
.companion{max-width:70ch;color:var(--ink-2);font-size:17px;line-height:1.6;border-left:3px solid var(--line);padding:4px 0 4px 22px;margin:0 0 36px}
.companion p{margin:0 0 .8em}
.companion>:last-child{margin-bottom:0}
.companion ul,.companion ol{margin:0 0 .8em;padding-left:1.3em}
.companion::before{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.companion[data-kicker]::before{content:attr(data-kicker)}
.companion.after{margin:40px 0 0}
.companion.after:not([data-kicker])::before{content:"What to remember"}
html.reading-lean .companion{display:none}

/* Callout */
.callout{border-radius:var(--radius);padding:16px 20px;margin:20px 0;border:1px solid var(--line);background:var(--card);font-size:1.05em;line-height:1.45}
.callout>:last-child{margin-bottom:0}
.callout-key{border-left:6px solid var(--ink);font-weight:500;font-size:1.12em}
.callout-note{border-left:6px solid var(--ink-3);background:var(--paper)}
.callout-warn{border-left:6px solid var(--warn);color:var(--ink)}
.callout-warn::before,.callout-note::before,.callout-key::before{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:4px}
.callout-key::before{content:"Key idea"}
.callout-note::before{content:"Note"}
.callout-warn::before{content:"Careful";color:var(--warn)}

/* Reveal */
.reveal{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin:12px 0;padding:0}
.reveal summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;gap:12px;align-items:center}
.reveal summary::-webkit-details-marker{display:none}
.reveal summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);flex:none;transition:transform var(--dur)}
.reveal[open] summary::before{transform:rotate(45deg)}
.reveal summary .q{flex:1}
.reveal summary .hint{font-size:13px;color:var(--ink-3);font-weight:500}
.reveal-body{padding:0 18px 16px 38px;color:var(--ink);border-top:1px dashed var(--line);padding-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:var(--radius-s);border:1.5px solid var(--ink);background:var(--card);
  color:var(--ink);font-weight:600;font-size:15px;line-height:1.2;cursor:pointer;transition:background var(--dur),color var(--dur),transform var(--dur);white-space:nowrap}
.btn:hover{background:var(--ink);color:#fff}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn:disabled:hover{background:var(--card);color:var(--ink)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.btn-primary:disabled:hover{background:var(--ink);color:#fff}
.btn-big{font-size:19px;padding:14px 28px;border-radius:12px}
.btn-quiet{border-color:var(--line);color:var(--ink-2)}
.btn-quiet:hover{border-color:var(--ink)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* =====================================================================
   5. DATA COMPONENTS: chips, vec, mat, heat, bars
   ===================================================================== */
/* token chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);
  font-weight:500;font-size:16px;line-height:1.1;color:var(--ink);transition:background var(--dur),border-color var(--dur),opacity var(--dur),transform var(--dur)}
.chip .chip-i{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);background:var(--paper);border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--ink)}
.chip.is-active{border-color:var(--c-e);background:var(--t-e);color:var(--ink);box-shadow:0 0 0 2px var(--t-e)}
.chip.is-active .chip-i{background:var(--c-e);color:#fff}
.chip.is-muted{opacity:.35}
.chips.lg .chip{font-size:19px;padding:8px 16px 8px 10px}
.chips.lg .chip .chip-i{font-size:13px;min-width:22px;height:22px}
.chip.obj-e.is-active{border-color:var(--c-e)}
.chip.is-hl-k{border-color:var(--c-k);background:var(--t-k)}
.chip.is-hl-v{border-color:var(--c-v);background:var(--t-v)}
.chip.is-hl-q{border-color:var(--c-q);background:var(--t-q)}
.chip.is-slot{border-style:dashed;color:var(--ink-3)}

/* vector */
.vec{display:inline-flex;align-items:center;gap:10px;margin:4px 8px 4px 0;max-width:100%;vertical-align:middle;overflow-x:auto;overflow-y:hidden;padding:3px 0}
.vec-label{flex:none;font-size:1.05em;min-width:1.4em}
.vec-cells{position:relative;display:inline-flex;gap:3px;padding:4px 9px;flex:none;
  border-left:2px solid var(--oc);border-right:2px solid var(--oc)}
.vec-cells::before,.vec-cells::after{content:"";position:absolute;top:0;bottom:0;width:7px;border-top:2px solid var(--oc);border-bottom:2px solid var(--oc)}
.vec-cells::before{left:0}.vec-cells::after{right:0}
.obj-ep .vec-cells{box-shadow:-3px 0 0 -1px var(--oc2),3px 0 0 -1px var(--oc2)}
.obj-m .vec-cells{border-left-style:dashed;border-right-style:dashed}
.obj-m .vec-cells::before,.obj-m .vec-cells::after{border-top-style:dashed;border-bottom-style:dashed}
.cell{display:inline-flex;align-items:center;justify-content:center;min-width:3.6em;padding:3px 6px;border-radius:5px;background:var(--ot);color:var(--ink);
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px;line-height:1.3;transition:background var(--dur),color var(--dur)}
.cell.is-hl{outline:2px solid var(--oc);outline-offset:-1px;font-weight:700}
.cell.is-dim{opacity:.35}
.vec.sm .cell{font-size:13px;min-width:3.2em;padding:2px 4px}
.vec.lg .cell{font-size:16px;min-width:4em;padding:5px 8px}
.vec-dim{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-left:2px}
/* axis names above the cells (AT.ui.vec default when the width matches a named object) */
[hidden]{display:none!important}
.vec-body{display:inline-flex;flex-direction:column;align-items:stretch;flex:none}
.vec-axes{display:inline-flex;gap:3px;padding:0 9px 2px;font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--ink-3);line-height:1.2}
.vec-ax{display:inline-flex;align-items:flex-end;justify-content:center;min-width:3.6em;padding:0 6px;white-space:nowrap;text-align:center;cursor:default}
.vec.sm .vec-ax{min-width:3.2em;padding:0 4px;font-size:10.5px}
.vec.lg .vec-ax{min-width:4em;padding:0 8px}
@supports (grid-template-columns: subgrid){
  .vec.has-axes .vec-body{display:inline-grid;grid-auto-flow:row;column-gap:3px;row-gap:0}
  .vec.has-axes .vec-axes,.vec.has-axes .vec-cells{display:grid;grid-template-columns:subgrid;grid-column:1/-1;align-items:stretch}
  .vec.has-axes .vec-axes{align-items:end}
  .vec.has-axes .vec-cells .cell{justify-self:stretch}
}
.vec.has-axes{align-items:flex-end}
.vec.has-axes>.vec-label,.vec.has-axes>.vec-dim{padding-bottom:9px}
.vec.has-axes.lg>.vec-label,.vec.has-axes.lg>.vec-dim{padding-bottom:11px}

/* matrix */
.mat{display:inline-block;margin:6px 0;max-width:100%;vertical-align:middle;position:relative}
.mat .cell.has-calc{cursor:pointer}
.mat .cell.has-calc:focus-visible{outline:2px solid var(--ink);outline-offset:-1px}
.mat-scroll{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:2px 0 4px}
.mat-grid{display:grid;gap:3px 3px;align-items:stretch;justify-items:stretch;width:max-content}
.mat-corner{min-width:0}
.mat-cl,.mat-rl{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);display:flex;align-items:flex-end;justify-content:center;padding:0 2px 3px;white-space:nowrap;line-height:1.2}
.mat-rl{justify-content:flex-end;align-items:center;padding:0 8px 0 0}
.mat-rl.is-hl,.mat-cl.is-hl{color:var(--ink);font-weight:700}
.mat-lb,.mat-rb{width:8px;border:2px solid var(--oc);align-self:stretch}
.mat-lb{border-right:0}
.mat-rb{border-left:0}
.obj-ep .mat-lb{box-shadow:-3px 0 0 -1px var(--oc2)}
.obj-ep .mat-rb{box-shadow:3px 0 0 -1px var(--oc2)}
.mat .cell{border-radius:4px;min-width:3.8em}
.mat .cell.is-hl-row,.mat .cell.is-hl-col{box-shadow:inset 0 0 0 1.5px var(--oc)}
.mat .cell.is-hl{outline:2.5px solid var(--ink);outline-offset:-1px;font-weight:700;z-index:1}
.mat .cell.is-heat{background:var(--heat,#fff);color:var(--ink)}
.mat .cell.is-heat.is-dark{color:#fff}
.mat .cell.is-masked{background:repeating-linear-gradient(45deg,#F1F2F5 0 4px,#DADDE3 4px 6px);color:var(--c-mask);font-weight:500}
.mat .cell.is-masked.is-leak{background:repeating-linear-gradient(45deg,var(--t-a) 0 4px,#FBC9D3 4px 6px);color:var(--warn)}
.mat .cell.is-leak:not(.is-masked){box-shadow:inset 0 0 0 2px var(--warn)}
.mat-cap{font-size:14px;color:var(--ink-2);margin:8px 0 0;text-align:left}
.mat-dim{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-left:6px}
.mat.sm .cell{font-size:13px;min-width:3.2em;padding:2px 4px}
.mat.sm .mat-cl,.mat.sm .mat-rl{font-size:11.5px}
.mat-op{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-math);font-size:22px;color:var(--ink-2);padding:0 10px;vertical-align:middle;min-height:40px}
.heat .cell{min-width:3.6em;cursor:default}
.heat .cell.is-hover{outline:2px solid var(--ink);outline-offset:-1px}

/* spreadsheet table (AT.ui.table / dotTable / mixTable) */
.dt-fig{position:relative;margin:8px 0 4px;max-width:100%;display:block}
.dt-scroll{overflow-x:auto;overflow-y:hidden;max-width:100%;padding-bottom:4px}
.dt{border-collapse:separate;border-spacing:0;width:max-content;max-width:none;font-size:15px;line-height:1.3;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dt th,.dt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 12px;vertical-align:middle;white-space:nowrap;text-align:right;background:var(--card)}
.dt thead th{background:var(--paper);color:var(--ink-2);font-family:var(--font-ui);font-weight:600;font-size:14px;font-variant-caps:all-small-caps;letter-spacing:.05em;line-height:1.2;vertical-align:bottom}
.dt thead th .katex{font-variant-caps:normal;letter-spacing:0;font-size:1.02em}
.dt thead th.dt-corner{text-align:left}
.dt tbody th,.dt tfoot th{background:var(--paper);color:var(--ink);font-weight:500;text-align:left;font-family:var(--font-ui);font-size:15px}
.dt th .katex{font-size:1.06em}
.dt td.dt-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px;min-width:4.6em;color:var(--ink)}
.dt-fig.lg .dt td.dt-num{font-size:16px;min-width:5.2em;padding:10px 14px}
.dt-fig.lg .dt tbody th,.dt-fig.lg .dt tfoot th{font-size:17px}
.dt td.dt-text{text-align:left;font-family:var(--font-ui);color:var(--ink-2);white-space:normal}
/* object tints: per column (td.dt-tint) or per row (tr.dt-tint) */
.dt td.dt-tint{background:var(--ot)}
.dt tbody tr.dt-tint td.dt-num,.dt tfoot tr.dt-tint td.dt-num{background:var(--ot)}
.dt thead th.dt-tint{color:var(--oc)}
.dt tbody tr.dt-tint th,.dt tfoot tr.dt-tint th{color:var(--oc)}
.dt tbody tr.dt-tint th .katex,.dt tfoot tr.dt-tint th .katex{color:inherit}
.dt .dt-lead-last{border-right:2px solid var(--line)}
.dt .dt-comp-first{border-left:2px solid var(--line)}
.dt tbody tr td.is-heat,.dt tbody tr.dt-tint td.dt-num.is-heat{background:var(--heat,#fff)}
.dt td.is-heat.is-dark{color:#fff}
.dt tbody tr td.is-masked,.dt tbody tr.dt-tint td.dt-num.is-masked{background:repeating-linear-gradient(45deg,#F1F2F5 0 4px,#DADDE3 4px 6px);color:var(--c-mask);text-align:center;text-decoration:none}
.dt tr.is-hl th,.dt tr.is-hl td{font-weight:700}
.dt tr.is-hl td.dt-num{box-shadow:inset 0 0 0 1.5px var(--oc,var(--ink))}
.dt tr.is-hl td.dt-num:empty{box-shadow:none}
.dt tr.is-dim td{opacity:.42}
.dt tr.is-dim th{color:var(--ink-3)}
.dt tfoot th,.dt tfoot td{border-top:2px solid var(--ink-2);font-weight:600}
.dt-sticky tbody th,.dt-sticky tfoot th,.dt-sticky thead th.dt-corner{position:sticky;left:0;z-index:2}
.dt-sticky tbody th,.dt-sticky tfoot th{box-shadow:1px 0 0 var(--line)}
.dt td.has-tip{cursor:help;text-decoration:underline dotted var(--ink-3);text-underline-offset:3px}
.dt td.has-tip:hover,.dt td.has-tip:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.dt-tip{position:absolute;left:0;top:0;z-index:30;max-width:min(560px,calc(100vw - 48px));padding:9px 12px;border-radius:8px;background:var(--ink);color:#fff;
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;line-height:1.5;white-space:normal;pointer-events:none;opacity:0;transform:translateY(-3px);
  transition:opacity var(--dur),transform var(--dur);box-shadow:0 8px 24px rgba(20,23,31,.18)}
.dt-tip.is-on{opacity:1;transform:none}
.dt-cap{font-size:14px;color:var(--ink-2);margin:10px 0 0;text-align:left;max-width:68ch}
.dt-note{font-size:13.5px;color:var(--ink-3);margin:6px 0 0}
.dt tbody th.dt-tint{color:var(--oc)}
.dt td.dt-num.is-zero,.dt td.dt-tint.is-zero{color:var(--c-mask);background:var(--card)}
.dt td.has-calc{cursor:pointer}
/* worksheets (AT.ui.dotCalc / matVecCalc) and the click popover that holds them */
.calc{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px;max-width:100%;color:var(--ink)}
.calc-scroll{overflow-x:auto;overflow-y:hidden;max-width:100%;padding-bottom:2px}
.calc-t{border-collapse:separate;border-spacing:3px;width:max-content;margin:0 -3px}
.calc-t th{font-family:var(--font-ui);font-weight:600;font-size:11px;letter-spacing:.03em;color:var(--ink-3);text-align:center;padding:0 4px 1px;white-space:nowrap;vertical-align:bottom;line-height:1.2;cursor:default}
.calc-t th.calc-rl{text-align:right;font-size:13px;font-weight:600;color:var(--ink-2);padding:0 8px 0 0;vertical-align:middle;letter-spacing:0}
.calc-t tr[class*="obj-"] th.calc-rl{color:var(--oc)}
.calc-t th.calc-res-h{font-family:var(--font-mono);font-size:14px;color:var(--ink-2)}
.calc-t td{padding:3px 7px;border-radius:5px;text-align:right;min-width:3.6em;background:var(--t-neutral);color:var(--ink);white-space:nowrap;line-height:1.3}
.calc-t td.tint{background:var(--ot)}
.calc-t td.calc-blank{background:transparent}
.calc-t td.calc-term{background:transparent;color:var(--ink);padding-left:4px;padding-right:4px}
.calc-t td.calc-term .calc-plus{color:var(--ink-3)}
.calc-t td.calc-zero{color:var(--c-mask)}
.calc-t td.calc-zero .calc-plus{color:var(--c-mask)}
.calc-t td.calc-res{font-weight:700}
.calc-line{margin:6px 0 0;font-size:14px;color:var(--ink-2);white-space:normal;line-height:1.6}
.calc-r{font-weight:700;color:var(--ink);padding:1px 6px;border-radius:5px;background:var(--ot,var(--t-neutral))}
.calc-line.obj-a .calc-r{background:var(--t-a)}
.calc-line.calc-masked{color:var(--c-mask)}
.calc-outrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.calc-outlab{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--oc,var(--ink-2))}
.calc-outrow .vec{margin:0}
.calc-pop{position:absolute;left:0;top:0;z-index:31;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(20,23,31,.16);padding:12px 14px 12px;max-width:min(640px,calc(100vw - 24px));min-width:min(260px,calc(100vw - 24px))}
.calc-pop-title{font-family:var(--font-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 30px 8px 0}
.calc-close{position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:20px;line-height:1;cursor:pointer;font-family:var(--font-ui)}
.calc-close:hover{background:var(--paper);color:var(--ink)}
.calc-close:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.notation-note{font-size:13.5px;color:var(--ink-2);margin:8px 0 0;max-width:60ch;line-height:1.45}
/* notation card (AT.ui.notationCard) */
.notation-card{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:20px 28px;align-items:start}
.notation-group{min-width:0}
.notation-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 8px}
.dt-notation{width:100%;table-layout:auto;font-size:14px}
.dt-notation th,.dt-notation td{padding:6px 10px;white-space:normal;text-align:left;vertical-align:baseline}
.dt-notation tbody th{font-weight:500;white-space:nowrap}
.dt-notation td.nt-mean{color:var(--ink-2);font-size:14px;line-height:1.35;min-width:13em;width:100%}
.dt-notation td.nt-shape{white-space:nowrap;color:var(--ink-2)}
.dt-notation .nt-dims{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-left:6px}
.notation-details{margin:20px 0 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.notation-details summary{cursor:pointer;padding:12px 18px;font-weight:600;font-size:15px;list-style:none;display:flex;gap:12px;align-items:center}
.notation-details summary::-webkit-details-marker{display:none}
.notation-details summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);flex:none;transition:transform var(--dur)}
.notation-details[open] summary::before{transform:rotate(45deg)}
.notation-details summary .hint{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:auto}
.notation-details>.notation-card{padding:4px 18px 18px}

/* probability bars */
.bars{display:grid;grid-template-columns:auto minmax(120px,1fr) auto;gap:6px 10px;align-items:center;margin:8px 0;max-width:100%}
.bars .bl{font-family:var(--font-mono);font-size:14.5px;text-align:right;color:var(--ink);white-space:nowrap}
.bars .bt{height:20px;background:var(--t-neutral);border-radius:5px;overflow:hidden;position:relative}
.bars .bf{height:100%;width:0;background:var(--oc,var(--ink-2));border-radius:5px;transition:width 350ms cubic-bezier(.4,0,.2,1)}
.bars.obj-neutral .bf{background:var(--ink-2)}
.bars .bv{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);min-width:3.4em}
.bars .is-hl .bl,.bars .is-hl .bv{font-weight:700;color:var(--ink)}
.bars .is-hl .bf{background:var(--ink)}
.bars.obj-a .is-hl .bf{background:var(--c-a)}
.bars .is-dim .bl,.bars .is-dim .bv{opacity:.45}
.bars .is-dim .bf{opacity:.35}
.bars.lg .bt{height:26px}
.bars.lg .bl{font-size:17px}
.bars.lg .bv{font-size:16px}

/* =====================================================================
   6. CONTROLS: slider, toggle, stepper
   ===================================================================== */
.slider{display:inline-flex;align-items:center;gap:12px;padding:6px 0;max-width:100%;flex-wrap:wrap}
.slider-label{font-weight:600;font-size:15px}
.slider input[type=range]{width:220px;max-width:60vw;accent-color:var(--ink);height:28px;margin:0;cursor:pointer}
.slider-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:15px;min-width:3em;color:var(--ink);background:var(--t-neutral);padding:2px 8px;border-radius:6px}
.toggle{display:inline-flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;
  font-weight:600;font-size:15px;transition:border-color var(--dur)}
.toggle:hover{border-color:var(--ink)}
.toggle-track{width:42px;height:24px;border-radius:999px;background:var(--ink-3);position:relative;flex:none;transition:background var(--dur)}
.toggle-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--dur);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle[aria-pressed=true] .toggle-track{background:var(--ink)}
.toggle[aria-pressed=true] .toggle-knob{transform:translateX(18px)}
.toggle-state{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);min-width:2.2em;text-transform:uppercase}

/* stepper */
.stepper{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px 20px;margin:12px 0}
.stepper-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.stepper-count{font-family:var(--font-mono);font-size:14px;color:var(--ink-2);margin-left:auto}
.stepper-body{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);gap:20px}
.stepper.is-big .stepper-body{grid-template-columns:minmax(220px,300px) minmax(0,1fr)}
@media (max-width:820px){.stepper-body,.stepper.is-big .stepper-body{grid-template-columns:1fr}}
.stepper-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.stepper-list li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;color:var(--ink-3);font-size:15px;line-height:1.3;transition:background var(--dur),color var(--dur)}
.stepper-list li .sn{font-family:var(--font-mono);font-size:12px;min-width:1.6em;text-align:right}
.stepper-list li .st{font-weight:500}
.stepper-list li .stex{grid-column:2;font-size:14px}
.stepper-list li.is-done{color:var(--ink-2)}
.stepper-list li.is-done .sn::after{content:" ✓";color:var(--ink-3)}
.stepper-list li.is-current{background:var(--ink);color:#fff}
.stepper-list li.is-current .sn{color:#fff}
.stepper-list li.is-current .katex{color:#fff}
.stepper-list li.is-current .m-e,.stepper-list li.is-current .m-q,.stepper-list li.is-current .m-k,.stepper-list li.is-current .m-v,.stepper-list li.is-current .m-a,.stepper-list li.is-current .m-d,.stepper-list li.is-current .m-ep{color:#fff}
.stepper-list li.is-current .m-ep{border-color:#fff}
.stepper-list li.is-current .stex{color:#fff}
.stepper-list.compact li{padding:3px 8px;font-size:14px}
.stepper-stage{min-height:120px;min-width:0}
.stepper-stage .stage-title{font-weight:700;font-size:1.15em;margin:0 0 6px}
.stepper-stage .stage-note{color:var(--ink-2);margin:0 0 12px;max-width:46em}
.stepper-stage .stage-tex{margin:6px 0 12px;overflow-x:auto}
.stepper.is-big .btn-next{font-size:19px;padding:12px 26px}

/* =====================================================================
   7. MOTIF (pipeline SVG) + FLOW dots
   ===================================================================== */
.motif{width:100%;max-width:780px;margin:8px auto}
.motif.sm{max-width:480px}
.motif svg{width:100%;height:auto;overflow:visible;font-family:var(--font-ui)}
.motif .st{fill:var(--ink);font-family:var(--font-math);font-style:italic;font-size:19px}
.motif .st.ui{font-family:var(--font-ui);font-style:normal;font-weight:600;font-size:14px}
.motif .sub{fill:var(--ink-3);font-size:11.5px;font-weight:500;font-style:normal;font-family:var(--font-ui)}
.motif .edge{fill:none;stroke:var(--ink-3);stroke-width:1.8}
.motif .edge-res{stroke:var(--c-e);stroke-dasharray:4 4}
.motif .box{stroke-width:2;rx:9;ry:9}
.motif g[data-stage]{transition:opacity var(--dur)}
.motif.has-active g[data-stage]:not(.is-active){opacity:.32}
.motif g.is-active .box{stroke-width:3.5;filter:drop-shadow(0 2px 6px rgba(20,23,31,.18))}
.motif .stage-e .box{fill:var(--t-e);stroke:var(--c-e)}
.motif .stage-e .st{fill:var(--c-e)}
.motif .stage-qkv .box-q{fill:var(--t-q);stroke:var(--c-q)} .motif .stage-qkv .st-q{fill:var(--c-q)}
.motif .stage-qkv .box-k{fill:var(--t-k);stroke:var(--c-k)} .motif .stage-qkv .st-k{fill:var(--c-k)}
.motif .stage-qkv .box-v{fill:var(--t-v);stroke:var(--c-v)} .motif .stage-qkv .st-v{fill:var(--c-v)}
.motif .stage-att .box{fill:var(--t-a);stroke:var(--c-a)} .motif .stage-att .st{fill:var(--c-a)}
.motif .stage-delta .box{fill:var(--t-d);stroke:var(--c-d)} .motif .stage-delta .st{fill:var(--c-d)}
.motif .stage-add .box{fill:var(--card);stroke:var(--ink)} .motif .stage-add .st{fill:var(--ink);font-style:normal;font-size:24px}
.motif .stage-ep .box{fill:var(--t-e);stroke:var(--c-d)} .motif .stage-ep .st{fill:var(--c-e)}
.flow-dot{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;z-index:5;will-change:transform;box-shadow:0 0 0 2px rgba(255,255,255,.7)}

/* =====================================================================
   8. FOOTER, MOTION, PRINT
   ===================================================================== */
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--ink-3);font-size:14px}
/* node-network sketch (AT.netSketch) */
.netsk{max-width:640px;margin:8px auto}
.netsk svg{width:100%;height:auto;overflow:visible;font-family:var(--font-ui)}
.netsk .node{transition:transform 320ms cubic-bezier(.4,0,.2,1),opacity 220ms}
.netsk .edges-set{transition:opacity 220ms}
.netsk .edges line{stroke:var(--ink-3);stroke-width:.7;opacity:.42}
.netsk .edges line.hl{stroke:var(--ink);stroke-width:1.2;opacity:.85}
.netsk .node circle{stroke-width:1.8}
.netsk .node.e circle{fill:var(--t-e);stroke:var(--c-e)}
.netsk .node.hid circle{fill:var(--t-neutral);stroke:var(--ink-3)}
.netsk .node.out circle{fill:var(--card);stroke:var(--ink-3)}
.netsk .node.out.is-hl circle{stroke:var(--ink);stroke-width:2.6;fill:var(--paper)}
.netsk .node.out.is-hl .out-l{font-weight:700}
.netsk .out-l{font-family:var(--font-mono);font-size:13px;fill:var(--ink)}
.netsk .ell text{fill:var(--ink-3);font-size:18px;font-weight:700}
.netsk .cap{font-size:11.5px;fill:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.netsk .lab-in{overflow:visible}
.netsk .lab-in-box{display:flex;justify-content:flex-end;align-items:center;height:28px;font-size:15px;line-height:1}
.frame-sub{display:none}
body.present .frame-sub{display:block}

/* =====================================================================
   9. SERIES NAV + STRIP BUTTONS
   ===================================================================== */
.series-nav{font-size:14px;color:var(--ink-3);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.series-nav .series-lab{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.series-nav a{color:var(--ink-2)}
.series-nav .series-coming{color:var(--ink-3)}
.series-nav .coming-tag{font-family:var(--font-mono);font-size:.78em;letter-spacing:.04em;text-transform:uppercase}
.series-nav .sep{color:var(--ink-3)}
.series-foot{margin:0 0 10px}

      road.appendChild(li);
    });
    if (!chain.length) road.parentNode.hidden = true;
  }
  /* strip chips: one per object the part uses; target = the first section that introduces it */
  var chipHost = el('strip-chips');
  if (chipHost) {
    objs.forEach(function(k){
      var o = null; defs.forEach(function(d){ if (d.cls === k) o = d; });
      if (!o) return;
      var target = '';
      for (var i = 0; i < secList.length; i++) { var lit = (secList[i].lit || '').trim().split(/\s+/); if (lit.indexOf(k) >= 0) { target = secList[i].id; break; } }
      var li = document.createElement('li');
      var b = document.createElement('button'); b.type = 'button'; b.className = 'nchip obj-' + k; b.setAttribute('data-obj', k);
      if (target) b.setAttribute('data-target', target);
      b.setAttribute('data-tip', o.tip || o.def || ''); b.textContent = o.sym;
      li.appendChild(b); chipHost.appendChild(li);
    });
  }
  setText('strip-title', PART.title || '');

  /* ---- KaTeX boot: render all static math, with the colour macros ---- */
  var macros = {
    "\\ve": "\\htmlClass{m-e}{#1}",
    "\\vq": "\\htmlClass{m-q}{#1}",
    "\\vk": "\\htmlClass{m-k}{#1}",
    "\\vv": "\\htmlClass{m-v}{#1}",
    "\\va": "\\htmlClass{m-a}{#1}",
    "\\vd": "\\htmlClass{m-d}{#1}",
    "\\vp": "\\htmlClass{m-ep}{#1}"
  };
  var opts = (A && A.katexOpts) ? A.katexOpts() : { throwOnError:false, trust:true, strict:false, macros:macros };
  var renderOpts = Object.assign({}, opts, {
    delimiters: [
      {left:"$$", right:"$$", display:true},
      {left:"\\[", right:"\\]", display:true},
      {left:"$", right:"$", display:false},
      {left:"\\(", right:"\\)", display:false}
    ],
    ignoredTags: ["script","noscript","style","textarea","pre","code","option"],
    ignoredClasses: ["no-math"]
  });
  if (typeof renderMathInElement === 'function') {
    try { renderMathInElement(document.body, renderOpts); } catch (e) { console.error('KaTeX boot failed', e); }
  }

  /* ---- Notation card (hero): the rows of this part ---- */
  var ncHost = el('notation-card');
  if (ncHost && A && A.ui && A.ui.notationCard) { try { A.ui.notationCard({ into: ncHost, part: PART.notation || ('part' + (PART.part || 2)) }); } catch (e) { console.error('notation card failed', e); } }
  if (ncHost && !ncHost.firstChild && el('notation')) el('notation').hidden = true;

  /* ---- Reading mode: full (with companion notes) / lean (lecture view); persisted ---- */
  var readingBtns = Array.prototype.slice.call(document.querySelectorAll('.reading-btn'));
  function applyReading(mode, persist){
    var lean = mode === 'lean';
    document.documentElement.classList.toggle('reading-lean', lean);
    readingBtns.forEach(function(b){ b.setAttribute('aria-pressed', (b.getAttribute('data-mode') === (lean ? 'lean' : 'full')) ? 'true' : 'false'); });
    if (persist) { try { localStorage.setItem('at-reading', lean ? 'lean' : 'full'); } catch (e) { /* ignore */ } }
  }
  var stored = null; try { stored = localStorage.getItem('at-reading'); } catch (e) { /* ignore */ }
  applyReading(stored === 'lean' ? 'lean' : 'full', false);
  readingBtns.forEach(function(b){ b.addEventListener('click', function(){ applyReading(b.getAttribute('data-mode'), true); }); });

  /* ---- Notation strip: chips light up as sections are reached; progress + current section ---- */
  var strip = el('strip');
  if (!strip) return;
  var chips = {};
  strip.querySelectorAll('.nchip').forEach(function(c){
    chips[c.getAttribute('data-obj')] = c;
    c.addEventListener('click', function(){
      var t = document.getElementById(c.getAttribute('data-target') || '');
      if (!t) return;
      if (A && A.present && A.present.isActive()) { A.present.go(t.id, 1, 0); return; }
      t.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  var secs = Array.prototype.slice.call(document.querySelectorAll('main .sec'));
  var numEl = el('strip-num'), titleEl = el('strip-title');
  var lit = {};
  function light(obj){ if (!lit[obj] && chips[obj]) { lit[obj] = true; chips[obj].classList.add('is-lit'); } }
  function lightThrough(idx){
    for (var i = 0; i <= idx && i < secs.length; i++) {
      var l = (secs[i].getAttribute('data-lit') || '').trim();
      if (l) l.split(/\s+/).forEach(light);
    }
  }
  function setCurrent(idx){
    var s = secs[idx]; if (!s) return;
    var id = s.id || '', title = s.getAttribute('data-title') || (s.querySelector('h2') ? s.querySelector('h2').textContent : '');
    if (numEl) numEl.textContent = id.replace(/^s/, '') || String(idx + 1);
    if (titleEl) titleEl.textContent = title;
    lightThrough(idx);
    Object.keys(chips).forEach(function(k){ chips[k].classList.remove('is-current'); });
    var l = (s.getAttribute('data-lit') || '').trim();
    if (l) l.split(/\s+/).forEach(function(o){ if (chips[o]) chips[o].classList.add('is-current'); });
  }
  if (A) A.strip = { setCurrent: setCurrent, lightThrough: lightThrough, sections: secs, chips: chips };
  if ('IntersectionObserver' in window && secs.length) {
    var io = new IntersectionObserver(function(entries){
      if (document.body.classList.contains('present')) return;
      entries.forEach(function(en){ if (en.isIntersecting) setCurrent(secs.indexOf(en.target)); });
    }, { rootMargin: '-35% 0px -55% 0px', threshold: 0 });
    secs.forEach(function(s){ io.observe(s); });
    var io2 = new IntersectionObserver(function(entries){
      if (document.body.classList.contains('present')) return;
      entries.forEach(function(en){ if (en.isIntersecting || en.boundingClientRect.top < 0) lightThrough(secs.indexOf(en.target)); });
    }, { rootMargin: '0px', threshold: 0 });
    secs.forEach(function(s){ io2.observe(s); });
  } else {
    lightThrough(secs.length - 1);
  }
  var bar = el('progress'), ticking = false;
  function progress(){
    ticking = false;
    if (document.body.classList.contains('present')) return;
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var p = h > 0 ? Math.min(1, Math.max(0, window.scrollY / h)) : 0;
    if (bar) bar.style.width = (p * 100).toFixed(2) + '%';
  }
  window.addEventListener('scroll', function(){ if (!ticking) { ticking = true; requestAnimationFrame(progress); } }, { passive: true });
  window.addEventListener('resize', progress);
  progress();
  /* ---- Presentation buttons (the runtime lives in shared.js: AT.present) ---- */
  var pb = el('present-btn'), prb = el('presenter-btn');
  if (A && A.present) {
    if (pb) pb.addEventListener('click', function(){ A.present.toggle(); });
    if (prb) prb.addEventListener('click', function(){ A.present.openPresenter(); });
    function syncPresentButton(st){ if (pb) { pb.textContent = st.active ? 'Exit' : 'Present'; pb.setAttribute('aria-pressed', st.active ? 'true' : 'false'); pb.setAttribute('aria-label', st.active ? 'Exit presentation and return to reading' : 'Present the current section'); } }
    A.present.on('change', syncPresentButton); syncPresentButton(A.present.state());
  } else { if (pb) pb.hidden = true; if (prb) prb.hidden = true; }
})();
</script>
