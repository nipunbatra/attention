<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Lowercase words and separate punctuation" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Lowercase words and separate punctuation</title><text x="25" y="50" fill="#14171F" font-size="32" font-weight="500" text-anchor="start">Text: Lily found a red ball.</text><text x="25" y="110" fill="#245EDB" font-size="27" font-weight="600" text-anchor="start">Tokens:</text><rect x="160" y="75" width="140" height="70" rx="6" fill="#fff" stroke="#245EDB"/><text x="230" y="120" fill="#245EDB" font-size="30" font-weight="500" text-anchor="middle">lily</text><rect x="315" y="75" width="140" height="70" rx="6" fill="#fff" stroke="#245EDB"/><text x="385" y="120" fill="#245EDB" font-size="30" font-weight="500" text-anchor="middle">found</text><rect x="470" y="75" width="140" height="70" rx="6" fill="#fff" stroke="#245EDB"/><text x="540" y="120" fill="#245EDB" font-size="30" font-weight="500" text-anchor="middle">a</text><rect x="625" y="75" width="140" height="70" rx="6" fill="#fff" stroke="#245EDB"/><text x="695" y="120" fill="#245EDB" font-size="30" font-weight="500" text-anchor="middle">red</text><rect x="780" y="75" width="140" height="70" rx="6" fill="#fff" stroke="#245EDB"/><text x="850" y="120" fill="#245EDB" font-size="30" font-weight="500" text-anchor="middle">ball</text><rect x="935" y="75" width="140" height="70" rx="6" fill="#fff" stroke="#245EDB"/><text x="1005" y="120" fill="#245EDB" font-size="30" font-weight="500" text-anchor="middle">.</text><text x="25" y="220" fill="#14171F" font-size="32" font-weight="500" text-anchor="start">5 word tokens + 1 punctuation token = 6 ordinary tokens</text></svg>