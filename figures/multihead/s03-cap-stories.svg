<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 358" role="img" aria-label="A source story opening and the disjoint document split" style="font-family:Avenir Next,Segoe UI,Arial,sans-serif"><title>A source story opening and the disjoint document split</title><text x="20" y="30" font-size="23" fill="#586174" text-anchor="start" font-weight="500">An actual TinyStories opening · The old hotel</text><text x="20" y="77" font-size="26" fill="#14171f" text-anchor="start" font-weight="500">Once upon a time, there was an old hotel. The hotel was very big and had many rooms.</text><g><rect x="20" y="170" width="340" height="110" rx="4" fill="white" stroke="#245edb" stroke-width="1.5"/><text x="190" y="208" font-size="27" fill="#245edb" text-anchor="middle" font-weight="650">Train</text><text x="190" y="251" font-size="28" fill="#14171f" text-anchor="middle" font-weight="500">4,822 stories</text></g><text x="190" y="326" font-size="25" fill="#586174" text-anchor="middle" font-weight="500">Learn parameters</text><g><rect x="410" y="170" width="340" height="110" rx="4" fill="white" stroke="#245edb" stroke-width="1.5"/><text x="580" y="208" font-size="27" fill="#245edb" text-anchor="middle" font-weight="650">Validation</text><text x="580" y="251" font-size="28" fill="#14171f" text-anchor="middle" font-weight="500">586 stories</text></g><text x="580" y="326" font-size="25" fill="#586174" text-anchor="middle" font-weight="500">Choose a checkpoint</text><g><rect x="800" y="170" width="340" height="110" rx="4" fill="white" stroke="#245edb" stroke-width="1.5"/><text x="970" y="208" font-size="27" fill="#245edb" text-anchor="middle" font-weight="650">Test</text><text x="970" y="251" font-size="28" fill="#14171f" text-anchor="middle" font-weight="500">592 stories</text></g><text x="970" y="326" font-size="25" fill="#586174" text-anchor="middle" font-weight="500">Report held-out loss</text></svg>