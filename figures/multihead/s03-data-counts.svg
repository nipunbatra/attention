<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Example counts for each data split" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Example counts for each data split</title><rect x="20" y="15" width="1120" height="228" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="54.33" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Split</text><text x="222" y="54.33" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Ordinary tokens</text><text x="512" y="54.33" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">One EOS / story</text><text x="822" y="54.33" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Total targets</text><path d="M20 72 L1140 72" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="111.33" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Train</text><text x="222" y="111.33" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">964,338</text><text x="512" y="111.33" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">4,822</text><text x="822" y="111.33" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">969,160</text><path d="M20 129 L1140 129" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="168.32999999999998" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Validation</text><text x="222" y="168.32999999999998" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">119,634</text><text x="512" y="168.32999999999998" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">586</text><text x="822" y="168.32999999999998" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">120,220</text><path d="M20 186 L1140 186" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="225.32999999999998" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Test</text><text x="222" y="225.32999999999998" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">119,801</text><text x="512" y="225.32999999999998" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">592</text><text x="822" y="225.32999999999998" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">120,393</text><text x="25" y="295" fill="#4A5160" font-size="25" font-weight="500" text-anchor="start">For one story: 6 + 1 = 7. Across training stories: 964,338 + 4,822 = 969,160.</text></svg>