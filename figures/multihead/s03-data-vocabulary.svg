<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Every vocabulary item gets an integer ID" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Every vocabulary item gets an integer ID</title><rect x="20" y="15" width="650" height="276" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="46.739999999999995" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">ID</text><text x="97" y="46.739999999999995" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Token</text><text x="227" y="46.739999999999995" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Meaning</text><path d="M20 61 L670 61" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="92.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">0</text><text x="97" y="92.74" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">&lt;PAD&gt;</text><text x="227" y="92.74" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">Padding</text><path d="M20 107 L670 107" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="138.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">1</text><text x="97" y="138.74" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">&lt;BOS&gt;</text><text x="227" y="138.74" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">Beginning of sequence</text><path d="M20 153 L670 153" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="184.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">2</text><text x="97" y="184.74" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">&lt;EOS&gt;</text><text x="227" y="184.74" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">End of sequence</text><path d="M20 199 L670 199" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="230.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">3</text><text x="97" y="230.74" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">&lt;UNK&gt;</text><text x="227" y="230.74" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">Unknown token</text><path d="M20 245 L670 245" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="276.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">4</text><text x="97" y="276.74" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">.</text><text x="227" y="276.74" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">Punctuation</text><rect x="710" y="15" width="430" height="276" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="722" y="46.739999999999995" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">ID</text><text x="792" y="46.739999999999995" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Vocabulary item</text><path d="M710 61 L1140 61" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="722" y="92.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">5</text><text x="792" y="92.74" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">a</text><path d="M710 107 L1140 107" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="722" y="138.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">6</text><text x="792" y="138.74" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">ball</text><path d="M710 153 L1140 153" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="722" y="184.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">7</text><text x="792" y="184.74" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">found</text><path d="M710 199 L1140 199" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="722" y="230.74" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">8</text><text 