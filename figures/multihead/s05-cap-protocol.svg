<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 278" role="img" aria-label="Model · How it reads the 64-token window" style="font-family:Avenir Next,Segoe UI,Arial,sans-serif"><title>Model · How it reads the 64-token window</title><g data-cell-left="20" data-cell-right="400"><text x="30" y="40" font-size="24" fill="#586174" text-anchor="start" font-weight="650">Model</text></g><g data-cell-left="400" data-cell-right="1140"><text x="410" y="40" font-size="24" fill="#586174" text-anchor="start" font-weight="650">How it reads the 64-token window</text></g><path d="M20 57 H1140" fill="none" stroke="#d9dfe9" stroke-width="1"/><g data-cell-left="20" data-cell-right="400"><text x="30" y="106" font-size="26" fill="#14171f" text-anchor="start" font-weight="500">MLP</text></g><g data-cell-left="400" data-cell-right="1140"><text x="410" y="106" font-size="26" fill="#14171f" text-anchor="start" font-weight="500">Flatten 64 × 64 → 4,096 inputs</text></g><path d="M20 123 H1140" fill="none" stroke="#d9dfe9" stroke-width="1"/><g data-cell-left="20" data-cell-right="400"><text x="30" y="172" font-size="26" fill="#14171f" text-anchor="start" font-weight="500">Single head</text></g><g data-cell-left="400" data-cell-right="1140"><text x="410" y="172" font-size="26" fill="#14171f" text-anchor="start" font-weight="500">One source-weight pattern, width 64</text></g><path d="M20 189 H1140" fill="none" stroke="#d9dfe9" stroke-width="1"/><g data-cell-left="20" data-cell-right="400"><text x="30" y="238" font-size="26" fill="#14171f" text-anchor="start" font-weight="500">Four heads</text></g><g data-cell-left="400" data-cell-right="1140"><text x="410" y="238" font-size="26" fill="#14171f" text-anchor="start" font-weight="500">Four source-weight patterns, width 16 each</text></g><path d="M20 255 H1140" fill="none" stroke="#d9dfe9" stroke-width="1"/></svg>