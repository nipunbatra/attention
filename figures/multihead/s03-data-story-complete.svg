<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-label="Read one complete story" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Read one complete story</title><text x="25" y="35" fill="#245EDB" font-size="26" font-weight="600" text-anchor="start">TinyStories · source row 1992490 · complete text</text><text x="25" y="77" fill="#0F766E" font-size="27" font-weight="600" text-anchor="start">52 words · 60 tokens</text><text x="25" y="135" fill="#14171F" font-size="29" font-weight="500" text-anchor="start">Once upon a time, there was an old hotel. The hotel was very big and had</text><text x="25" y="177" fill="#14171F" font-size="29" font-weight="500" text-anchor="start">many rooms. One day, a big storm came and lightning struck the hotel. The</text><text x="25" y="219" fill="#14171F" font-size="29" font-weight="500" text-anchor="start">hotel was very old and could not handle the strike. The hotel fell down and</text><text x="25" y="261" fill="#14171F" font-size="29" font-weight="500" text-anchor="start">everyone had to go home. The end.</text><text x="25" y="332" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">Everything above is one document, from the opening to “The end.”</text></svg>