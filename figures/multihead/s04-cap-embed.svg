-size="19" text-anchor="middle" fill="#50586a" font-weight="500">Mask + A</text></g><g data-stage="mix3" data-active="false"><rect x="761" y="280" width="92" height="32" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="807.0" y="301" font-size="19" text-anchor="middle" fill="#50586a" font-weight="500">AV</text></g><g data-stage="join" data-active="false"><rect x="876" y="211" width="109" height="56" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="930.5" y="232" font-size="19" text-anchor="middle" fill="#50586a" font-weight="500">Join</text><text x="930.5" y="259" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">4 × 16 = 64</text></g><g data-stage="project" data-active="false"><rect x="1009" y="157" width="137" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="1077.5" y="178" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">W_O</text><text x="1077.5" y="201" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">[B, T, 64]</text></g><g data-stage="residual" data-active="false"><rect x="1009" y="278" width="137" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="1077.5" y="299" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">+ original E</text><text x="1077.5" y="322" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">[B, T, 64]</text></g><g data-stage="predict" data-active="false"><rect x="894" y="350" width="252" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="1020.0" y="371" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">Final row + classifier</text><text x="1020.0" y="394" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">[B, 64] → [B, C]</text></g><g data-stage="loss" data-active="false"><rect x="625" y="350" width="233" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="741.5" y="371" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">Loss against y</text><text x="741.5" y="394" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">cross-entropy</text></g><g data-stage="train" data-active="false"><rect x="346" y="350" width="241" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="466.5" y="371" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">Backward + update</text><text x="466.5" y="394" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">repeat with next batch</text></g><g data-stage="decode" data-active="false"><rect x="625" y="413" width="233" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="741.5" y="434" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">Choose next token</text><text x="741.5" y="457" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">greedy or sample</text></g><g data-stage="append" data-active="false"><rect x="346" y="413" width="241" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="466.5" y="434" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">Append / stop at EOS</text><text x="466.5" y="457" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">parameters stay fixed</text></g></svg>