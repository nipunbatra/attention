" d="M625 376H587" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ts-s04-cap-embed-arrow)"/><text x="301" y="382" font-size="21" text-anchor="end" fill="#50586a" font-weight="500">Training</text><path data-edge="predict:decode" d="M1020 402V439H858" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ts-s04-cap-embed-arrow)"/><path data-edge="decode:append" d="M625 439H587" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ts-s04-cap-embed-arrow)"/><text x="301" y="427" font-size="21" text-anchor="end" fill="#50586a" font-weight="500">Generation</text><text x="897" y="464" font-size="18" text-anchor="start" fill="#50586a" font-weight="500">same trained model</text><path data-edge="append:windows" d="M346 439H7V6H907V17" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ts-s04-cap-embed-arrow)"/><g data-stage="stories" data-active="false"><rect x="14" y="17" width="146" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="87.0" y="38" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">Stories</text><text x="87.0" y="61" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">whole documents</text></g><g data-stage="split" data-active="false"><rect x="178" y="17" width="146" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="251.0" y="38" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">Split</text><text x="251.0" y="61" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">train / val / test</text></g><g data-stage="tokens" data-active="false"><rect x="342" y="17" width="146" height="52" rx="4" fill="#f7f8fa" stroke="#77808f" stroke-width="1"/><text x="415.0" y="38" font-size="21" text-anchor="middle" fill="#50586a" font-weight="500">Tokenize</text><text x="415.0" y="61" font-size="16" text-anchor="middle" fill="#657080" font-weight="500">words, punctuation</text></g><