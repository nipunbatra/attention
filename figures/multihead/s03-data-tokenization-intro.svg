<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Tokenization" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Tokenization</title><text x="25" y="60" fill="#14171F" font-size="36" font-weight="600" text-anchor="start">Does “next token” always mean “next word”?</text><text x="25" y="150" fill="#245EDB" font-size="52" font-weight="600" text-anchor="start">redder!</text><text x="25" y="235" fill="#4A5160" font-size="28" font-weight="500" text-anchor="start">The same text can become different sequences of tokens.</text></svg>