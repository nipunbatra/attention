<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 516" role="img" aria-label="The same next-token path, with every matrix shape in two parallel heads" style="font-family:Avenir Next,Segoe UI,Arial,sans-serif"><title>The same next-token path, with every matrix shape in two parallel heads</title><text x="23" y="25" font-size="22" fill="#586174" text-anchor="start" font-weight="500">One sentence: 10 tokens, width 4. Two heads, width 2 each.</text><g><rect x="23" y="191" width="170" height="69" rx="4" fill="#245edb08" stroke="#245edb" stroke-width="1.5"/><text x="108.0" y="219" font-size="25" fill="#245edb" text-anchor="middle" font-weight="600">Input E</text><text x="108.0" y="244" font-size="19" fill="#586174" text-anchor="middle" font-weight="500">[10×4]</text></g><path d="M193 225.5 H220 V145 H248" fill="none" stroke="#245edb" stroke-width="2.5"/><g data-map-head="1"><rect x="248" y="68" width="310" height="154" rx="4" fill="#8b2cde08" stroke="#8b2cde" stroke-width="1.5"/><text x="403" y="96" font-size="25" fill="#8b2cde" text-anchor="middle" font-weight="600">Head 1</text><g data-map-tensor="Q" data-shape="10,2"><text x="303" y="128" font-size="21" fill="#8b2cde" text-anchor="middle" font-weight="500">Q [10×2]</text></g><g data-map-tensor="K" data-shape="10,2"><text x="403" y="128" font-size="21" fill="#aa4e08" text-anchor="middle" font-weight="500">K [10×2]</text></g><g data-map-tensor="V" data-shape="10,2"><text x="503" y="128" font-size="21" fill="#0f766e" text-anchor="middle" font-weight="500">V [10×2]</text></g><g data-map-tensor="scores" data-shape="10,10"><text x="403" y="159" font-size="23" fill="#be123c" text-anchor="middle" font-weight="500">QKᵀ: [10×10]</text></g><text x="403" y="185" font-size="20" fill="#586174" text-anchor="middle" font-weight="500">scale, causal mask, softmax</text><g data-map-tensor="A" data-shape="10,10"><text x="403" y="212" font-size="23" fill="#be123c" text-anchor="middle" font-weight="500">A: [10×10]</text></g></g><path