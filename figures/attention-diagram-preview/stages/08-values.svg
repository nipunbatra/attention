<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="stage-7-title stage-7-desc"><title id="stage-7-title">Stage 8: Values carry what each token sends</title><desc id="stage-7-desc">Project each source into a value vector. Values take a separate route: they do not set the scores. Q and K create weights; V carries information. A separate residual path preserves the input representation. Receiver: 7, bank.</desc><defs><marker id="stage-7-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2a65a4"/></marker><marker id="stage-7-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#247c78"/></marker><marker id="stage-7-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#ae6825"/></marker><marker id="stage-7-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#526b8c"/></marker><marker id="stage-7-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#a36b2b"/></marker><marker id="stage-7-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#357957"/></marker><marker id="stage-7-e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#485f59"/></marker></defs><style>text{font-family:'Avenir Next','Segoe UI',Arial,sans-serif;fill:#243b39}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px}.heading{font-size:33px;font-weight:600;letter-spacing:-.6px}.stage-title{font-size:27px;font-weight:600;letter-spacing:-.4px}.body{font-size:21px}.detail{font-size:17px;fill:#6b7c77}.ax