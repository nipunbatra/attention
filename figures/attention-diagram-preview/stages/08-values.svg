xt-anchor="middle" fill="#ae6825">−0.30</text><rect x="48" y="498" width="664" height="29" rx="3" fill="#eef5ef" stroke="none" /><text x="60" y="520" class="table-label" fill="#243b39">6 · river</text><text x="371" y="520" class="table-number" text-anchor="middle" fill="#ae6825">3.00</text><text x="503" y="520" class="table-number" text-anchor="middle" fill="#ae6825">0.00</text><text x="635" y="520" class="table-number" text-anchor="middle" fill="#ae6825">−0.20</text><text x="60" y="550" class="table-label" fill="#243b39">7 · bank</text><text x="371" y="550" class="table-number" text-anchor="middle" fill="#ae6825">0.70</text><text x="503" y="550" class="table-number" text-anchor="middle" fill="#ae6825">0.70</text><text x="635" y="550" class="table-number" text-anchor="middle" fill="#ae6825">−0.10</text><text x="60" y="580" class="table-label" fill="#a9b4af">8 · and</text><text x="371" y="580" class="table-number" text-anchor="middle" fill="#a9b4af">0.00</text><text x="503" y="580" class="table-number" text-anchor="middle" fill="#a9b4af">0.00</text><text x="635" y="580" class="table-number" text-anchor="middle" fill="#a9b4af">0.10</text><text x="60" y="610" class="table-label" fill="#a9b4af">9 · watched</text><text x="371" y="610" class="table-number" text-anchor="middle" fill="#a9b4af">0.60</text><text x="503" y="610" class="table-number" text-anchor="middle" fill="#a9b4af">0.00</text><text x="635" y="610" class="table-number" text-anchor="middle" fill="#a9b4af">1.00</text><text x="60" y="640" class="table-label" fill="#a9b4af">10 · the</text><text x="371" y="640" class="table-number" text-anchor="middle" fill="#a9b4af">0.00</text><text x="503" y="640" class="table-number" text-anchor="middle" fill="#a9b4af">0.00</text><text x="635" y="640" class="table-number" text-anchor="middle" fill="#a9b4af">0.30</text><text x="60" y="696" class="detail" >Each value has 3 payload coordinates.</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" fill="#247c78">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >V = E @ W_V  # [10, 4] @ [4, 3] → [10, 3]</text><text x="60" y="873" class="detail" >This snapshot happens to use W_K = W_V. Their roles differ;</text><text x="60" y="898" class="detail" >in a learned model the two matrices can differ independently.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="251" class="node-title" text-anchor="middle" fill="#485f59">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 4 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" fill="#2a65a4" text-anchor="end">receiver 7 · bank</text><path d="M1080 284 V299 H915 V319" fill="none" stroke="#2a65a4" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-7-q)"/><path d="M1135 284 V319" fill="none" stroke="#247c78" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-7-k)"/><path d="M1190 284 V299 H1390 V319" fill="none" stroke="#ae6825" stroke-width="2.8" opacity="1" marker-end="url(#stage-7-v)"/><text x="916" y="309" class="tiny" text-anchor="middle">W_Q · 4 × 3</text><text x="1195" y="309" class="tiny" >W_K · 4 × 3</text><text x="1390" y="309" class="tiny" text-anchor="middle">W_V · 4 × 3</text><g class="node" data-node="q"><rect x="835" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="915" y="345.1" class="node-title" text-anchor="middle" fill="#2a65a4">Query q₇</text><text x="915" y="363.08" class="node-caption" text-anchor="middle">1 × 3 · request</text></g><g class="node" data-node="k"><rect x="1055" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="345.1" class="node-title" text-anchor="middle" fill="#247c78">Keys K<