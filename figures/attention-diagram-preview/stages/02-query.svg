<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="stage-1-title stage-1-desc"><title id="stage-1-title">Stage 2: Bank makes a query</title><desc id="stage-1-desc">Transform bank’s current representation into a request. Its three numbers can match the three coordinates of a key. Q and K create weights; V carries information. A separate residual path preserves the input representation. Receiver: 7, bank.</desc><defs><marker id="stage-1-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2a65a4"/></marker><marker id="stage-1-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#247c78"/></marker><marker id="stage-1-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#ae6825"/></marker><marker id="stage-1-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#526b8c"/></marker><marker id="stage-1-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#a36b2b"/></marker><marker id="stage-1-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#357957"/></marker><marker id="stage-1-e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#485f59"/></marker></defs><style>text{font-family:'Avenir Next','Segoe UI',Arial,sans-serif;fill:#243b39}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px}.heading{font-size:33px;font-weight:600;letter-spacing:-.6px}.stage-title{font-size:27px;font-weight:600;letter-spacing:-.4px}.body{font-size:21px}.detail{font-size:17px;fill:#6b7c77}.axis{font-size:16px;fill:#6b7c77}.smallcap{font-size:15px;font-weight:700;letter-spacing:.6px}.formula{font-family:'STIX Two Text',Georgia,serif;font-size:26px}.number{font-family:'SFMono-Regular',Consolas,monospace;font-size:24px}.table-number{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}.table-label{font-size:18px}.table-head{font-size:15px;font-weight:600;fill:#6b7c77}.node-title{font-size:20px;font-weight:600}.node-caption{font-size:13px;fill:#6b7c77}.code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px}.token{font-size:19px}.position{font-size:12px;fill:#6b7c77}.tiny{font-size:13px;fill:#6b7c77}</style><rect x="0" y="0" width="1600" height="960" rx="0" fill="#fbfcf9" stroke="none" /><text x="48" y="44" class="eyebrow" fill="#247c78">PART 2 / A SINGLE ATTENTION HEAD</text><text x="48" y="87" class="heading" >How context reaches a token</text><text x="1538" y="43" class="eyebrow" text-anchor="end">02 / 12</text><text x="1538" y="82" class="detail" text-anchor="end">One input sequence · causal reads · one residual update</text><rect x="48" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="83" y="144" class="token" text-anchor="middle" fill="#243b39">The</text><text x="83" y="178" class="position" text-anchor="middle">1</text><rect x="127" y="117" width="146" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="200" y="144" class="token" text-anchor="middle" fill="#243b39">fisherman</text><text x="200" y="178" class="position" text-anchor="middle">2</text><rect x="282" y="117" width="65" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="314.5" y="144" class="token" text-anchor="middle" fill="#243b39">sat</text><text x="314.5" y="178" class="position" text-anchor="middle">3</text><rect x="356" y="117" width="100" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="406" y="144" class="token" text-anchor="middle" fill="#243b39">beside</text><text x="406" y="178" class="position" text-anchor="middle">4</text><rect x="465" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="500" y="144" class="token" text-anchor="middle" fill="#243b39">the</text><text x="500" y="178" class="position" text-anchor="middle">5</text><rect x="544" y="117" width="81" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="584.5" y="144" class="token" text-anchor="middle" fill="#243b39">river</text><text x="584.5" y="178" class="position" text-anchor="middle">6</text><rect x="634" y="117" width="87" height="42" rx="5" fill="#2a65a4" stroke="#2a65a4" /><text x="677.5" y="144" class="token" text-anchor="middle" fill="white">bank</text><text x="677.5" y="178" class="position" text-anchor="middle" fill="#2a65a4">7 · receiver</text><rect x="730" y="117" width="72" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="766" y="144" class="token" text-anchor="middle" fill="#a2ada6">and</text><text x="766" y="178" class="position" text-anchor="middle">8 · future</text><rect x="811" y="117" width="127" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="874.5" y="144" class="token" text-anchor="middle" fill="#a2ada6">watched</text><text x="874.5" y="178" class="position" text-anchor="middle">9 · future</text><rect x="947" y="117" width="70" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="982" y="144" class="token" text-anchor="middle" fill="#a2ada6">the</text><text x="982" y="178" class="position" text-anchor="middle">10 · future</text><text x="1041" y="146" class="token" fill="#a2ada6">___</text><text x="1056" y="178" class="position" text-anchor="middle">11 · predict</text><line x1="48" y1="202" x2="1552" y2="202" stroke="#d8e1dc"/><text x="48" y="249" class="stage-title" >02   Bank makes a query</text><text x="60" y="287" class="body" >Transform bank’s current representation into a request.</text><text x="60" y="315" class="body" >Its three numbers can match the three coordinates of a key.</text><text x="60" y="345" class="formula" >e₇ = (0.70   0.70   −0.10   0.90)</text><text x="60" y="402" class="body" >e₇ [1 × 4]   ·   W_Q [4 × 3]   →   q₇ [1 × 3]</text><text x="60" y="460" class="smallcap" fill="#2a65a4">q₇ · THE REQUEST</text><text x="159.33333333333331" y="490" class="axis" text-anchor="middle">water?</text><rect x="60" y="502" width="198.66666666666666" height="60" rx="5" fill="#2a65a40c" stroke="#2a65a455" /><text x="159.33333333333331" y="541" class="number" text-anchor="middle" fill="#2a65a4">1.330</text><text x="369.99999999999994" y="490" class="axis" text-anchor="middle">finance?</text><rect x="270.66666666666663" y="502" width="198.66666666666666" height="60" rx="5" fill="#2a65a40c" stroke="#2a65a455" /><text x="369.99999999999994" y="541" class="number" text-anchor="middle" fill="#2a65a4">1.330</text><text x="580.6666666666666" y="490" class="axis" text-anchor="middle">who?</text><rect x="481.3333333333333" y="502" width="198.66666666666666" height="60" rx="5" fill="#2a65a40c" stroke="#2a65a455" /><text x="580.6666666666666" y="541" class="number" text-anchor="middle" fill="#2a65a4">−0.040</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" fill="#247c78">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >q = e @ W_Q  # [1, 4] @ [4, 3] → [1, 3]</text><text x="60" y="873" class="detail" >The query is a vector, not an English question.</text><text x="60" y="898" class="detail" >This toy asks for setting clues; the numbers are hand-designed.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="251" class="node-title" text-anchor="middle" fill="#485f59">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 4 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" fill="#2a65a4" text-anchor="end">receiver 7 · bank</text><path d="M1080 284 V299 H915 V319" fill="none" stroke="#2a65a4" stroke-width="2.8" opacity="1" marker-end="url(#stage-1-q)"/><text x="916" y="309" class="tiny" text-anchor="middle">W_Q · 4 × 3</text><g class="node" data-node="q"><rect x="835" y="319" width="160" height="58" rx="8" fill="#2a65a415" stroke="#2a65a4" stroke-width="2.5"/><rect x="835" y="319" width="4" height="58" rx="2" fill="#2a65a4" stroke="#2a65a4" /><text x="915" y="345.1" class="node-title" text-anchor="middle" fill="#2a65a4">Query q₇</text><text x="915" y="363.08" class="node-caption" text-anchor="middle">1 × 3 · request</text></g><line x1="48" y1="924" x2="1552" y2="924" stroke="#d8e1dc"/><text x="48" y="949" class="tiny" >SELF: Q, K and V come from the same E.   CAUSAL: receiver i reads only positions j ≤ i.</text><text x="1552" y="949" class="tiny" text-anchor="end">Hand-designed toy · decimals rounded · no FFN or normalization shown</text></svg>