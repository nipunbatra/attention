715 V750" fill="none" stroke="#a36b2b" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-m)"/><g class="node" data-node="output"><rect x="971" y="750" width="203" height="46" rx="8" fill="#35795715" stroke="#357957" stroke-width="2.5"/><rect x="971" y="750" width="4" height="46" rx="2" fill="#357957" stroke="#357957" /><text x="1072.5" y="770.7" class="node-title" text-anchor="middle" fill="#357957">× W_O [3 × 4]</text><text x="1072.5" y="784.96" class="node-caption" text-anchor="middle">update Δe₁₀ · 1 × 4</text></g><path d="M1030 254 H807 V852 H1048" fill="none" stroke="#485f59" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-e)"/><text x="827" y="825" class="tiny" >keep original e₁₀</text><path d="M1072 796 V828" fill="none" stroke="#357957" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-d)"/><circle cx="1072" cy="852" r="24" fill="#edf5ef" stroke="#357957" stroke-width="2"/><text x="1072" y="860" class="formula" text-anchor="middle">+</text><path d="M1096 852 H1147" fill="none" stroke="#357957" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-d)"/><g class="node" data-node="updated"><rect x="1147" y="824" width="171" height="58" rx="8" fill="#35795715" stroke="#357957" stroke-width="2.5"/><rect x="1147" y="824" width="4" height="58" rx="2" fill="#357957" stroke="#357957" /><text x="1232.5" y="850.1" class="node-title" text-anchor="middle" fill="#357957">e′₁₀</text><text x="1232.5" y="868.08" class="node-caption" text-anchor="middle">updated row · 1 × 4</text></g><path d="M1318 852 H1373" fill="none" stroke="#357957" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-d)"/><g class="node" data-node="prediction"><rect x="1373" y="824" width="175" height="58" rx="8" fill="#35795715" stroke="#357957" stroke-width="2.5"/><rect x="1373" y="824" width="4" height="58" rx="2" fill="#357957" stroke="#357957" /><text x="1460.5" y="850.1" class="node-title" text-anchor="middle" fill="#357957">Vocabulary head</text><text x="1460.5" y="868.08" class="node-caption" text-anchor="middle">20 logits → probabilities</text></g><text x="1460" y="909" class="detail" text-anchor="middle" fill="#357957">water · p ≈ 0.392</text><line x1="48" y1="924" x2="1552" y2="924" stroke="#d8e1dc"/><text x="48" y="949" class="tiny" >SELF: Q, K and V come from the same E.   CAUSAL: receiver i reads only positions j ≤ i.</text><text x="1552" y="949" class="tiny" text-anchor="end">Hand-designed toy · decimals rounded · no FFN or normalization shown</text></svg>