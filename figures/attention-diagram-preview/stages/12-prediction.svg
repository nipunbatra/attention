<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="stage-11-title stage-11-desc"><title id="stage-11-title">Stage 12: Now switch to the last token: the</title><desc id="stage-11-desc">Run the same path again with receiver 10, the final the. Its updated representation predicts the token at position 11. Q and K create weights; V carries information. A separate residual path preserves the input representation. Receiver: 10, the.</desc><defs><marker id="stage-11-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2a65a4"/></marker><marker id="stage-11-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#247c78"/></marker><marker id="stage-11-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#ae6825"/></marker><marker id="stage-11-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#526b8c"/></marker><marker id="stage-11-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#a36b2b"/></marker><marker id="stage-11-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#357957"/></marker><marker id="stage-11-e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#485f59"/></marker></defs><style>text{font-family:'Avenir Next','Segoe UI',Arial,sans-serif;fill:#243b39}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px}.heading{font-size:33px;font-weight:600;letter-spacing:-.6px}.stage-title{font-size:27px;font-weight:600;letter-spacing:-.4px}.body{font-size:21px}.detail{font-size:17px;fill:#6b7c77}.axis{font-size:16px;fill:#6b7c77}.smallcap{font-size:15px;font-weight:700;letter-spacing:.6px}.formula{font-family:'STIX Two Text',Georgia,serif;font-size:26px}.number{font-family:'SFMono-Regular',Consolas,monospace;font-size:24px}.table-number{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}.table-label{font-size:18px}.table-head{font-size:15px;font-weight:600;fill:#6b7c77}.node-title{font-size:20px;font-weight:600}.node-caption{font-size:13px;fill:#6b7c77}.code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px}.token{font-size:19px}.position{font-size:12px;fill:#6b7c77}.tiny{font-size:13px;fill:#6b7c77}</style><rect x="0" y="0" width="1600" height="960" rx="0" fill="#fbfcf9" stroke="none" /><text x="48" y="44" class="eyebrow" fill="#247c78">PART 2 / A SINGLE ATTENTION HEAD</text><text x="48" y="87" class="heading" >How context reaches a token</text><text x="1538" y="43" class="eyebrow" text-anchor="end">12 / 12</text><text x="1538" y="82" class="detail" text-anchor="end">One input sequence · causal reads · one residual update</text><rect x="48" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="83" y="144" class="token" text-anchor="middle" fill="#243b39">The</text><text x="83" y="178" class="position" text-anchor="middle">1</text><rect x="127" y="117" width="146" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="200" y="144" class="token" text-anchor="middle" fill="#243b39">fisherman</text><text x="200" y="178" class="position" text-anchor="middle">2</text><rect x="282" y="117" width="65" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="314.5" y="144" class="token" text-anchor="middle" fill="#243b39">sat</text><text x="314.5" y="178" class="position" text-anchor="middle">3</text><rect x="356" y="117" width="100" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="406" y="144" class="token" text-anchor="middle" fill="#243b39">beside</text><text x="406" y="178" class="position" text-anchor="middle">4</text><rect x="465" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="500" y="144" class="token" text-anchor="middle" fill="#243b39">the</text><text x="500" y="178" class="position" text-anchor="middle">5</text><rect x="544" y="117" width="81" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="584.5" y="144" class="token" text-anchor="middle" fill="#243b39">river</text><text x="584.5" y="178" class="position" text-anchor="middle">6</text><rect x="634" y="117" width="87" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="677.5" y="144" class="token" text-anchor="middle" fill="#243b39">bank</text><text x="677.5" y="178" class="position" text-anchor="middle">7</text><rect x="730" y="117" width="72" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="766" y="144" class="token" text-anchor="middle" fill="#243b39">and</text><text x="766" y="178" class="position" text-anchor="middle">8</text><rect x="811" y="117" width="127" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="874.5" y="144" class="token" text-anchor="middle" fill="#243b39">watched</text><text x="874.5" y="178" class="position" text-anchor="middle">9</text><rect x="947" y="117" width="70" height="42" rx="5" fill="#2a65a4" stroke="#2a65a4" /><text x="982" y="144" class="token" text-anchor="middle" fill="white">the</text><text x="982" y="178" class="position" text-anchor="middle" fill="#2a65a4">10 · receiver</text><text x="1041" y="146" class="token" fill="#ae6825">___</text><text x="1056" y="178" class="position" text-anchor="middle">11 · predict</text><line x1="48" y1="202" x2="1552" y2="202" stroke="#d8e1dc"/><text x="48" y="249" class="stage-title" >12   Now switch to the last token: the</text><text x="60" y="287" class="body" >Run the same path again with receiver 10, the final the.</text><text x="60" y="315" class="body" >Its updated representation predicts the token at position 11.</text><text x="60" y="329" class="smallcap" fill="#2a65a4">NEW RECEIVER: 10 · the</text><text x="60" y="376" class="formula" fill="#2a65a4">q₁₀ = (1.680   1.680   0.120)</text><text x="60" y="425" class="formula" fill="#357957">e′₁₀ ≈ (1.935   0.069   0.521   2.400)</text><text x="60" y="480" class="table-head" >next-token candidate</text><text x="460" y="480" class="table-head" text-anchor="middle">logit</text><text x="620" y="480" class="table-head" text-anchor="middle">probability</text><line x1="60" y1="496" x2="700" y2="496" stroke="#d8e1dc"/><rect x="48" y="502" width="664" height="29" rx="3" fill="#eef5ef" stroke="none" /><text x="60" y="524" class="table-label" fill="#243b39">water</text><text x="460" y="524" class="table-number" text-anchor="middle" fill="#243b39">2.902</text><text x="620" y="524" class="table-number" text-anchor="middle" fill="#357957">0.392</text><text x="60" y="554" class="table-label" fill="#243b39">boats</text><text x="460" y="554" class="table-number" text-anchor="middle" fill="#243b39">2.322</text><text x="620" y="554" class="table-number" text-anchor="middle" fill="#357957">0.219</text><text x="60" y="584" class="table-label" fill="#243b39">fish</text><text x="460" y="584" class="table-number" text-anchor="middle" fill="#243b39">1.935</text><text x="620" y="584" class="table-number" text-anchor="middle" fill="#357957">0.149</text><text x="60" y="614" class="table-label" fill="#243b39">ducks</text><text x="460" y="614" class="table-number" text-anchor="middle" fill="#243b39">1.354</text><text x="620" y="614" class="table-number" text-anchor="middle" fill="#357957">0.083</text><text x="60" y="679" class="detail" >This softmax is over 20 vocabulary tokens, not 10 inputs.</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" fill="#247c78">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >logits = e_prime @ W_vocab + b_vocab  # [1, 20]</text><text x="66" y="815" class="code" >p_next = logits.softmax(dim=-1)  # over vocabulary tokens</text><text x="60" y="873" class="detail" >All projections still read the original E in this layer.</text><text x="60" y="898" class="detail" >The new query does not read the just-computed e′₇.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#485f5915" stroke="#485f59" stroke-width="2.5"/><rect x="1030" y="224" width="4" height="60" rx="2" fill="#485f59" stroke="#485f59" /><text x="1135" y="251" class="node-title" text-anchor="middle" fill="#485f59">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 4 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" fill="#2a65a4" text-anchor="end">receiver 10 · the</text><path d="M1080 284 V299 H915 V319" fill="none" stroke="#2a65a4" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-q)"/><path d="M1135 284 V319" fill="none" stroke="#247c78" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-k)"/><path d="M1190 284 V299 H1390 V319" fill="none" stroke="#ae6825" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-v)"/><text x="916" y="309" class="tiny" text-anchor="middle">W_Q · 4 × 3</text><text x="1195" y="309" class="tiny" >W_K · 4 × 3</text><text x="1390" y="309" class="tiny" text-anchor="middle">W_V · 4 × 3</text><g class="node" data-node="q"><rect x="835" y="319" width="160" height="58" rx="8" fill="#2a65a415" stroke="#2a65a4" stroke-width="2.5"/><rect x="835" y="319" width="4" height="58" rx="2" fill="#2a65a4" stroke="#2a65a4" /><text x="915" y="345.1" class="node-title" text-anchor="middle" fill="#2a65a4">Query q₁₀</text><text x="915" y="363.08" class="node-caption" text-anchor="middle">1 × 3 · request</text></g><g class="node" data-node="k"><rect x="1055" y="319" width="160" height="58" rx="8" fill="#247c7815" stroke="#247c78" stroke-width="2.5"/><rect x="1055"