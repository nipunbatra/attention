<svg id="stage-11-svg" xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="stage-11-title stage-11-desc"><title id="stage-11-title">Stage 12: Now switch to the last token: the</title><desc id="stage-11-desc">Run the same path again with receiver 10, the final the. Its updated representation predicts the token at position 11. Q and K create weights; V carries information. A separate residual path preserves the input representation. Receiver: 10, the.</desc><defs><marker id="stage-11-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#9333ea"/></marker><marker id="stage-11-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#d97706"/></marker><marker id="stage-11-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0d9488"/></marker><marker id="stage-11-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#e11d48"/></marker><marker id="stage-11-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0d9488"/></marker><marker id="stage-11-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#16a34a"/></marker><marker id="stage-11-e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs><style>#stage-11-svg text{font-family:'Avenir Next','Segoe UI',Arial,sans-serif;fill:#243b39}#stage-11-svg .eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px}#stage-11-svg .heading{font-size:33px;font-weight:600;letter-spacing:-.6px}#stage-11-svg .stage-title{font-size:27px;font-weight:600;letter-spacing:-.4px}#stage-11-svg .body{font-size:21px}#stage-11-svg .detail{font-size:17px;fill:#6b7c77}#stage-11-svg .axis{font-size:16px;fill:#6b7c77}#stage-11-svg .smallcap{font-size:15px;font-weight:700;letter-spacing:.6px}#stage-11-svg .formula{font-family:'STIX Two Text',Georgia,serif;font-size:26px}#stage-11-svg .number{font-family:'SFMono-Regular',Consolas,monospace;font-size:24px}#stage-11-svg .table-number{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}#stage-11-svg .table-label{font-size:18px}#stage-11-svg .table-head{font-size:15px;font-weight:600;fill:#6b7c77}#stage-11-svg .node-title{font-size:20px;font-weight:600}#stage-11-svg .node-caption{font-size:13px;fill:#6b7c77}#stage-11-svg .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px}#stage-11-svg .token{font-size:19px}#stage-11-svg .position{font-size:12px;fill:#6b7c77}#stage-11-svg .tiny{font-size:13px;fill:#6b7c77}</style><rect x="0" y="0" width="1600" height="960" rx="0" fill="#fbfcf9" stroke="none" /><text x="48" y="44" class="eyebrow" style="fill:#d97706">PART 2 / A SINGLE ATTENTION HEAD</text><text x="48" y="87" class="heading" >How context reaches a token</text><text x="1538" y="43" class="eyebrow" text-anchor="end">12 / 12</text><text x="1538" y="82" class="detail" text-anchor="end">One input sequence · causal reads · one residual update</text><rect x="48" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="83" y="144" class="token" text-anchor="middle" style="fill:#243b39">The</text><text x="83" y="178" class="position" text-anchor="middle">1</text><rect x="127" y="117" width="146" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="200" y="144" class="token" text-anchor="middle" style="fill:#243b39">fisherman</text><text x="200" y="178" class="position" text-anchor="middle">2</text><rect x="282" y="117" width="65" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="314.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">sat</text><text x="314.5" y="178" class="position" text-anchor="middle">3</text><rect x="356" y="117" width="100" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="406" y="144" class="token" text-anchor="middle" style="fill:#243b39">beside</text><text x="406" y="178" class="position" text-anchor="middle">4</text><rect x="465" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="500" y="144" class="token" text-anchor="middle" style="fill:#243b39">the</text><text x="500" y="178" class="position" text-anchor="middle">5</text><rect x="544" y="117" width="81" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="584.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">river</text><text x="584.5" y="178" class="position" text-anchor="middle">6</text><rect x="634" y="117" width="87" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="677.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">bank</text><text x="677.5" y="178" class="position" text-anchor="middle">7</text><rect x="730" y="117" width="72" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="766" y="144" class="token" text-anchor="middle" style="fill:#243b39">and</text><text x="766" y="178" class="position" text-anchor="middle">8</text><rect x="811" y="117" width="127" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="874.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">watched</text><text x="874.5" y="178" class="position" text-anchor="middle">9</text><rect x="947" y="117" width="70" height="42" rx="5" fill="#9333ea" stroke="#9333ea" /><text x="982" y="144" class="token" text-anchor="middle" style="fill:white">the</text><text x="982" y="178" class="position" text-anchor="middle" style="fill:#9333ea">10 · receiver</text><text x="1041" y="146" class="token" style="fill:#0d9488">___</text><text x="1056" y="178" class="position" text-anchor="middle">11 · predict</text><line x1="48" y1="202" x2="1552" y2="202" stroke="#d8e1dc"/><text x="48" y="249" class="stage-title" >12   Now switch to the last token: the</text><text x="60" y="287" class="body" >Run the same path again with receiver 10, the final the.</text><text x="60" y="315" class="body" >Its updated representation predicts the token at position 11.</text><text x="60" y="354" class="smallcap" style="fill:#9333ea">NEW RECEIVER: 10 · the</text><text x="60" y="399" class="formula" style="fill:#9333ea">q₁₀ = (1.680   1.680   0.000)</text><text x="60" y="451" class="formula" style="fill:#16a34a">e′₁₀ ≈ (1.946   0.071   0.000   2.400   1.000)</text><text x="60" y="480" class="table-head" >next-token candidate</text><text x="460" y="480" class="table-head" text-anchor="middle">logit</text><text x="620" y="480" class="table-head" text-anchor="middle">probability</text><line x1="60" y1="496" x2="700" y2="496" stroke="#d8e1dc"/><rect x="48" y="502" width="664" height="29" rx="3" fill="#eef5ef" stroke="none" /><text x="60" y="524" class="table-label" style="fill:#243b39">water</text><text x="460" y="524" class="table-number" text-anchor="middle" style="fill:#243b39">2.919</text><text x="620" y="524" class="table-number" text-anchor="middle" style="fill:#16a34a">0.396</text><text x="60" y="554" class="table-label" style="fill:#243b39">boats</text><text x="460" y="554" class="table-number" text-anchor="middle" style="fill:#243b39">2.335</text><text x="620" y="554" class="table-number" text-anchor="middle" style="fill:#16a34a">0.221</text><text x="60" y="584" class="table-label" style="fill:#243b39">fish</text><text x="460" y="584" class="table-number" text-anchor="middle" style="fill:#243b39">1.946</text><text x="620" y="584" class="table-number" text-anchor="middle" style="fill:#16a34a">0.150</text><text x="60" y="614" class="table-label" style="fill:#243b39">ducks</text><text x="460" y="614" class="table-number" text-anchor="middle" style="fill:#243b39">1.362</text><text x="620" y="614" class="table-number" text-anchor="middle" style="fill:#16a34a">0.084</text><text x="60" y="679" class="detail" >This softmax is over 20 vocabulary tokens, not 10 inputs.</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" style="fill:#d97706">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >logits = e_prime @ W_vocab + b_vocab  # [1, 20]</text><text x="66" y="815" class="code" >p_next = logits.softmax(dim=-1)  # over vocabulary tokens</text><text x="60" y="873" class="detail" >All projections still read the original E in this layer.</text><text x="60" y="898" class="detail" >The new query does not read the just-computed e′₇.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#2563eb15" stroke="#2563eb" stroke-width="2.5"/><rect x="1030" y="224" width="4" height="60" rx="2" fill="#2563eb" stroke="#2563eb" /><text x="1135" y="251" class="node-title" text-anchor="middle" style="fill:#2563eb">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 5 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" style="fill:#9333ea" text-anchor="end">receiver 10 · the</text><path d="M1080 284 V299 H915 V319" fill="none" stroke="#9333ea" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-q)"/><path d="M1135 284 V319" fill="none" stroke="#d97706" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-k)"/><path d="M1190 284 V299 H1390 V319" fill="none" stroke="#0d9488" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-v)"/><rect x="859" y="292" width="112" height="21" rx="0" fill="#fbfcf9" stroke="none" /><text x="915" y="308" class="tiny" text-anchor="middle">W_Q · 5 × 3</text><text x="1203" y="314" class="tiny" >W_K · 5 × 3</text><rect x="1334" y="292" width="112" height="21" rx="0" fill="#fbfcf9" stroke="none" /><text x="1390" y="308" class="tiny" text-anchor="middle">W_V · 5 × 2</text><g class="node" data-node="q"><rect x="835" y="319" width="160" height="58" rx="8" fill="#9333ea15" stroke="#9333ea" stroke-width="2.5"/><rect x="835" y="319" width="4" height="58" rx="2" fill="#9333ea" stroke="#9333ea" /><text x="915" y="345.1" class="node-title" text-anchor="middle" style="fill:#9333ea">Query q₁₀</text><text x="915" y="363.08" class="node-caption" text-anchor="middle">1 × 3 · request</text></g><g class="node" data-node="k"><rect x="1055" y="319" width="160" height="58" rx="8" fill="#d9770615" stroke="#d97706" stroke-width="2.5"/><rect x="1055" y="319" width="4" height="58" rx="2" fill="#d97706" stroke="#d97706" /><text x="1135" y="345.1" class="node-title" text-anchor="middle" style="fill:#d97706">Keys K</text><text x="1135" y="363.08" class="node-caption" text-anchor="middle">10 × 3 · matching</text></g><g class="node" data-node="v"><rect x="1310" y="319" width="160" height="58" rx="8" fill="#0d948815" stroke="#0d9488" stroke-width="2.5"/><rect x="1310" y="319" width="4" height="58" rx="2" fill="#0d9488" stroke="#0d9488" /><text x="1390" y="345.1" class="node-title" text-anchor="middle" style="fill:#0d9488">Values V</text><text x="1390" y="363.08" class="node-caption" text-anchor="middle">10 × 2 · payload</text></g><rect x="901" y="403" width="344" height="330" rx="10" fill="none" stroke="#c6d3cb" stroke-dasharray="4 5"/><text x="922" y="395" class="tiny" >SCALED DOT-PRODUCT ATTENTION</text><path d="M915 377 V411 H1015 V426" fill="none" stroke="#9333ea" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-q)"/><path d="M1135 377 V411 H1130 V426" fill="none" stroke="#d97706" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-k)"/><g class="node" data-node="score"><rect x="941" y="426" width="263" height="46" rx="8" fill="#9333ea15" stroke="#9333ea" stroke-width="2.5"/><rect x="941" y="426" width="4" height="46" rx="2" fill="#9333ea" stroke="#9333ea" /><text x="1072.5" y="446.7" class="node-title" text-anchor="middle" style="fill:#9333ea">q₁₀ Kᵀ</text><text x="1072.5" y="460.96" class="node-caption" text-anchor="middle">raw scores · 1 × 10</text></g><path d="M1072 472 V484" fill="none" stroke="#e11d48" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-a)"/><g class="node" data-node="scale"><rect x="971" y="484" width="203" height="42" rx="8" fill="#e11d4815" stroke="#e11d48" stroke-width="2.5"/><rect x="971" y="484" width="4" height="42" rx="2" fill="#e11d48" stroke="#e11d48" /><text x="1072.5" y="502.9" class="node-title" text-anchor="middle" style="fill:#e11d48">Divide by √3</text><text x="1072.5" y="515.92" class="node-caption" text-anchor="middle">scaled scores · 1 × 10</text></g><path d="M1072 526 V538" fill="none" stroke="#e11d48" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-a)"/><g class="node" data-node="mask"><rect x="971" y="538" width="203" height="42" rx="8" fill="#e11d4815" stroke="#e11d48" stroke-width="2.5"/><rect x="971" y="538" width="4" height="42" rx="2" fill="#e11d48" stroke="#e11d48" /><text x="1072.5" y="556.9" class="node-title" text-anchor="middle" style="fill:#e11d48">Causal mask</text><text x="1072.5" y="569.92" class="node-caption" text-anchor="middle">allow source j ≤ 10</text></g><path d="M1072 580 V592" fill="none" stroke="#e11d48" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-a)"/><g class="node" data-node="weights"><rect x="971" y="592" width="203" height="46" rx="8" fill="#e11d4815" stroke="#e11d48" stroke-width="2.5"/><rect x="971" y="592" width="4" height="46" rx="2" fill="#e11d48" stroke="#e11d48" /><text x="1072.5" y="612.7" class="node-title" text-anchor="middle" style="fill:#e11d48">Softmax</text><text x="1072.5" y="626.96" class="node-caption" text-anchor="middle">weights α₁₀ · 1 × 10</text></g><path d="M1072 638 V669" fill="none" stroke="#e11d48" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-a)"/><path d="M1390 377 V692 H1204" fill="none" stroke="#0d9488" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-v)"/><text x="1475" y="475" class="tiny" text-anchor="middle">Values bypass</text><text x="1475" y="494" class="tiny" text-anchor="middle">score + softmax</text><g class="node" data-node="mix"><rect x="941" y="669" width="263" height="46" rx="8" fill="#0d948815" stroke="#0d9488" stroke-width="2.5"/><rect x="941" y="669" width="4" height="46" rx="2" fill="#0d9488" stroke="#0d9488" /><text x="1072.5" y="689.7" class="node-title" text-anchor="middle" style="fill:#0d9488">α₁₀ V = m₁₀</text><text x="1072.5" y="703.96" class="node-caption" text-anchor="middle">query-specific mixture · 1 × 2</text></g><path d="M1072 715 V750" fill="none" stroke="#0d9488" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-m)"/><g class="node" data-node="output"><rect x="971" y="750" width="203" height="46" rx="8" fill="#16a34a15" stroke="#16a34a" stroke-width="2.5"/><rect x="971" y="750" width="4" height="46" rx="2" fill="#16a34a" stroke="#16a34a" /><text x="1072.5" y="770.7" class="node-title" text-anchor="middle" style="fill:#16a34a">× W_O [2 × 5]</text><text x="1072.5" y="784.96" class="node-caption" text-anchor="middle">update Δe₁₀ · 1 × 5</text></g><path d="M1030 254 H807 V852 H1048" fill="none" stroke="#2563eb" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-e)"/><text x="827" y="825" class="tiny" >keep original e₁₀</text><path d="M1072 796 V828" fill="none" stroke="#16a34a" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-d)"/><circle cx="1072" cy="852" r="24" fill="#edf5ef" stroke="#16a34a" stroke-width="2"/><text x="1072" y="860" class="formula" text-anchor="middle">+</text><path d="M1096 852 H1147" fill="none" stroke="#16a34a" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-d)"/><g class="node" data-node="updated"><rect x="1147" y="824" width="171" height="58" rx="8" fill="#16a34a15" stroke="#16a34a" stroke-width="2.5"/><rect x="1147" y="824" width="4" height="58" rx="2" fill="#16a34a" stroke="#16a34a" /><text x="1232.5" y="850.1" class="node-title" text-anchor="middle" style="fill:#16a34a">e′₁₀</text><text x="1232.5" y="868.08" class="node-caption" text-anchor="middle">updated row · 1 × 5</text></g><path d="M1318 852 H1373" fill="none" stroke="#16a34a" stroke-width="2.8" opacity="1" marker-end="url(#stage-11-d)"/><g class="node" data-node="prediction"><rect x="1373" y="824" width="175" height="58" rx="8" fill="#16a34a15" stroke="#16a34a" stroke-width="2.5"/><rect x="1373" y="824" width="4" height="58" rx="2" fill="#16a34a" stroke="#16a34a" /><text x="1460.5" y="850.1" class="node-title" text-anchor="middle" style="fill:#16a34a">Vocabulary head</text><text x="1460.5" y="868.08" class="node-caption" text-anchor="middle">20 logits → probabilities</text></g><text x="1460" y="909" class="detail" text-anchor="middle" style="fill:#16a34a">water · p ≈ 0.396</text><line x1="48" y1="924" x2="1552" y2="924" stroke="#d8e1dc"/><text x="48" y="949" class="tiny" >SELF: Q, K and V come from the same E.   CAUSAL: receiver i reads only positions j ≤ i.</text><text x="1552" y="949" class="tiny" text-anchor="end">Hand-designed toy · decimals rounded · no FFN or normalization shown</text></svg>