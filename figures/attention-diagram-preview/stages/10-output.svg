position" text-anchor="middle">4</text><rect x="465" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="500" y="144" class="token" text-anchor="middle" fill="#243b39">the</text><text x="500" y="178" class="position" text-anchor="middle">5</text><rect x="544" y="117" width="81" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="584.5" y="144" class="token" text-anchor="middle" fill="#243b39">river</text><text x="584.5" y="178" class="position" text-anchor="middle">6</text><rect x="634" y="117" width="87" height="42" rx="5" fill="#2a65a4" stroke="#2a65a4" /><text x="677.5" y="144" class="token" text-anchor="middle" fill="white">bank</text><text x="677.5" y="178" class="position" text-anchor="middle" fill="#2a65a4">7 · receiver</text><rect x="730" y="117" width="72" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="766" y="144" class="token" text-anchor="middle" fill="#a2ada6">and</text><text x="766" y="178" class="position" text-anchor="middle">8 · future</text><rect x="811" y="117" width="127" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="874.5" y="144" class="token" text-anchor="middle" fill="#a2ada6">watched</text><text x="874.5" y="178" class="position" text-anchor="middle">9 · future</text><rect x="947" y="117" width="70" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="982" y="144" class="token" text-anchor="middle" fill="#a2ada6">the</text><text x="982" y="178" class="position" text-anchor="middle">10 · future</text><text x="1041" y="146" class="token" fill="#a2ada6">___</text><text x="1056" y="178" class="position" text-anchor="middle">11 · predict</text><line x1="48" y1="202" x2="1552" y2="202" stroke="#d8e1dc"/><text x="48" y="249" class="stage-title" >10   Map the message back to four coordinates</text><text x="60" y="287" class="body" >W_O maps the value-space message into representation space.</text><text x="60" y="315" class="body" >Now Δe₇ has the right shape to be added to e₇.</text><text x="60" y="337" class="smallcap" fill="#a36b2b">m₇ · 3 COORDINATES IN VALUE SPACE</text><text x="159.33333333333331" y="367" class="axis" text-anchor="middle">water scene</text><rect x="60" y="379" width="198.66666666666666" height="60" rx="5" fill="#a36b2b0c" stroke="#a36b2b55" /><text x="159.33333333333331" y="418" class="number" text-anchor="middle" fill="#a36b2b">1.904</text><text x="369.99999999999994" y="367" class="axis" text-anchor="middle">finance scene</text><rect x="270.66666666666663" y="379" width="198.66666666666666" height="60" rx="5" fill="#a36b2b0c" stroke="#a36b2b55" /><text x="369.99999999999994" y="418" class="number" text-anchor="middle" fill="#a36b2b">0.092</text><text x="580.6666666666666" y="367" class="axis" text-anchor="middle">person</text><rect x="481.3333333333333" y="379" width="198.66666666666666" height="60" rx="5" fill="#a36b2b0c" stroke="#a36b2b55" /><text x="580.6666666666666" y="418" class="number" text-anchor="middle" fill="#a36b2b">0.362</text><text x="370" y="512" class="body" text-anchor="middle">↓  W_O [3 × 4]</text><text x="60" y="550" class="smallcap" fill="#357957">Δe₇ · 4 COORDINATES IN REPRESENTATION SPACE</text><text x="133" y="580" class="axis" text-anchor="middle">water</text><rect x="60" y="592" width="146" height="60" rx="5" fill="#3579570c" stroke="#35795755" /><text x="133" y="631" class="number" text-anchor="middle" fill="#357957">1.904</text><text x="291" y="580" class="axis" text-anchor="middle">finance</text><rect x="218" y="592" width="146" height="60" rx="5" fill="#3579570c" stroke="#35795755" /><text x="291" y="631" class="number" text-anchor="middle" fill="#357957">0.092</text><text x="449" y="580" class="axis" text-anchor="middle">person</text><rect x="376" y="592" width="146" height="60" rx="5" fill="#3579570c" stroke="#35795755" /><text x="449" y="631" class="number" text-anchor="middle" fill="#357957">0.181</text><text x="607" y="580" class="axis" text-anchor="middle">glue</text><rect x="534" y="592" width="146" height="60" rx="5" fill="#3579570c" stroke="#35795755" /><text x="607" y="631" class="number" text-anchor="middle" fill="#357957">0.000</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" fill="#247c78">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >delta_e = m @ W_O  # [1, 3] @ [3, 4] → [1, 4]</text><text x="60" y="873" class="detail" >This output projection bridges the two coordinate spaces.</text><text x="60" y="898" class="detail" >The 3-number mixture and 4-number update are different objects.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="251" class="node-title" text-anchor="middle" fill="#485f59">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 4 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" fill="#2a65a4" text-anchor="end">receiver 7 · bank</text><path d="M1080 284 V299 H915 V319" fill="none" stroke="#2a65a4" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-q)"/><path d="M1135 284 V319" fill="none" stroke="#247c78" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-k)"/><path d="M1190 284 V299 H1390 V319" fill="none" stroke="#ae6825" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-v)"/><text x="916" y="309" class="tiny" text-anchor="middle">W_Q · 4 × 3</text><text x="1195" y="309" class="tiny" >W_K · 4 × 3</text><text x="1390" y="309" class="tiny" text-anchor="middle">W_V · 4 × 3</text><g class="node" data-node="q"><rect x="835" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="915" y="345.1" class="node-title" text-anchor="middle" fill="#2a65a4">Query q₇</text><text x="915" y="363.08" class="node-caption" text-anchor="middle">1 × 3 · request</text></g><g class="node" data-node="k"><rect x="1055" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="345.1" class="node-title" text-anchor="middle" fill="#247c78">Keys K</text><text x="1135" y="363.08" class="node-caption" text-anchor="middle">10 × 3 · matching</text></g><g class="node" data-node="v"><rect x="1310" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1390" y="345.1" class="node-title" text-anchor="middle" fill="#ae6825">Values V</text><text x="1390" y="363.08" class="node-caption" text-anchor="middle">10 × 3 · payload</text></g><rect x="901" y="403" width="344" height="330" rx="10" fill="none" stroke="#c6d3cb" stroke-dasharray="4 5"/><text x="922" y="395" class="tiny" >SCALED DOT-PRODUCT ATTENTION</text><path d="M915 377 V411 H1015 V426" fill="none" stroke="#2a65a4" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-q)"/><path d="M1135 377 V411 H1130 V426" fill="none" stroke="#247c78" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-k)"/><g class="node" data-node="score"><rect x="941" y="426" width="263" height="46" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="446.7" class="node-title" text-anchor="middle" fill="#2a65a4">q₇ Kᵀ</text><text x="1072.5" y="460.96" class="node-caption" text-anchor="middle">raw scores · 1 × 10</text></g><path d="M1072 472 V484" fill="none" stroke="#526b8c" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-a)"/><g class="node" data-node="scale"><rect x="971" y="484" width="203" height="42" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="502.9" class="node-title" text-anchor="middle" fill="#526b8c">Divide by √3</text><text x="1072.5" y="515.92" class="node-caption" text-anchor="middle">scaled scores · 1 × 10</text></g><path d="M1072 526 V538" fill="none" stroke="#526b8c" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-a)"/><g class="node" data-node="mask"><rect x="971" y="538" width="203" height="42" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="556.9" class="node-title" text-anchor="middle" fill="#526b8c">Causal mask</text><text x="1072.5" y="569.92" class="node-caption" text-anchor="middle">allow source j ≤ 7</text></g><path d="M1072 580 V592" fill="none" stroke="#526b8c" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-a)"/><g class="node" data-node="weights"><rect x="971" y="592" width="203" height="46" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="612.7" class="node-title" text-anchor="middle" fill="#526b8c">Softmax</text><text x="1072.5" y="626.96" class="node-caption" text-anchor="middle">weights α₇ · 1 × 10</text></g><path d="M1072 638 V669" fill="none" stroke="#526b8c" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-a)"/><path d="M1390 377 V692 H1204" fill="none" stroke="#ae6825" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-v)"/><text x="1420" y="475" class="tiny" text-anchor="middle">Values bypass</text><text x="1420" y="494" class="tiny" text-anchor="middle">score + softmax</text><g class="node" data-node="mix"><rect x="941" y="669" width="263" height="46" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="689.7" class="node-title" text-anchor="middle" fill="#a36b2b">α₇ V = m₇</text><text x="1072.5" y="703.96" class="node-caption" text-anchor="middle">query-specific mixture · 1 × 3</text></g><path d="M1072 715 V750" fill="none" stroke="#a36b2b" stroke-width="2.8" opacity="1" marker-end="url(#stage-9-m)"/><g class="node" data-node="output"><rect x="971" y="750" width="203" height="46" rx="8" fill="#35795715" stroke="#357957" stroke-width="2.5"/><rect x="971" y="750" width="4" height="46" rx="2" fill="#357957" stroke="#357957" /><text x="1072.5" y="770.7" class="node-title" text-anchor="middle" fill="#357957">× W_O [3 × 4]</text><text x="1072.5" y="784.96" class="node-caption" text-anchor="middle">update Δe₇ · 1 × 4</text></g><line x1="48" y1="924" x2="1552" y2="924" stroke="#d8e1dc"/><text x="48" y="949" class="tiny" >SELF: Q, K and V come from the same E.   CAUSAL: receiver i reads only positions j ≤ i.</text><text x="1552" y="949" class="tiny" text-anchor="end">Hand-designed toy · decimals rounded · no FFN or normalization shown</text></svg>