<svg id="stage-9-svg" xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="stage-9-title stage-9-desc"><title id="stage-9-title">Stage 10: Map the message back to 5 coordinates</title><desc id="stage-9-desc">W_O maps the value-space message into representation space. Now Δe₇ has the right shape to be added to e₇. Q and K create weights; V carries information. A separate residual path preserves the input representation. Receiver: 7, bank.</desc><defs><marker id="stage-9-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b2cde"/></marker><marker id="stage-9-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#aa4e08"/></marker><marker id="stage-9-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0f766e"/></marker><marker id="stage-9-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#be123c"/></marker><marker id="stage-9-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0f766e"/></marker><marker id="stage-9-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#147737"/></marker><marker id="stage-9-e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#245edb"/></marker></defs><style>#stage-9-svg text{font-family:'Avenir Next','Segoe UI',Arial,sans-serif;fill:#243b39}#stage-9-svg .eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px}#stage-9-svg .heading{font-size:33px;font-weight:600;letter-spacing:-.6px}#stage-9-svg .stage-title{font-size:27px;font-weight:600;letter-spacing:-.4px}#stage-9-svg .body{font-size:21px}#stage-9-svg .detail{font-size:17px;fill:#65756f}#stage-9-svg .axis{font-size:16px;fill:#65756f}#stage-9-svg .smallcap{font-size:15px;font-weight:700;letter-spacing:.6px}#stage-9-svg .formula{font-family:'STIX Two Text',Georgia,serif;font-size:26px}#stage-9-svg .number{font-family:'SFMono-Regular',Consolas,monospace;font-size:24px}#stage-9-svg .table-number{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}#stage-9-svg .table-label{font-size:18px}#stage-9-svg .table-head{font-size:15px;font-weight:600;fill:#65756f}#stage-9-svg .node-title{font-size:20px;font-weight:600}#stage-9-svg .node-caption{font-size:13px;fill:#65756f}#stage-9-svg .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px}#stage-9-svg .token{font-size:19px}#stage-9-svg .position{font-size:12px;fill:#65756f}#stage-9-svg .tiny{font-size:13px;fill:#65756f}</style><rect x="0" y="0" width="1600" height="960" rx="0" fill="#fbfcf9" stroke="none" /><text x="48" y="44" class="eyebrow" style="fill:#65756f">PART 2 / A SINGLE ATTENTION HEAD</text><text x="48" y="87" class="heading" >How context reaches a token</text><text x="1538" y="43" class="eyebrow" text-anchor="end">10 / 12</text><text x="1538" y="82" class="detail" text-anchor="end">One input sequence · causal reads · one residual update</text><rect x="48" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="83" y="144" class="token" text-anchor="middle" style="fill:#243b39">The</text><text x="83" y="178" class="position" text-anchor="middle">1</text><rect x="127" y="117" width="146" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="200" y="144" class="token" text-anchor="middle" style="fill:#243b39">fisherman</text><text x="200" y="178" class="position" text-anchor="middle">2</text><rect x="282" y="117" width="65" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="314.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">sat</text><text x="314.5" y="178" class="position" text-anchor="middle">3</text><rect x="356" y="117" width="100" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="406" y="144" class="token" text-anchor="middle" style="fill:#243b39">beside</text><text x="406" y="178" class="position" text-anchor="middle">4</text><rect x="465" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="500" y="144" class="token" text-anchor="middle" style="fill:#243b39">the</text><text x="500" y="178" class="position" text-anchor="middle">5</text><rect x="544" y="117" width="81" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="584.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">river</text><text x="584.5" y="178" class="position" text-anchor="middle">6</text><rect x="634" y="117" width="87" height="42" rx="5" fill="#8b2cde" stroke="#8b2cde" /><text x="677.5" y="144" class="token" text-anchor="middle" style="fill:white">bank</text><text x="677.5" y="178" class="position" text-anchor="middle" style="fill:#8b2cde">7 · receiver</text><rect x="730" y="117" width="72" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="766" y="144" class="token" text-anchor="middle" style="fill:#a2ada6">and</text><text x="766" y="178" class="position" text-anchor="middle">8 · future</text><rect x="811" y="117" width="127" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="874.5" y="144" class="token" text-anchor="middle" style="fill:#a2ada6">watched</text><text x="874.5" y="178" class="position" text-anchor="middle">9 · future</text><rect x="947" y="117" width="70" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="982" y="144" class="token" text-anchor="middle" style="fill:#a2ada6">the</text><text x="982" y="178" class="position" text-anchor="middle">10 · future</text><text x="1041" y="146" class="token" style="fill:#a2ada6">___</text><text x="1056" y="178" class="position" text-anchor="middle">11 · predict</text><line x1="48" y1="202" x2="1552" y2="202" stroke="#d8e1dc"/><text x="48" y="249" class="stage-title" >10   Map the message back to 5 coordinates</text><text x="60" y="287" class="body" >W_O maps the value-space message into representation space.</text><text x="60" y="315" class="body" >Now Δe₇ has the right shape to be added to e₇.</text><text x="60" y="337" class="smallcap" style="fill:#0f766e">m₇ · 2 COORDINATES IN VALUE SPACE</text><text x="212" y="367" class="axis" text-anchor="middle">water scene</text><rect x="60" y="379" width="304" height="60" rx="5" fill="#0f766e0c" stroke="#0f766e55" /><text x="212" y="418" class="number" text-anchor="middle" style="fill:#0f766e">1.804</text><text x="528" y="367" class="axis" text-anchor="middle">finance scene</text><rect x="376" y="379" width="304" height="60" rx="5" fill="#0f766e0c" stroke="#0f766e55" /><text x="528" y="418" class="number" text-anchor="middle" style="fill:#0f766e">0.095</text><text x="370" y="512" class="body" text-anchor="middle">↓  W_O [2 × 5]</text><text x="60" y="550" class="smallcap" style="fill:#147737">Δe₇ · 5 COORDINATES IN REPRESENTATION SPACE</text><text x="117.2" y="580" class="axis" text-anchor="middle">water</text><rect x="60" y="592" width="114.4" height="60" rx="5" fill="#1477370c" stroke="#14773755" /><text x="117.2" y="631" class="number" text-anchor="middle" style="fill:#147737">1.804</text><text x="243.60000000000002" y="580" class="axis" text-anchor="middle">finance</text><rect x="186.4" y="592" width="114.4" height="60" rx="5" fill="#1477370c" stroke="#14773755" /><text x="243.60000000000002" y="631" class="number" text-anchor="middle" style="fill:#147737">0.095</text><text x="370" y="580" class="axis" text-anchor="middle">person</text><rect x="312.8" y="592" width="114.4" height="60" rx="5" fill="#1477370c" stroke="#14773755" /><text x="370" y="631" class="number" text-anchor="middle" style="fill:#147737">0.000</text><text x="496.40000000000003" y="580" class="axis" text-anchor="middle">glue</text><rect x="439.20000000000005" y="592" width="114.4" height="60" rx="5" fill="#1477370c" stroke="#14773755" /><text x="496.40000000000003" y="631" class="number" text-anchor="middle" style="fill:#147737">0.000</text><text x="622.8000000000001" y="580" class="axis" text-anchor="middle">pos</text><rect x="565.6" y="592" width="114.4" height="60" rx="5" fill="#1477370c" stroke="#14773755" /><text x="622.8000000000001" y="631" class="number" text-anchor="middle" style="fill:#147737">0.000</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" style="fill:#65756f">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >delta_e = m @ W_O  # [1, 2] @ [2, 5] → [1, 5]</text><text x="60" y="873" class="detail" >This output projection bridges the two coordinate spaces.</text><text x="60" y="898" class="detail" >The 2-number mixture and 5-number update are different objects.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="251" class="node-title" text-anchor="middle" style="fill:#245edb">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 5 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" style="fill:#8b2cde" text-anchor="end">receiver 7 · bank</text><path d="M1080 284 V299 H915 V319" fill="none" stroke="#8b2cde" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-q)"/><path d="M1135 284 V319" fill="none" stroke="#aa4e08" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-k)"/><path d="M1190 284 V299 H1390 V319" fill="none" stroke="#0f766e" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-v)"/><rect x="859" y="292" width="112" height="21" rx="0" fill="#fbfcf9" stroke="none" /><text x="915" y="308" class="tiny" text-anchor="middle">W_Q · 5 × 3</text><text x="1203" y="314" class="tiny" >W_K · 5 × 3</text><rect x="1334" y="292" width="112" height="21" rx="0" fill="#fbfcf9" stroke="none" /><text x="1390" y="308" class="tiny" text-anchor="middle">W_V · 5 × 2</text><g class="node" data-node="q"><rect x="835" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="915" y="345.1" class="node-title" text-anchor="middle" style="fill:#8b2cde">Query q₇</text><text x="915" y="363.08" class="node-caption" text-anchor="middle">1 × 3 · request</text></g><g class="node" data-node="k"><rect x="1055" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="345.1" class="node-title" text-anchor="middle" style="fill:#aa4e08">Keys K</text><text x="1135" y="363.08" class="node-caption" text-anchor="middle">10 × 3 · matching</text></g><g class="node" data-node="v"><rect x="1310" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1390" y="345.1" class="node-title" text-anchor="middle" style="fill:#0f766e">Values V</text><text x="1390" y="363.08" class="node-caption" text-anchor="middle">10 × 2 · payload</text></g><rect x="901" y="403" width="344" height="330" rx="10" fill="none" stroke="#c6d3cb" stroke-dasharray="4 5"/><text x="922" y="395" class="tiny" >SCALED DOT-PRODUCT ATTENTION</text><path d="M915 377 V411 H1015 V426" fill="none" stroke="#8b2cde" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-q)"/><path d="M1135 377 V411 H1130 V426" fill="none" stroke="#aa4e08" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-k)"/><g class="node" data-node="score"><rect x="941" y="426" width="263" height="46" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="446.7" class="node-title" text-anchor="middle" style="fill:#8b2cde">q₇ Kᵀ</text><text x="1072.5" y="460.96" class="node-caption" text-anchor="middle">raw scores · 1 × 10</text></g><path d="M1072 472 V484" fill="none" stroke="#be123c" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-a)"/><g class="node" data-node="scale"><rect x="971" y="484" width="203" height="42" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="502.9" class="node-title" text-anchor="middle" style="fill:#be123c">Divide by √3</text><text x="1072.5" y="515.92" class="node-caption" text-anchor="middle">scaled scores · 1 × 10</text></g><path d="M1072 526 V538" fill="none" stroke="#be123c" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-a)"/><g class="node" data-node="mask"><rect x="971" y="538" width="203" height="42" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="556.9" class="node-title" text-anchor="middle" style="fill:#be123c">Causal mask</text><text x="1072.5" y="569.92" class="node-caption" text-anchor="middle">allow source j ≤ 7</text></g><path d="M1072 580 V592" fill="none" stroke="#be123c" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-a)"/><g class="node" data-node="weights"><rect x="971" y="592" width="203" height="46" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="612.7" class="node-title" text-anchor="middle" style="fill:#be123c">Softmax</text><text x="1072.5" y="626.96" class="node-caption" text-anchor="middle">weights α₇ · 1 × 10</text></g><path d="M1072 638 V669" fill="none" stroke="#be123c" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-a)"/><path d="M1390 377 V692 H1204" fill="none" stroke="#0f766e" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-9-v)"/><text x="1475" y="475" class="tiny" text-anchor="middle">Values bypass</text><text x="1475" y="494" class="tiny" text-anchor="middle">score + softmax</text><g class="node" data-node="mix"><rect x="941" y="669" width="263" height="46" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1072.5" y="689.7" class="node-title" text-anchor="middle" style="fill:#0f766e">α₇ V = m₇</text><text x="1072.5" y="703.96" class="node-caption" text-anchor="middle">query-specific mixture · 1 × 2</text></g><path d="M1072 715 V750" fill="none" stroke="#0f766e" stroke-width="2.8" opacity="1" marker-end="url(#stage-9-m)"/><g class="node" data-node="output"><rect x="971" y="750" width="203" height="46" rx="8" fill="#14773715" stroke="#147737" stroke-width="2.5"/><rect x="971" y="750" width="4" height="46" rx="2" fill="#147737" stroke="#147737" /><text x="1072.5" y="770.7" class="node-title" text-anchor="middle" style="fill:#147737">× W_O [2 × 5]</text><text x="1072.5" y="784.96" class="node-caption" text-anchor="middle">update Δe₇ · 1 × 5</text></g><line x1="48" y1="924" x2="1552" y2="924" stroke="#d8e1dc"/><text x="48" y="949" class="tiny" >SELF: Q, K and V come from the same E.   CAUSAL: receiver i reads only positions j ≤ i.</text><text x="1552" y="949" class="tiny" text-anchor="end">Hand-designed toy · decimals rounded · no FFN or normalization shown</text></svg>