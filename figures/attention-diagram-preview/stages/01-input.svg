<svg id="stage-0-svg" xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="stage-0-title stage-0-desc"><title id="stage-0-title">Stage 1: Start with the same input rows</title><desc id="stage-0-desc">The sentence is already given. We are first updating bank, at position 7—not predicting the word bank. Q and K create weights; V carries information. A separate residual path preserves the input representation. Receiver: 7, bank.</desc><defs><marker id="stage-0-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#9333ea"/></marker><marker id="stage-0-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#d97706"/></marker><marker id="stage-0-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0d9488"/></marker><marker id="stage-0-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#e11d48"/></marker><marker id="stage-0-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0d9488"/></marker><marker id="stage-0-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#16a34a"/></marker><marker id="stage-0-e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs><style>#stage-0-svg text{font-family:'Avenir Next','Segoe UI',Arial,sans-serif;fill:#243b39}#stage-0-svg .eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px}#stage-0-svg .heading{font-size:33px;font-weight:600;letter-spacing:-.6px}#stage-0-svg .stage-title{font-size:27px;font-weight:600;letter-spacing:-.4px}#stage-0-svg .body{font-size:21px}#stage-0-svg .detail{font-size:17px;fill:#6b7c77}#stage-0-svg .axis{font-size:16px;fill:#6b7c77}#stage-0-svg .smallcap{font-size:15px;font-weight:700;letter-spacing:.6px}#stage-0-svg .formula{font-family:'STIX Two Text',Georgia,serif;font-size:26px}#stage-0-svg .number{font-family:'SFMono-Regular',Consolas,monospace;font-size:24px}#stage-0-svg .table-number{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}#stage-0-svg .table-label{font-size:18px}#stage-0-svg .table-head{font-size:15px;font-weight:600;fill:#6b7c77}#stage-0-svg .node-title{font-size:20px;font-weight:600}#stage-0-svg .node-caption{font-size:13px;fill:#6b7c77}#stage-0-svg .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px}#stage-0-svg .token{font-size:19px}#stage-0-svg .position{font-size:12px;fill:#6b7c77}#stage-0-svg .tiny{font-size:13px;fill:#6b7c77}</style><rect x="0" y="0" width="1600" height="960" rx="0" fill="#fbfcf9" stroke="none" /><text x="48" y="44" class="eyebrow" style="fill:#d97706">PART 2 / A SINGLE ATTENTION HEAD</text><text x="48" y="87" class="heading" >How context reaches a token</text><text x="1538" y="43" class="eyebrow" text-anchor="end">01 / 12</text><text x="1538" y="82" class="detail" text-anchor="end">One input sequence · causal reads · one residual update</text><rect x="48" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="83" y="144" class="token" text-anchor="middle" style="fill:#243b39">The</text><text x="83" y="178" class="position" text-anchor="middle">1</text><rect x="127" y="117" width="146" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="200" y="144" class="token" text-anchor="middle" style="fill:#243b39">fisherman</text><text x="200" y="178" class="position" text-anchor="middle">2</text><rect x="282" y="117" width="65" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="314.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">sat</text><text x="314.5" y="178" class="position" text-anchor="middle">3</text><rect x="356" y="117" width="100" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="406" y="144" class="token" text-anchor="middle" style="fill:#243b39">beside</text><text x="406" y="178" class="position" text-anchor="middle">4</text><rect x="465" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="500" y="144" class="token" text-anchor="middle" style="fill:#243b39">the</text><text x="500" y="178" class="position" text-anchor="middle">5</text><rect x="544" y="117" width="81" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="584.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">river</text><text x="584.5" y="178" class="position" text-anchor="middle">6</text><rect x="634" y="117" width="87" height="42" rx="5" fill="#9333ea" stroke="#9333ea" /><text x="677.5" y="144" class="token" text-anchor="middle" style="fill:white">bank</text><text x="677.5" y="178" class="position" text-anchor="middle" style="fill:#9333ea">7 · receiver</text><rect x="730" y="117" width="72" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="766" y="144" class="token" text-anchor="middle" style="fill:#a2ada6">and</text><text x="766" y="178" class="position" text-anchor="middle">8 · future</text><rect x="811" y="117" width="127" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="874.5" y="144" class="token" text-anchor="middle" style="fill:#a2ada6">watched</text><text x="874.5" y="178" class="position" text-anchor="middle">9 · future</text><rect x="947" y="117" width="70" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="982" y="144" class="token" text-anchor="middle" style="fill:#a2ada6">the</text><text x="982" y="178" class="position" text-anchor="middle">10 · future</text><text x="1041" y="146" class="token" style="fill:#a2ada6">___</text><text x="1056" y="178" class="position" text-anchor="middle">11 · predict</text><line x1="48" y1="202" x2="1552" y2="202" stroke="#d8e1dc"/><text x="48" y="249" class="stage-title" >01   Start with the same input rows</text><text x="60" y="287" class="body" >The sentence is already given. We are first updating bank,</text><text x="60" y="315" class="body" >at position 7—not predicting the word bank.</text><text x="60" y="343" class="smallcap" style="fill:#2563eb">e₇ · BANK’S INPUT REPRESENTATION</text><text x="117.2" y="373" class="axis" text-anchor="middle">water</text><rect x="60" y="385" width="114.4" height="60" rx="5" fill="#2563eb0c" stroke="#2563eb55" /><text x="117.2" y="424" class="number" text-anchor="middle" style="fill:#2563eb">0.700</text><text x="243.60000000000002" y="373" class="axis" text-anchor="middle">finance</text><rect x="186.4" y="385" width="114.4" height="60" rx="5" fill="#2563eb0c" stroke="#2563eb55" /><text x="243.60000000000002" y="424" class="number" text-anchor="middle" style="fill:#2563eb">0.700</text><text x="370" y="373" class="axis" text-anchor="middle">person</text><rect x="312.8" y="385" width="114.4" height="60" rx="5" fill="#2563eb0c" stroke="#2563eb55" /><text x="370" y="424" class="number" text-anchor="middle" style="fill:#2563eb">0.000</text><text x="496.40000000000003" y="373" class="axis" text-anchor="middle">glue</text><rect x="439.20000000000005" y="385" width="114.4" height="60" rx="5" fill="#2563eb0c" stroke="#2563eb55" /><text x="496.40000000000003" y="424" class="number" text-anchor="middle" style="fill:#2563eb">0.700</text><text x="622.8000000000001" y="373" class="axis" text-anchor="middle">pos</text><rect x="565.6" y="385" width="114.4" height="60" rx="5" fill="#2563eb0c" stroke="#2563eb55" /><text x="622.8000000000001" y="424" class="number" text-anchor="middle" style="fill:#2563eb">0.700</text><text x="60" y="508" class="body" >10 input positions × 5 coordinates = shape [10, 5]</text><text x="60" y="548" class="detail" >Only the receiver row is highlighted; the input stays fixed.</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" style="fill:#d97706">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >i = 6  # position 7, using zero-based indexing</text><text x="66" y="815" class="code" >e = E[i:i+1]  # keep a row: [1, 5]</text><text x="60" y="873" class="detail" >E includes token embedding + position. In this toy,</text><text x="60" y="898" class="detail" >the projections ignore position; the causal mask still applies.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#2563eb15" stroke="#2563eb" stroke-width="2.5"/><rect x="1030" y="224" width="4" height="60" rx="2" fill="#2563eb" stroke="#2563eb" /><text x="1135" y="251" class="node-title" text-anchor="middle" style="fill:#2563eb">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 5 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" style="fill:#9333ea" text-anchor="end">receiver 7 · bank</text><line x1="48" y1="924" x2="1552" y2="924" stroke="#d8e1dc"/><text x="48" y="949" class="tiny" >SELF: Q, K and V come from the same E.   CAUSAL: receiver i reads only positions j ≤ i.</text><text x="1552" y="949" class="tiny" text-anchor="end">Hand-designed toy · decimals rounded · no FFN or normalization shown</text></svg>