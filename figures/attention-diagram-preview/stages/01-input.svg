<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="stage-0-title stage-0-desc"><title id="stage-0-title">Stage 1: Start with the same input rows</title><desc id="stage-0-desc">The sentence is already given. We are first updating bank, at position 7—not predicting the word bank. Q and K create weights; V carries information. A separate residual path preserves the input representation. Receiver: 7, bank.</desc><defs><marker id="stage-0-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2a65a4"/></marker><marker id="stage-0-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#247c78"/></marker><marker id="stage-0-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#ae6825"/></marker><marker id="stage-0-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#526b8c"/></marker><marker id="stage-0-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#a36b2b"/></marker><marker id="stage-0-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#357957"/></marker><marker id="stage-0-e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#485f59"/></marker></defs><style>text{font-family:'Avenir Next','Segoe UI',Arial,sans-serif;fill:#243b39}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px}.heading{font-size:33px;font-weight:600;letter-spacing:-.6px}.stage-title{font-size:27px;font-weight:600;letter-spacing:-.4px}.body{font-size:21px}.detail{font-size:17px;fill:#6b7c77}.axis{font-size:16px;fill:#6b7c77}.smallcap{font-size:15px;font-weight:700;letter-spacing:.6px}.formula{font-family:'STIX Two Text',Georgia,serif;font-size:26px}.number{font-family:'SFMono-Regular',Consolas,monospace;font-size:24px}.table-number{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}.table-label{font-size:18px}.table-head{font-size:15px;font-weight:600;fill:#6b7c77}.node-title{font-size:20px;font-weight:600}.node-caption{font-size:13px;fill:#6b7c77}.code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px}.token{font-size:19px}.position{font-size:12px;fill:#6b7c77}.tiny{font-size:13px;fill:#6b7c77}</style><rect x="0" y="0" width="1600" height="960" rx="0" fill="#fbfcf9" stroke="none" /><text x="48" y="44" class="eyebrow" fill="#247c78">PART 2 / A SINGLE ATTENTION HEAD</text><text x="48" y="87" class="heading" >How context reaches a token</text><text x="1538" y="43" class="eyebrow" text-anchor="end">01 / 12</text><text x="1538" y="82" class="detail" text-anchor="end">One input sequence · causal reads · one residual update</text><rect x="48" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="83" y="144" class="token" text-anchor="middle" fill="#243b39">The</text><text x="83" y="178" class="position" text-anchor="middle">1</text><rect x="127" y="117" width="146" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="200" y="144" class="token" text-anchor="middle" fill="#243b39">fisherman</text><text x="200" y="178" class="position" text-anchor="middle">2</text><rect x="282" y="117" width="65" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="314.5" y="144" class="token" text-anchor="middle" fill="#243b39">sat</text><text x="314.5" y="178" class="position" text-anchor="middle">3</text><rect x="356" y="117" width="100" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="406" y="144" class="token" text-anchor="middle" fill="#243b39">beside</text><text x="406" y="178" class="position" text-anchor="middle">4</text><rect x="465" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="500" y="144" class="token" text-anchor="middle" fill="#243b39">the</text><text x="500" y="178" class="position" text-anchor="middle">5</text><rect x="544" y="117" width="81" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="584.5" y="144" class="token" text-anchor="middle" fill="#243b39">river</text><text x="584.5" y="178" class="position" text-anchor="middle">6</text><rect x="634" y="117" width="87" height="42" rx="5" fill="#2a65a4" stroke="#2a65a4" /><text x="677.5" y="144" class="token" text-anchor="middle" fill="white">bank</text><text x="677.5" y="178" class="position" text-anchor="middle" fill="#2a65a4">7 · receiver</text><rect x="730" y="117" width="72" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="766" y="144" class="token" text-anchor="middle" fill="#a2ada6">and</text><text x="766" y="178" class="position" text-anchor="middle">8 · future</text><rect x="811" y="117" width="127" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="874.5" y="144" class="token" text-anchor="middle" fill="#a2ada6">watched</text><text x="874.5" y="178" class="position" text-anchor="middle">9 · future</text><rect x="947" y="117" width="70" height="42" rx="5" fill="#f0f2ee" stroke="#d8e1dc" /><text x="982" y="144" class="token" text-anchor="middle" fill="#a2ada6">the</text><text x="982" y="178" class="position" text-anchor="middle">10 · future</text><text x="1041" y="146" class="token" fill="#a2ada6">___</text><text x="1056" y="178" class="position" text-anchor="middle">11 · predict</text><line x1="48" y1="202" x2="1552" y2="202" stroke="#d8e1dc"/><text x="48" y="249" class="stage-title" >01   Start with the same input rows</text><text x="60" y="287" class="body" >The sentence is already given. We are first updating bank,</text><text x="60" y="315" class="body" >at position 7—not predicting the word bank.</text><text x="60" y="343" class="smallcap" fill="#485f59">e₇ · BANK’S INPUT REPRESENTATION</text><text x="133" y="373" class="axis" text-anchor="middle">water</text><rect x="60" y="385" width="146" height="60" rx="5" fill="#485f590c" stroke="#485f5955" /><text x="133" y="424" class="number" text-anchor="middle" fill="#485f59">0.700</text><text x="291" y="373" class="axis" text-anchor="middle">finance</text><rect x="218" y="385" width="146" height="60" rx="5" fill="#485f590c" stroke="#485f5955" /><text x="291" y="424" class="number" text-anchor="middle" fill="#485f59">0.700</text><text x="449" y="373" class="axis" text-anchor="middle">person</text><rect x="376" y="385" width="146" height="60" rx="5" fill="#485f590c" stroke="#485f5955" /><text x="449" y="424" class="number" text-anchor="middle" fill="#485f59">−0.100</text><text x="607" y="373" class="axis" text-anchor="middle">glue</text><rect x="534" y="385" width="146" height="60" rx="5" fill="#485f590c" stroke="#485f5955" /><text x="607" y="424" class="number" text-anchor="middle" fill="#485f59">0.900</text><text x="60" y="508" class="body" >10 input positions × 4 coordinates = E ∈ ℝ¹⁰ˣ⁴</text><text x="60" y="548" class="detail" >Only the receiver row is highlighted; the input stays fixed.</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" fill="#247c78">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >i = 6  # position 7, using zero-based indexing</text><text x="66" y="815" class="code" >e = E[i:i+1]  # keep a row: [1, 4]</text><text x="60" y="873" class="detail" >E stores the current token representations as rows.</text><text x="60" y="898" class="detail" >Here: token embedding + position information.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#485f5915" stroke="#485f59" stroke-width="2.5"/><rect x="1030" y="224" width="4" height="60" rx="2" fill="#485f59" stroke="#485f59" /><text x="1135" y="251" class="node-title" text-anchor="middle" fill="#485f59">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 4 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" fill="#2a65a4" text-anchor="end">receiver 7 · bank</text><line x1="48" y1="924" x2="1552" y2="924" stroke="#d8e1dc"/><text x="48" y="949" class="tiny" >SELF: Q, K and V come from the same E.   CAUSAL: receiver i reads only positions j ≤ i.</text><text x="1552" y="949" class="tiny" text-anchor="end">Hand-designed toy · decimals rounded · no FFN or normalization shown</text></svg>