<svg id="stage-2-svg" xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="stage-2-title stage-2-desc"><title id="stage-2-title">Stage 3: Every token offers a matching key</title><desc id="stage-2-desc">Each source describes when it may be useful. Bank’s one query will be compared with all these keys. Q and K create weights; V carries information. A separate residual path preserves the input representation. Receiver: 7, bank.</desc><defs><marker id="stage-2-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#9333ea"/></marker><marker id="stage-2-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#d97706"/></marker><marker id="stage-2-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0d9488"/></marker><marker id="stage-2-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#e11d48"/></marker><marker id="stage-2-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0d9488"/></marker><marker id="stage-2-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#16a34a"/></marker><marker id="stage-2-e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs><style>#stage-2-svg text{font-family:'Avenir Next','Segoe UI',Arial,sans-serif;fill:#243b39}#stage-2-svg .eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px}#stage-2-svg .heading{font-size:33px;font-weight:600;letter-spacing:-.6px}#stage-2-svg .stage-title{font-size:27px;font-weight:600;letter-spacing:-.4px}#stage-2-svg .body{font-size:21px}#stage-2-svg .detail{font-size:17px;fill:#6b7c77}#stage-2-svg .axis{font-size:16px;fill:#6b7c77}#stage-2-svg .smallcap{font-size:15px;font-weight:700;letter-spacing:.6px}#stage-2-svg .formula{font-family:'STIX Two Text',Georgia,serif;font-size:26px}#stage-2-svg .number{font-family:'SFMono-Regular',Consolas,monospace;font-size:24px}#stage-2-svg .table-number{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}#stage-2-svg .table-label{font-size:18px}#stage-2-svg .table-head{font-size:15px;font-weight:600;fill:#6b7c77}#stage-2-svg .node-title{font-size:20px;font-weight:600}#stage-2-svg .node-caption{font-size:13px;fill:#6b7c77}#stage-2-svg .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px}#stage-2-svg .token{font-size:19px}#stage-2-svg .position{font-size:12px;fill:#6b7c77}#stage-2-svg .tiny{font-size:13px;fill:#6b7c77}</style><rect x="0" y="0" width="1600" height="960" rx="0" fill="#fbfcf9" stroke="none" /><text x="48" y="44" class="eyebrow" style="fill:#d97706">PART 2 / A SINGLE ATTENTION HEAD</text><text x="48" y="87" class="heading" >How context reaches a token</text><text x="1538" y="43" class="eyebrow" text-anchor="end">03 / 12</text><text x="1538" y="82" class="detail" text-anchor="end">One input sequence · causal reads · one residual update</text><rect x="48" y="117" width="70" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="83" y="144" class="token" text-anchor="middle" style="fill:#243b39">The</text><text x="83" y="178" class="position" text-anchor="middle">1</text><rect x="127" y="117" width="146" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="200" y="144" class="token" text-anchor="middle" style="fill:#243b39">fisherman</text><text x="200" y="178" class="position" text-anchor="middle">2</text><rect x="282" y="117" width="65" height="42" rx="5" fill="white" stroke="#d8e1dc" /><text x="314.5" y="144" class="token" text-anchor="middle" style="fill:#243b39">sat</t