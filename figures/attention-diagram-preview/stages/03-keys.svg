66" y="760" class="smallcap" fill="#247c78">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >K = E @ W_K  # [10, 4] @ [4, 3] → [10, 3]</text><text x="60" y="873" class="detail" >A key helps determine how much attention a source receives.</text><text x="60" y="898" class="detail" >It is not the information payload we will mix.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="251" class="node-title" text-anchor="middle" fill="#485f59">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 4 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" fill="#2a65a4" text-anchor="end">receiver 7 · bank</text><path d="M1080 284 V299 H915 V319" fill="none" stroke="#2a65a4" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-2-q)"/><path d="M1135 284 V319" fill="none" stroke="#247c78" stroke-width="2.8" opacity="1" marker-end="url(#stage-2-k)"/><text x="916" y="309" class="tiny" text-anchor="middle">W_Q · 4 × 3</text><text x="1195" y="309" class="tiny" >W_K · 4 × 3</text><g class="node" data-node="q"><rect x="835" y="319" width="160" height="58" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="915" y="345.1" class="node-title" text-anchor="middle" fill="#2a65a4">Query q₇</text><text x="915" y="363.08" class="node-caption" text-anchor="middle">1 × 3 · request</text></g><g class="node" data-node="k"><rect x="1055" y="319" width="160" height="58" rx="8" fill="#247c7815" stroke="#247c78" stroke-width="2.5"/><rect x="1055" y="319" width="4" height="58" rx="2" fill="#247c78" stroke="#247c78" /><text x="1135" y="345.1" class="node-title" text-anchor="middle" fill="#247c78">Keys K</text><text x="1135" y="363.08" class="node-caption" text-anchor="middle">10 × 3 · matching</text></g><line x1="48" y1="924" x2="1552" y2="924" 