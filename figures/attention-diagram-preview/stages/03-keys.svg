middle" style="fill:#a9b4af">0.80</text><text x="60" y="672" class="table-label" style="fill:#a9b4af">10 · the</text><text x="371" y="672" class="table-number" text-anchor="middle" style="fill:#a9b4af">0.00</text><text x="503" y="672" class="table-number" text-anchor="middle" style="fill:#a9b4af">0.00</text><text x="635" y="672" class="table-number" text-anchor="middle" style="fill:#a9b4af">0.00</text><text x="60" y="696" class="detail" >Each key has 3 matching coordinates.</text><rect x="48" y="735" width="685" height="101" rx="6" fill="#eef3ee" stroke="none" /><text x="66" y="760" class="smallcap" style="fill:#d97706">PYTORCH · THE ACTIVE OPERATION</text><text x="66" y="790" class="code" >K = E @ W_K  # [10, 5] @ [5, 3] → [10, 3]</text><text x="60" y="873" class="detail" >A key helps determine how much attention a source receives.</text><text x="60" y="898" class="detail" >It is not the information payload we will mix.</text><line x1="768" y1="224" x2="768" y2="910" stroke="#d8e1dc"/><g class="node" data-node="input"><rect x="1030" y="224" width="210" height="60" rx="8" fill="#ffffff" stroke="#d8e1dc" stroke-width="1.5"/><text x="1135" y="251" class="node-title" text-anchor="middle" style="fill:#2563eb">Input E</text><text x="1135" y="269.6" class="node-caption" text-anchor="middle">10 × 5 · unchanged snapshot</text></g><text x="1474" y="241" class="smallcap" style="fill:#9333ea" text-anchor="end">receiver 7 · bank</text><path d="M1080 284 V299 H915 V319" fill="none" stroke="#9333ea" stroke-width="1.8" opacity="0.65" marker-end="url(#stage-2-q)"/><path d="M1135 284 V319" fill="none" stroke="#d97706" stroke-width="2.8" opacity="1" marker-end="url(#stage-2-k)"/><rect x="859" y="292" width="112" height="21" rx="0" fill="#fbfcf9" stroke="none" /><text x="915" y="308" class="tiny" text-anchor="middle">W_Q · 5 × 3</text><text x="1203" y="314" class="tiny" >W_K · 5 × 3</text><g class="node" data-node="q"><rect x="835" y="319" width="160" height="58" rx="8" fill="#ffffff"