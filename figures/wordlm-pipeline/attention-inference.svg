<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 695" role="img" aria-label="attention inference pipeline" data-focus="" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><defs><marker id="pipeline-attention-inference-all-data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#245EDB"/></marker><marker id="pipeline-attention-inference-all-q-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8B2CDE"/></marker><marker id="pipeline-attention-inference-all-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#BE123C"/></marker><marker id="pipeline-attention-inference-all-v-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0F766E"/></marker><marker id="pipeline-attention-inference-all-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#147737"/></marker><marker id="pipeline-attention-inference-all-neutral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5160"/></marker></defs><g opacity="1" data-edge="prompt:tokenize"><path d="M270 73 L440 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="tokenize:windows"><path d="M670 73 L840 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="windows:embedding"><path d="M955 116 L955 165 L155 165 L155 230" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="checkpoint:embedding"><path d="M1355 116 L1355 195 L285 195 L285 210 L200 210 L200 230" fill="none" stroke="#8B2CDE" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-q-arrow)" stroke-dasharray="7 5"/><text x="790" y="190" text-anchor="middle" font-size="21" fill="#8B2CDE">load weights for every learned layer</text></g><g opacity="1" data-edge="embedding:qkv"><path d="M270 273 L340 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="qkv:scores"><path d="M570 273 L640 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="scores:weights"><path d="M870 273 L940 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="weights:message"><path d="M1170 273 L1240 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="message:projection"><path d="M1355 316 L1355 395" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="projection:residual"><path d="M1240 438 L1170 438" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="residual:readout"><path d="M940 438 L870 438" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="readout:hidden"><path d="M640 438 L570 438" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="hidden:logits"><path d="M340 438 L270 438" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="qkv:message"><path d="M455 316 L455 342 L1270 342 L1270 316" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-v-arrow)" stroke-dasharray="7 5"/><text x="862.5" y="335" text-anchor="middle" font-size="21" fill="#0F766E">V bypasses scoring</text></g><g opacity="1" data-edge="embedding:residual"><path d="M155 316 L155 370 L1055 370 L1055 395" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-data-arrow)" stroke-dasharray="7 5"/><text x="605.0" y="363" text-anchor="middle" font-size="21" fill="#245EDB">keep the final input row</text></g><g opacity="1" data-edge="logits:probabilities"><path d="M155 481 L155 565" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="probabilities:choose"><path d="M270 608 L440 608" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="choose:stop"><path d="M670 608 L840 608" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="stop:append"><path d="M1070 608 L1240 608" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-neutral-arrow)"/></g><g opacity="1" data-edge="append:windows"><path d="M1470 608 L1490 608 L1490 145 L955 145 L955 116" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#pipeline-attention-inference-all-data-arrow)" stroke-dasharray="7 5"/></g><g data-stage="prompt" data-active="true" opacity="1"><rect x="40" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="155" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Prompt text</text><text x="155" y="105" text-anchor="middle" font-size="18" fill="#4A5160">known words only</text></g><g data-stage="tokenize" data-active="true" opacity="1"><rect x="440" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="555" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Saved tokenizer</text><text x="555" y="105" text-anchor="middle" font-size="18" fill="#4A5160">same vocabulary + &lt;BOS&gt;</text></g><g data-stage="windows" data-active="true" opacity="1"><rect x="840" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="955" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Crop, then left-pad</text><text x="955" y="105" text-anchor="middle" font-size="18" fill="#4A5160">last w IDs → X [1,w]</text></g><g data-stage="checkpoint" data-active="true" opacity="1"><rect x="1240" y="30" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="1355" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Saved parameters</text><text x="1355" y="105" text-anchor="middle" font-size="18" fill="#4A5160">θ stays fixed</text></g><g data-stage="embedding" data-active="true" opacity="1"><rect x="40" y="230" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="155" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Token lookup</text><text x="155" y="284" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">+ position</text><text x="155" y="305" text-anchor="middle" font-size="18" fill="#4A5160">E [1,w,d]</text></g><g data-stage="qkv" data-active="true" opacity="1"><rect x="340" y="230" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="455" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Final q, all</text><text x="455" y="284" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">K and V</text><text x="455" y="305" text-anchor="middle" font-size="18" fill="#4A5160">q [B,1,dₖ] · K,V: w rows</text></g><g data-stage="scores" data-active="true" opacity="1"><rect x="640" y="230" width="230" height="86" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="2"/><text x="755" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">qKᵀ / √dₖ</text><text x="755" y="305" text-anchor="middle" font-size="18" fill="#4A5160">scores [B,1,w]</text></g><g data-stage="weights" data-active="true" opacity="1"><rect x="940" y="230" width="230" height="86" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="2"/><text x="1055" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Mask PAD · softmax</text><text x="1055" y="305" text-anchor="middle" font-size="18" fill="#4A5160">weights A [B,1,w]</text></g><g data-stage="message" data-active="true" opacity="1"><rect x="1240" y="230" width="230" height="86" rx="9" fill="#D9F2EF" stroke="#0F766E" stroke-width="2"/><text x="1355" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">A @ V</text><text x="1355" y="305" text-anchor="middle" font-size="18" fill="#4A5160">message [B,1,dᵥ]</text></g><g data-stage="projection" data-active="true" opacity="1"><rect x="1240" y="395" width="230" height="86" rx="9" fill="#DDF3E4" stroke="#147737" stroke-width="2"/><text x="1355" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Output map Wₒ</text><text x="1355" y="470" text-anchor="middle" font-size="18" fill="#4A5160">update [B,1,d]</text></g><g data-stage="residual" data-active="true" opacity="1"><rect x="940" y="395" width="230" height="86" rx="9" fill="#DDF3E4" stroke="#147737" stroke-width="2"/><text x="1055" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Add original</text><text x="1055" y="449" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">final row</text><text x="1055" y="470" text-anchor="middle" font-size="18" fill="#4A5160">e′ = e + update</text></g><g data-stage="readout" data-active="true" opacity="1"><rect x="640" y="395" width="230" height="86" rx="9" fill="#DDF3E4" stroke="#147737" stroke-width="2"/><text x="755" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Final</text><text x="755" y="449" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">updated vector</text><text x="755" y="470" text-anchor="middle" font-size="18" fill="#4A5160">[B,d]</text></g><g data-stage="hidden" data-active="true" opacity="1"><rect x="340" y="395" width="230" height="86" rx="9" fill="#D9F2EF" stroke="#0F766E" stroke-width="2"/><text x="455" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Affine + ReLU</text><text x="455" y="470" text-anchor="middle" font-size="18" fill="#4A5160">hidden [B,h]</text></g><g data-stage="logits" data-active="true" opacity="1"><rect x="40" y="395" width="230" height="86" rx="9" fill="#EEF0F4" stroke="#4A5160" stroke-width="2"/><text x="155" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Vocabulary affine</text><text x="155" y="470" text-anchor="middle" font-size="18" fill="#4A5160">logits z [B,C]</text></g><g data-stage="probabilities" data-active="true" opacity="1"><rect x="40" y="565" width="230" height="86" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="2"/><text x="155" y="594" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Vocabulary softmax</text><text x="155" y="640" text-anchor="middle" font-size="18" fill="#4A5160">z / temperature</text></g><g data-stage="choose" data-active="true" opacity="1"><rect x="440" y="565" width="230" height="86" rx="9" fill="#DDF3E4" stroke="#147737" stroke-width="2"/><text x="555" y="594" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Choose a token</text><text x="555" y="640" text-anchor="middle" font-size="18" fill="#4A5160">sample or greedy</text></g><g data-stage="stop" data-active="true" opacity="1"><rect x="840" y="565" width="230" height="86" rx="9" fill="#EEF0F4" stroke="#4A5160" stroke-width="2"/><text x="955" y="594" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Is it &lt;EOS&gt;?</text><text x="955" y="640" text-anchor="middle" font-size="18" fill="#4A5160">yes: finish · no: append</text></g><g data-stage="append" data-active="true" opacity="1"><rect x="1240" y="565" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="1355" y="594" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Append to history</text><text x="1355" y="640" text-anchor="middle" font-size="18" fill="#4A5160">repeat if budget remains</text></g></svg>