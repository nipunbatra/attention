<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Many batches, with validation between checkpoints" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Many batches, with validation between checkpoints</title><rect x="20" y="15" width="1120" height="280" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="63.3" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Stage</text><text x="282" y="63.3" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Data / action</text><path d="M20 85 L1140 85" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="133.3" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Training step</text><text x="282" y="133.3" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">512 sampled windows; forward, loss, backward, AdamW</text><path d="M20 155 L1140 155" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="203.3" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Validation</text><text x="282" y="203.3" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Evaluate frozen weights; save lower validation loss</text><path d="M20 225 L1140 225" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="273.3" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Finish</text><text x="282" y="273.3" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Restore best validation checkpoint; score test once</text></svg>