<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 530" role="img" aria-label="mlp inference pipeline" data-focus="choose probabilities" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><defs><marker id="pipeline-route-decoding-data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#245EDB"/></marker><marker id="pipeline-route-decoding-q-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8B2CDE"/></marker><marker id="pipeline-route-decoding-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#BE123C"/></marker><marker id="pipeline-route-decoding-v-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0F766E"/></marker><marker id="pipeline-route-decoding-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#147737"/></marker><marker id="pipeline-route-decoding-neutral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5160"/></marker></defs><g opacity="0.35" data-edge="prompt:tokenize"><path d="M270 73 L440 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="0.35" data-edge="tokenize:windows"><path d="M670 73 L840 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="0.35" data-edge="windows:embedding"><path d="M955 116 L955 165 L155 165 L155 230" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="0.35" data-edge="checkpoint:embedding"><path d="M1355 116 L1355 195 L285 195 L285 210 L200 210 L200 230" fill="none" stroke="#8B2CDE" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-q-arrow)" stroke-dasharray="7 5"/><text x="790" y="190" text-anchor="middle" font-size="21" fill="#8B2CDE">load weights for every learned layer</text></g><g opacity="0.35" data-edge="embedding:flatten"><path d="M270 273 L440 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="0.35" data-edge="flatten:hidden"><path d="M670 273 L840 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="0.35" data-edge="hidden:logits"><path d="M1070 273 L1240 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="1" data-edge="logits:probabilities"><path d="M1355 316 L1355 350 L155 350 L155 400" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="1" data-edge="probabilities:choose"><path d="M270 443 L440 443" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="1" data-edge="choose:stop"><path d="M670 443 L840 443" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="0.35" data-edge="stop:append"><path d="M1070 443 L1240 443" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-neutral-arrow)"/></g><g opacity="0.35" data-edge="append:windows"><path d="M1470 443 L1490 443 L1490 145 L955 145 L955 116" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#pipeline-route-decoding-data-arrow)" stroke-dasharray="7 5"/></g><g data-stage="prompt" data-active="false" opacity="0.45"><rect x="40" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="155" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Prompt text</text><text x="155" y="105" text-anchor="middle" font-size="18" fill="#4A5160">known words only</text></g><g data-stage="tokenize" data-active="false" opacity="0.45"><rect x="440" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="555" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Saved tokenizer</text><text x="555" y="105" text-anchor="middle" font-size="18" fill="#4A5160">same vocabulary + &lt;BOS&gt;</text></g><g data-stage="windows" data-active="false" opacity="0.45"><rect x="840" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="955" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Crop, then left-pad</text><text x="955" y="105" text-anchor="middle" font-size="18" fill="#4A5160">last w IDs → X [1,w]</text></g><g data-stage="checkpoint" data-active="false" opacity="0.45"><rect x="1240" y="30" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="1355" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Saved parameters</text><text x="1355" y="105" text-anchor="middle" font-size="18" fill="#4A5160">θ stays fixed</text></g><g data-stage="embedding" data-active="false" opacity="0.45"><rect x="40" y="230" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="155" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Token lookup</text><text x="155" y="305" text-anchor="middle" font-size="18" fill="#4A5160">E [1,w,d]</text></g><g data-stage="flatten" data-active="false" opacity="0.45"><rect x="440" y="230" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="555" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Join ordered rows</text><text x="555" y="305" text-anchor="middle" font-size="18" fill="#4A5160">flatten [B,w·d]</text></g><g data-stage="hidden" data-active="false" opacity="0.45"><rect x="840" y="230" width="230" height="86" rx="9" fill="#D9F2EF" stroke="#0F766E" stroke-width="2"/><text x="955" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Affine + ReLU</text><text x="955" y="305" text-anchor="middle" font-size="18" fill="#4A5160">hidden [B,h]</text></g><g data-stage="logits" data-active="false" opacity="0.45"><rect x="1240" y="230" width="230" height="86" rx="9" fill="#EEF0F4" stroke="#4A5160" stroke-width="2"/><text x="1355" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Vocabulary affine</text><text x="1355" y="305" text-anchor="middle" font-size="18" fill="#4A5160">logits z [B,C]</text></g><g data-stage="probabilities" data-active="true" opacity="1"><rect x="40" y="400" width="230" height="86" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="4"/><text x="155" y="429" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Vocabulary softmax</text><text x="155" y="475" text-anchor="middle" font-size="18" fill="#4A5160">z / temperature</text></g><g data-stage="choose" data-active="true" opacity="1"><rect x="440" y="400" width="230" height="86" rx="9" fill="#DDF3E4" stroke="#147737" stroke-width="4"/><text x="555" y="429" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Choose a token</text><text x="555" y="475" text-anchor="middle" font-size="18" fill="#4A5160">sample or greedy</text></g><g data-stage="stop" data-active="false" opacity="0.45"><rect x="840" y="400" width="230" height="86" rx="9" fill="#EEF0F4" stroke="#4A5160" stroke-width="2"/><text x="955" y="429" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Is it &lt;EOS&gt;?</text><text x="955" y="475" text-anchor="middle" font-size="18" fill="#4A5160">yes: finish · no: append</text></g><g data-stage="append" data-active="false" opacity="0.45"><rect x="1240" y="400" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="1355" y="429" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Append to history</text><text x="1355" y="475" text-anchor="middle" font-size="18" fill="#4A5160">repeat if budget remains</text></g></svg>