<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="One optimizer step changes the stored weights" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>One optimizer step changes the stored weights</title><text x="25" y="65" fill="#8B2CDE" font-size="39" font-weight="600" text-anchor="start">-0.022 − 0.1 × (0.011) = -0.023</text><text x="25" y="145" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">old weight             learning rate × gradient          new weight</text><text x="25" y="225" fill="#BE123C" font-size="32" font-weight="500" text-anchor="start">On this batch: loss 2.298 → 2.239</text><text x="25" y="285" fill="#4A5160" font-size="26" font-weight="500" text-anchor="start">The step updates all trainable parameters, not just this one weight.</text></svg>