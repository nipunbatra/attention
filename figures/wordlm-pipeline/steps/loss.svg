<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Per-example loss and batch mean" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Per-example loss and batch mean</title><rect x="20" y="15" width="1120" height="195" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Example</text><text x="202" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Target</text><text x="382" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Target probability</text><text x="752" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">−log(probability)</text><path d="M20 80 L1140 80" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="124.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">0</text><text x="202" y="124.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">a</text><text x="382" y="124.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">0.070</text><text x="752" y="124.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">2.662</text><path d="M20 145 L1140 145" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="189.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">1</text><text x="202" y="189.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">red</text><text x="382" y="189.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">0.144</text><text x="752" y="189.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">1.935</text><text x="25" y="280" fill="#BE123C" font-size="30" font-weight="600" text-anchor="start">Batch loss = (2.662 + 1.935) / 2 = 2.298</text></svg>