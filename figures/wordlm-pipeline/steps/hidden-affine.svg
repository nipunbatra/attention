<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="One hidden neuron combines all sixteen inputs" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>One hidden neuron combines all sixteen inputs</title><text x="25" y="40" fill="#0F766E" font-size="29" font-weight="600" text-anchor="start">Hidden neuron 0, example 1</text><rect x="20" y="65" width="1120" height="200" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="92.6" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Input group</text><text x="622" y="92.6" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Sum of four weighted inputs</text><path d="M20 105 L1140 105" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="132.6" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Slot 1: &lt;BOS&gt;</text><text x="622" y="132.6" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">0.027</text><path d="M20 145 L1140 145" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="172.6" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Slot 2: lily</text><text x="622" y="172.6" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">-0.412</text><path d="M20 185 L1140 185" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="212.6" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Slot 3: found</text><text x="622" y="212.6" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">0.011</text><path d="M20 225 L1140 225" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="252.6" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Slot 4: a</text><text x="622" y="252.6" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">0.082</text><text x="25" y="300" fill="#0F766E" font-size="27" font-weight="600" text-anchor="start">Sum -0.293 + bias -0.044 = -0.336</text></svg>