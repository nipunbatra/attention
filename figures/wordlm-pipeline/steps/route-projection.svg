<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 695" role="img" aria-label="attention training pipeline" data-focus="projection readout residual" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><defs><marker id="pipeline-route-projection-data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#245EDB"/></marker><marker id="pipeline-route-projection-q-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8B2CDE"/></marker><marker id="pipeline-route-projection-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#BE123C"/></marker><marker id="pipeline-route-projection-v-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0F766E"/></marker><marker id="pipeline-route-projection-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#147737"/></marker><marker id="pipeline-route-projection-neutral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5160"/></marker></defs><g opacity="0.35" data-edge="stories:split"><path d="M270 73 L340 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="split:tokenize"><path d="M570 73 L640 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/><text x="605" y="63" text-anchor="middle" font-size="21" fill="#4A5160">train</text></g><g opacity="0.35" data-edge="tokenize:ids"><path d="M870 73 L940 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="ids:windows"><path d="M1170 73 L1240 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="windows:embedding"><path d="M1355 116 L1355 165 L155 165 L155 230" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="embedding:qkv"><path d="M270 273 L340 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="qkv:scores"><path d="M570 273 L640 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="scores:weights"><path d="M870 273 L940 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="weights:message"><path d="M1170 273 L1240 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="1" data-edge="message:projection"><path d="M1355 316 L1355 395" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="1" data-edge="projection:residual"><path d="M1240 438 L1170 438" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="1" data-edge="residual:readout"><path d="M940 438 L870 438" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="1" data-edge="readout:hidden"><path d="M640 438 L570 438" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="hidden:logits"><path d="M340 438 L270 438" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="qkv:message"><path d="M455 316 L455 342 L1270 342 L1270 316" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#pipeline-route-projection-v-arrow)" stroke-dasharray="7 5"/><text x="862.5" y="335" text-anchor="middle" font-size="21" fill="#0F766E">V bypasses scoring</text></g><g opacity="1" data-edge="embedding:residual"><path d="M155 316 L155 370 L1055 370 L1055 395" fill="none" stroke="#245EDB" stroke-width="2.5" marker-end="url(#pipeline-route-projection-data-arrow)" stroke-dasharray="7 5"/><text x="605.0" y="363" text-anchor="middle" font-size="21" fill="#245EDB">keep the final input row</text></g><g opacity="0.35" data-edge="logits:loss"><path d="M155 481 L155 565" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="windows:loss"><path d="M1470 73 L1490 73 L1490 533 L280 533 L280 608 L270 608" fill="none" stroke="#BE123C" stroke-width="2.5" marker-end="url(#pipeline-route-projection-a-arrow)" stroke-dasharray="7 5"/><text x="1120" y="523" text-anchor="middle" font-size="21" fill="#BE123C">target y [B]</text></g><g opacity="0.35" data-edge="loss:backward"><path d="M270 608 L440 608" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="backward:optimizer"><path d="M670 608 L840 608" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g opacity="0.35" data-edge="optimizer:parameters"><path d="M1070 608 L1240 608" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-projection-neutral-arrow)"/></g><g data-stage="stories" data-active="false" opacity="0.45"><rect x="40" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="155" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">TinyStories</text><text x="155" y="105" text-anchor="middle" font-size="18" fill="#4A5160">complete documents</text></g><g data-stage="split" data-active="false" opacity="0.45"><rect x="340" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="455" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Split stories</text><text x="455" y="105" text-anchor="middle" font-size="18" fill="#4A5160">train / validation / test</text></g><g data-stage="tokenize" data-active="false" opacity="0.45"><rect x="640" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="755" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Tokenize +</text><text x="755" y="84" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">assign IDs</text><text x="755" y="105" text-anchor="middle" font-size="18" fill="#4A5160">train-only vocabulary</text></g><g data-stage="ids" data-active="false" opacity="0.45"><rect x="940" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="1055" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">IDs + boundaries</text><text x="1055" y="105" text-anchor="middle" font-size="18" fill="#4A5160">&lt;BOS&gt; … &lt;EOS&gt;</text></g><g data-stage="windows" data-active="false" opacity="0.45"><rect x="1240" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="1355" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Context and target</text><text x="1355" y="105" text-anchor="middle" font-size="18" fill="#4A5160">X [B,w]   y [B]</text></g><g data-stage="embedding" data-active="false" opacity="0.45"><rect x="40" y="230" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="155" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Token lookup</text><text x="155" y="284" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">+ position</text><text x="155" y="305" text-anchor="middle" font-size="18" fill="#4A5160">E [B,w,d]</text></g><g data-stage="qkv" data-active="false" opacity="0.45"><rect x="340" y="230" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="455" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Final q, all</text><text x="455" y="284" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">K and V</text><text x="455" y="305" text-anchor="middle" font-size="18" fill="#4A5160">q [B,1,dₖ] · K,V: w rows</text></g><g data-stage="scores" data-active="false" opacity="0.45"><rect x="640" y="230" width="230" height="86" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="2"/><text x="755" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">qKᵀ / √dₖ</text><text x="755" y="305" text-anchor="middle" font-size="18" fill="#4A5160">scores [B,1,w]</text></g><g data-stage="weights" data-active="false" opacity="0.45"><rect x="940" y="230" width="230" height="86" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="2"/><text x="1055" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Mask PAD · softmax</text><text x="1055" y="305" text-anchor="middle" font-size="18" fill="#4A5160">weights A [B,1,w]</text></g><g data-stage="message" data-active="false" opacity="0.45"><rect x="1240" y="230" width="230" height="86" rx="9" fill="#D9F2EF" stroke="#0F766E" stroke-width="2"/><text x="1355" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">A @ V</text><text x="1355" y="305" text-anchor="middle" font-size="18" fill="#4A5160">message [B,1,dᵥ]</text></g><g data-stage="projection" data-active="true" opacity="1"><rect x="1240" y="395" width="230" height="86" rx="9" fill="#DDF3E4" stroke="#147737" stroke-width="4"/><text x="1355" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Output map Wₒ</text><text x="1355" y="470" text-anchor="middle" font-size="18" fill="#4A5160">update [B,1,d]</text></g><g data-stage="residual" data-active="true" opacity="1"><rect x="940" y="395" width="230" height="86" rx="9" fill="#DDF3E4" stroke="#147737" stroke-width="4"/><text x="1055" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Add original</text><text x="1055" y="449" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">final row</text><text x="1055" y="470" text-anchor="middle" font-size="18" fill="#4A5160">e′ = e + update</text></g><g data-stage="readout" data-active="true" opacity="1"><rect x="640" y="395" width="230" height="86" rx="9" fill="#DDF3E4" stroke="#147737" stroke-width="4"/><text x="755" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Final</text><text x="755" y="449" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">updated vector</text><text x="755" y="470" text-anchor="middle" font-size="18" fill="#4A5160">[B,d]</text></g><g data-stage="hidden" data-active="false" opacity="0.45"><rect x="340" y="395" width="230" height="86" rx="9" fill="#D9F2EF" stroke="#0F766E" stroke-width="2"/><text x="455" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Affine + ReLU</text><text x="455" y="470" text-anchor="middle" font-size="18" fill="#4A5160">hidden [B,h]</text></g><g data-stage="logits" data-active="false" opacity="0.45"><rect x="40" y="395" width="230" height="86" rx="9" fill="#EEF0F4" stroke="#4A5160" stroke-width="2"/><text x="155" y="424" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Vocabulary affine</text><text x="155" y="470" text-anchor="middle" font-size="18" fill="#4A5160">logits z [B,C]</text></g><g data-stage="loss" data-active="false" opacity="0.45"><rect x="40" y="565" width="230" height="86" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="2"/><text x="155" y="594" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Cross-entropy(z, y)</text><text x="155" y="640" text-anchor="middle" font-size="18" fill="#4A5160">one target per window</text></g><g data-stage="backward" data-active="false" opacity="0.45"><rect x="440" y="565" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="555" y="594" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">loss.backward()</text><text x="555" y="640" text-anchor="middle" font-size="18" fill="#4A5160">gradients for θ</text></g><g data-stage="optimizer" data-active="false" opacity="0.45"><rect x="840" y="565" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="955" y="594" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">optimizer.step()</text><text x="955" y="640" text-anchor="middle" font-size="18" fill="#4A5160">update learned θ</text></g><g data-stage="parameters" data-active="false" opacity="0.45"><rect x="1240" y="565" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="1355" y="594" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Next training batch</text><text x="1355" y="640" text-anchor="middle" font-size="18" fill="#4A5160">reuse updated θ</text></g><text x="760" y="685" text-anchor="middle" font-size="22" fill="#4A5160">The next batch repeats the forward pass with updated parameters in every learned layer.</text></svg>