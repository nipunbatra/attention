<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Padding must receive zero attention weight" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Padding must receive zero attention weight</title><rect x="20" y="15" width="1120" height="195" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Example 0</text><text x="312" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">PAD</text><text x="522" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">BOS</text><text x="732" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">lily</text><text x="942" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">found</text><path d="M20 80 L1140 80" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="124.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Before mask</text><text x="312" y="124.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">0.042</text><text x="522" y="124.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">0.351</text><text x="732" y="124.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">-0.223</text><text x="942" y="124.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">-0.150</text><path d="M20 145 L1140 145" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="189.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">After mask</text><text x="312" y="189.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">−∞</text><text x="522" y="189.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">0.351</text><text x="732" y="189.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">-0.223</text><text x="942" y="189.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">-0.150</text><text x="25" y="280" fill="#BE123C" font-size="30" font-weight="500" text-anchor="start">exp(−∞) = 0, so the padded source contributes zero weight.</text></svg>