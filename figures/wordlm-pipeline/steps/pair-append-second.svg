<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="The second pair becomes row 1 in both lists" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>The second pair becomes row 1 in both lists</title><text x="25" y="42" fill="#245EDB" font-size="29" font-weight="600" text-anchor="start">contexts: a list of input lists</text><text x="735" y="42" fill="#BE123C" font-size="29" font-weight="600" text-anchor="start">targets: a list of IDs</text><text x="25" y="100" fill="#245EDB" font-size="31" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace">[</text><text x="735" y="100" fill="#BE123C" font-size="31" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace">[8, 7]</text><text x="60" y="148" fill="#245EDB" font-size="31" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace">[0, 0, 0, 1],</text><text x="460" y="148" fill="#4A5160" font-size="26" font-weight="500" text-anchor="start">row 0</text><text x="735" y="148" fill="#BE123C" font-size="27" font-weight="500" text-anchor="start">targets[0] = 8 (lily)</text><text x="60" y="199" fill="#245EDB" font-size="31" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace">[0, 0, 1, 8]</text><text x="460" y="199" fill="#4A5160" font-size="26" font-weight="500" text-anchor="start">row 1</text><text x="735" y="199" fill="#BE123C" font-size="27" font-weight="500" text-anchor="start">targets[1] = 7 (found)</text><text x="25" y="250" fill="#245EDB" font-size="31" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace">]</text><text x="25" y="296" fill="#14171F" font-size="27" font-weight="500" text-anchor="start">2 input rows, 2 targets. Same index means the same example.</text></svg>