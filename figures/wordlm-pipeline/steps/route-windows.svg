<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 530" role="img" aria-label="mlp training pipeline" data-focus="windows" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><defs><marker id="pipeline-route-windows-data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#245EDB"/></marker><marker id="pipeline-route-windows-q-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8B2CDE"/></marker><marker id="pipeline-route-windows-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#BE123C"/></marker><marker id="pipeline-route-windows-v-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0F766E"/></marker><marker id="pipeline-route-windows-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#147737"/></marker><marker id="pipeline-route-windows-neutral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5160"/></marker></defs><g opacity="0.35" data-edge="stories:split"><path d="M270 73 L340 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="0.35" data-edge="split:tokenize"><path d="M570 73 L640 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/><text x="605" y="63" text-anchor="middle" font-size="21" fill="#4A5160">train</text></g><g opacity="0.35" data-edge="tokenize:ids"><path d="M870 73 L940 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="1" data-edge="ids:windows"><path d="M1170 73 L1240 73" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="1" data-edge="windows:embedding"><path d="M1355 116 L1355 165 L155 165 L155 230" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="0.35" data-edge="embedding:flatten"><path d="M270 273 L440 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="0.35" data-edge="flatten:hidden"><path d="M670 273 L840 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="0.35" data-edge="hidden:logits"><path d="M1070 273 L1240 273" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="0.35" data-edge="logits:loss"><path d="M1355 316 L1355 400" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="1" data-edge="windows:loss"><path d="M1470 73 L1490 73 L1490 443 L1470 443" fill="none" stroke="#BE123C" stroke-width="2.5" marker-end="url(#pipeline-route-windows-a-arrow)" stroke-dasharray="7 5"/><text x="1440" y="365" text-anchor="middle" font-size="21" fill="#BE123C">y [B]</text></g><g opacity="0.35" data-edge="loss:backward"><path d="M1240 443 L1070 443" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="0.35" data-edge="backward:optimizer"><path d="M840 443 L670 443" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g opacity="0.35" data-edge="optimizer:parameters"><path d="M440 443 L270 443" fill="none" stroke="#4A5160" stroke-width="2.5" marker-end="url(#pipeline-route-windows-neutral-arrow)"/></g><g data-stage="stories" data-active="false" opacity="0.45"><rect x="40" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="155" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">TinyStories</text><text x="155" y="105" text-anchor="middle" font-size="18" fill="#4A5160">complete documents</text></g><g data-stage="split" data-active="false" opacity="0.45"><rect x="340" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="455" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Split stories</text><text x="455" y="105" text-anchor="middle" font-size="18" fill="#4A5160">train / validation / test</text></g><g data-stage="tokenize" data-active="false" opacity="0.45"><rect x="640" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="755" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Tokenize +</text><text x="755" y="84" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">assign IDs</text><text x="755" y="105" text-anchor="middle" font-size="18" fill="#4A5160">train-only vocabulary</text></g><g data-stage="ids" data-active="false" opacity="0.45"><rect x="940" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="1055" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">IDs + boundaries</text><text x="1055" y="105" text-anchor="middle" font-size="18" fill="#4A5160">&lt;BOS&gt; … &lt;EOS&gt;</text></g><g data-stage="windows" data-active="true" opacity="1"><rect x="1240" y="30" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="4"/><text x="1355" y="59" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Context and target</text><text x="1355" y="105" text-anchor="middle" font-size="18" fill="#4A5160">X [B,w]   y [B]</text></g><g data-stage="embedding" data-active="false" opacity="0.45"><rect x="40" y="230" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="155" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Token lookup</text><text x="155" y="305" text-anchor="middle" font-size="18" fill="#4A5160">E [B,w,d]</text></g><g data-stage="flatten" data-active="false" opacity="0.45"><rect x="440" y="230" width="230" height="86" rx="9" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="555" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Join ordered rows</text><text x="555" y="305" text-anchor="middle" font-size="18" fill="#4A5160">flatten [B,w·d]</text></g><g data-stage="hidden" data-active="false" opacity="0.45"><rect x="840" y="230" width="230" height="86" rx="9" fill="#D9F2EF" stroke="#0F766E" stroke-width="2"/><text x="955" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Affine + ReLU</text><text x="955" y="305" text-anchor="middle" font-size="18" fill="#4A5160">hidden [B,h]</text></g><g data-stage="logits" data-active="false" opacity="0.45"><rect x="1240" y="230" width="230" height="86" rx="9" fill="#EEF0F4" stroke="#4A5160" stroke-width="2"/><text x="1355" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Vocabulary affine</text><text x="1355" y="305" text-anchor="middle" font-size="18" fill="#4A5160">logits z [B,C]</text></g><g data-stage="loss" data-active="false" opacity="0.45"><rect x="1240" y="400" width="230" height="86" rx="9" fill="#FDE2E7" stroke="#BE123C" stroke-width="2"/><text x="1355" y="429" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Cross-entropy(z, y)</text><text x="1355" y="475" text-anchor="middle" font-size="18" fill="#4A5160">one target per window</text></g><g data-stage="backward" data-active="false" opacity="0.45"><rect x="840" y="400" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="955" y="429" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">loss.backward()</text><text x="955" y="475" text-anchor="middle" font-size="18" fill="#4A5160">gradients for θ</text></g><g data-stage="optimizer" data-active="false" opacity="0.45"><rect x="440" y="400" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="555" y="429" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">optimizer.step()</text><text x="555" y="475" text-anchor="middle" font-size="18" fill="#4A5160">update learned θ</text></g><g data-stage="parameters" data-active="false" opacity="0.45"><rect x="40" y="400" width="230" height="86" rx="9" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2"/><text x="155" y="429" text-anchor="middle" font-size="24" font-weight="600" fill="#14171F">Next training batch</text><text x="155" y="475" text-anchor="middle" font-size="18" fill="#4A5160">reuse updated θ</text></g><text x="760" y="520" text-anchor="middle" font-size="22" fill="#4A5160">The next batch repeats the forward pass with updated parameters in every learned layer.</text></svg>