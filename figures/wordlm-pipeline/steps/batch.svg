<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="A real batch with B=2" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>A real batch with B=2</title><rect x="20" y="15" width="1120" height="195" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Data row</text><text x="157" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Batch row</text><text x="282" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">X: input IDs</text><text x="532" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Input tokens</text><text x="872" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">y: ID</text><text x="972" y="59.849999999999994" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Target token</text><path d="M20 80 L1140 80" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="124.85" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">2</text><text x="157" y="124.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">0</text><text x="282" y="124.85" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">[0, 1, 8, 7]</text><text x="532" y="124.85" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">&lt;PAD&gt; &lt;BOS&gt; lily found</text><text x="872" y="124.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">5</text><text x="972" y="124.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">a</text><path d="M20 145 L1140 145" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="189.85" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">3</text><text x="157" y="189.85" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">1</text><text x="282" y="189.85" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">[1, 8, 7, 5]</text><text x="532" y="189.85" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">&lt;BOS&gt; lily found a</text><text x="872" y="189.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">9</text><text x="972" y="189.85" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">red</text><text x="25" y="250" fill="#4A5160" font-size="27" font-weight="500" text-anchor="start">Dataset rows 2 and 3 become batch rows 0 and 1.</text><text x="25" y="300" fill="#4A5160" font-size="27" font-weight="500" text-anchor="start">PAD fills an empty slot. BOS marks the start of the story.</text></svg>