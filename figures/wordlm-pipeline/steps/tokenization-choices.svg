<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-label="Words, characters or pieces of words" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Words, characters or pieces of words</title><rect x="20" y="15" width="1120" height="232" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="55.019999999999996" fill="#4A5160" font-size="25" font-weight="600" text-anchor="start">Choice</text><text x="342" y="55.019999999999996" fill="#4A5160" font-size="25" font-weight="600" text-anchor="start">Tokens for redder!</text><text x="962" y="55.019999999999996" fill="#4A5160" font-size="25" font-weight="600" text-anchor="start">Count</text><path d="M20 73 L1140 73" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="113.02" fill="#14171F" font-size="26" font-weight="500" text-anchor="start">Word + punctuation</text><text x="342" y="113.02" fill="#245EDB" font-size="26" font-weight="500" text-anchor="start">[redder] [!]</text><text x="962" y="113.02" fill="#0F766E" font-size="26" font-weight="500" text-anchor="start">2</text><path d="M20 131 L1140 131" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="171.01999999999998" fill="#14171F" font-size="26" font-weight="500" text-anchor="start">Character</text><text x="342" y="171.01999999999998" fill="#245EDB" font-size="26" font-weight="500" text-anchor="start">[r] [e] [d] [d] [e] [r] [!]</text><text x="962" y="171.01999999999998" fill="#0F766E" font-size="26" font-weight="500" text-anchor="start">7</text><path d="M20 189 L1140 189" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="229.01999999999998" fill="#14171F" font-size="26" font-weight="500" text-anchor="start">Subword (illustrative)</text><text x="342" y="229.01999999999998" fill="#245EDB" font-size="26" font-weight="500" text-anchor="start">[red] [der] [!]</text><text x="962" y="229.01999999999998" fill="#0F766E" font-size="26" font-weight="500" text-anchor="start">3</text><text x="25" y="287" fill="#14171F" font-size="25" font-weight="500" text-anchor="start">Context length counts tokens. The same width can cover different amounts of text.</text><text x="25" y="332" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">The subword split is illustrative. Actual splits depend on the tokenizer.</text></svg>