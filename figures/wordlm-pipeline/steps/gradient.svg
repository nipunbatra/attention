<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Backward computes a direction for every parameter" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Backward computes a direction for every parameter</title><text x="25" y="55" fill="#8B2CDE" font-size="32" font-weight="600" text-anchor="start">Weight: hidden unit 0 → red logit</text><text x="25" y="125" fill="#14171F" font-size="29" font-weight="500" text-anchor="start">For each example: (p(red) − target-is-red) × hidden[0]</text><text x="25" y="198" fill="#14171F" font-size="29" font-weight="500" text-anchor="start">Average the two contributions because B = 2.</text><text x="25" y="274" fill="#8B2CDE" font-size="35" font-weight="600" text-anchor="start">Autograd = manual gradient = 0.011</text></svg>