<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Four special tokens have different jobs" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Four special tokens have different jobs</title><rect x="20" y="15" width="1120" height="275" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="52.949999999999996" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">ID</text><text x="132" y="52.949999999999996" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Token</text><text x="302" y="52.949999999999996" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Role</text><path d="M20 70 L1140 70" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="107.94999999999999" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">0</text><text x="132" y="107.94999999999999" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">PAD</text><text x="302" y="107.94999999999999" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Fill unused input slots</text><path d="M20 125 L1140 125" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="162.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">1</text><text x="132" y="162.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">BOS</text><text x="302" y="162.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">First context token of a story</text><path d="M20 180 L1140 180" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="217.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">2</text><text x="132" y="217.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">EOS</text><text x="302" y="217.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Predict that the story ends</text><path d="M20 235 L1140 235" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="272.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">3</text><text x="132" y="272.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">UNK</text><text x="302" y="272.95" fill="#14171F" font-size="24" font-weight="500" text-anchor="start">Represent a missing vocabulary item</text></svg>