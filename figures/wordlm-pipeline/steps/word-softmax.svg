<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Ten logits become ten next-token probabilities" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Ten logits become ten next-token probabilities</title><rect x="20" y="15" width="530" height="240" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="42.599999999999994" fill="#4A5160" font-size="21" font-weight="600" text-anchor="start">Word</text><text x="192" y="42.599999999999994" fill="#4A5160" font-size="21" font-weight="600" text-anchor="start">Probability</text><text x="377" y="42.599999999999994" fill="#4A5160" font-size="21" font-weight="600" text-anchor="start">exp(z − max)</text><path d="M20 55 L550 55" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="82.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">&lt;PAD&gt;</text><text x="192" y="82.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">6.28%</text><text x="377" y="82.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.435</text><path d="M20 95 L550 95" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="122.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">&lt;BOS&gt;</text><text x="192" y="122.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">10.75%</text><text x="377" y="122.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.745</text><path d="M20 135 L550 135" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="162.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">&lt;EOS&gt;</text><text x="192" y="162.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">8.04%</text><text x="377" y="162.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.556</text><path d="M20 175 L550 175" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="202.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">&lt;UNK&gt;</text><text x="192" y="202.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">11.59%</text><text x="377" y="202.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.803</text><path d="M20 215 L550 215" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="242.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">.</text><text x="192" y="242.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">10.69%</text><text x="377" y="242.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.740</text><rect x="590" y="15" width="530" height="240" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="602" y="42.599999999999994" fill="#4A5160" font-size="21" font-weight="600" text-anchor="start">Word</text><text x="762" y="42.599999999999994" fill="#4A5160" font-size="21" font-weight="600" text-anchor="start">Probability</text><text x="947" y="42.599999999999994" fill="#4A5160" font-size="21" font-weight="600" text-anchor="start">exp(z − max)</text><path d="M590 55 L1120 55" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="602" y="82.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">a</text><text x="762" y="82.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">6.15%</text><text x="947" y="82.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.425</text><path d="M590 95 L1120 95" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="602" y="122.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">ball</text><text x="762" y="122.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">8.86%</text><text x="947" y="122.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.613</text><path d="M590 135 L1120 135" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="602" y="162.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">found</text><text x="762" y="162.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">12.38%</text><text x="947" y="162.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.857</text><path d="M590 175 L1120 175" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="602" y="202.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">lily</text><text x="762" y="202.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">10.82%</text><text x="947" y="202.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">0.749</text><path d="M590 215 L1120 215" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="602" y="242.6" fill="#14171F" font-size="22" font-weight="500" text-anchor="start">red</text><text x="762" y="242.6" fill="#147737" font-size="22" font-weight="500" text-anchor="start">14.44%</text><text x="947" y="242.6" fill="#4A5160" font-size="22" font-weight="500" text-anchor="start">1.000</text><text x="25" y="297" fill="#147737" font-size="26" font-weight="600" text-anchor="start">For each word: exp(z − max) ÷ 6.924 = probability.</text></svg>