<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Flatten the context axis, keep the batch axis" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Flatten the context axis, keep the batch axis</title><text x="25" y="40" fill="#245EDB" font-size="28" font-weight="600" text-anchor="start">Example 1: concatenate in slot order</text><text x="25" y="105" fill="#245EDB" font-size="28" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace"> &lt;BOS&gt;  [ -0.182, -1.497, 0.142, -0.524 ]</text><text x="25" y="154" fill="#245EDB" font-size="28" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace">  lily  [ -0.430, 1.780, 0.057, -0.642 ]</text><text x="25" y="203" fill="#245EDB" font-size="28" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace"> found  [ -0.687, -0.800, -1.369, -0.325 ]</text><text x="25" y="252" fill="#245EDB" font-size="28" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,monospace">     a  [ -0.155, -1.096, 1.367, 0.689 ]</text><text x="735" y="135" fill="#14171F" font-size="30" font-weight="500" text-anchor="start">One row:</text><text x="735" y="190" fill="#245EDB" font-size="33" font-weight="600" text-anchor="start">4 × 4 = 16 inputs</text><text x="735" y="250" fill="#4A5160" font-size="26" font-weight="500" text-anchor="start">Batch shape [2, 16]</text></svg>