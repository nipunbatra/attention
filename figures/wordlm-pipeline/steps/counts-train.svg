<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Training examples across the corpus" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Training examples across the corpus</title><text x="25" y="65" fill="#4A5160" font-size="28" font-weight="600" text-anchor="start">Ordinary tokens</text><text x="25" y="155" fill="#245EDB" font-size="52" font-weight="600" text-anchor="start">964,338</text><text x="420" y="65" fill="#4A5160" font-size="28" font-weight="600" text-anchor="start">One EOS per story</text><text x="420" y="155" fill="#245EDB" font-size="52" font-weight="600" text-anchor="start">4,822</text><text x="820" y="65" fill="#4A5160" font-size="28" font-weight="600" text-anchor="start">Training examples</text><text x="820" y="155" fill="#0F766E" font-size="52" font-weight="600" text-anchor="start">969,160</text><text x="325" y="155" fill="#14171F" font-size="48" font-weight="500" text-anchor="start">+</text><text x="720" y="155" fill="#14171F" font-size="48" font-weight="500" text-anchor="start">=</text><text x="25" y="265" fill="#14171F" font-size="30" font-weight="500" text-anchor="start">Every ordinary token and each story ending supplies one target.</text></svg>