<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-label="Later prefixes drop their oldest tokens" style="font-family:Avenir Next,Segoe UI,sans-serif;background:#F7F8FA"><title>Later prefixes drop their oldest tokens</title><rect x="20" y="15" width="1120" height="212" rx="6" fill="#fff" stroke="#D9DFE9"/><text x="32" y="51.57" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Example</text><text x="202" y="51.57" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Input: exactly four slots</text><text x="932" y="51.57" fill="#4A5160" font-size="23" font-weight="600" text-anchor="start">Next target</text><path d="M20 68 L1140 68" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="104.57" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">4</text><text x="202" y="104.57" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">lily found a red</text><text x="932" y="104.57" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">ball</text><path d="M20 121 L1140 121" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="157.57" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">5</text><text x="202" y="157.57" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">found a red ball</text><text x="932" y="157.57" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">.</text><path d="M20 174 L1140 174" fill="none" stroke="#D9DFE9" stroke-width="2"/><text x="32" y="210.57" fill="#4A5160" font-size="24" font-weight="500" text-anchor="start">6</text><text x="202" y="210.57" fill="#245EDB" font-size="24" font-weight="500" text-anchor="start">a red ball .</text><text x="932" y="210.57" fill="#BE123C" font-size="24" font-weight="500" text-anchor="start">&lt;EOS&gt;</text><text x="25" y="285" fill="#14171F" font-size="27" font-weight="500" text-anchor="start">Every ordinary token plus EOS is predicted once: N = 6 + 1 = 7.</text></svg>