<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Turn all 1,000 scores into class probabilities" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Turn all 1,000 scores into class probabilities</title><text x="580" y="34" font-size="29" fill="var(--ink)" text-anchor="middle" font-weight="500">The alternatives are class labels: normalize over all 1,000.</text><text x="206" y="88" font-size="27" fill="var(--c-e)" text-anchor="middle" font-weight="500">Class scores (logits)</text><text x="968" y="88" font-size="27" fill="var(--vision)" text-anchor="middle" font-weight="500">Class probabilities</text><path d="M309 109 L301 109" fill="none" stroke="var(--c-e)" stroke-width="2" stroke-dasharray=""/><path d="M301 109 L301 366" fill="none" stroke="var(--c-e)" stroke-width="2" stroke-dasharray=""/><path d="M301 366 L309 366" fill="none" stroke="var(--c-e)" stroke-width="2" stroke-dasharray=""/><path d="M409 109 L417 109" fill="none" stroke="var(--c-e)" stroke-width="2" stroke-dasharray=""/><path d="M417 109 L417 366" fill="none" stroke="var(--c-e)" stroke-width="2" stroke-dasharray=""/><path d="M417 366 L409 366" fill="none" stroke="var(--c-e)" stroke-width="2" stroke-dasharray=""/><text x="35" y="152" font-size="25" fill="var(--ink)" text-anchor="start" font-weight="500">Newfoundland</text><text x="403" y="152" font-size="26" fill="var(--c-e)" text-anchor="end" font-weight="500">15.476</text><text x="1090" y="152" font-size="27" fill="var(--vision)" text-anchor="end" font-weight="500">95.73%</text><rect x="822" y="132" width="162.73525471098225" height="22" rx="0" fill="var(--transparent)" stroke="var(--vision)" stroke-width="2"/><text x="35" y="217" font-size="25" fill="var(--ink)" text-anchor="start" font-weight="500">Tibetan mastiff</text><text x="403" y="217" font-size="26" fill="var(--c-e)" text-anchor="end" font-weight="500">11.401</text><text x="1090" y="217" font-size="27" fill="var(--vision)" text-anchor="end" font-weight="500">1.63%</text><rect x="822" y="197" width="2.7637275187558363" height="22" rx="0" fill="var(--transparent)" stroke="var(--vision)" stroke-width="2"/><text x="35" y="282" font-size="25" fill="var(--ink)" text-anchor="start" font-weight="500">briard</text><text x="403" y="282" font-size="26" fill="var(--c-e)" text-anchor="end" font-weight="500">10.521</text><text x="1090" y="282" font-size="27" fill="var(--vision)" text-anchor="end" font-weight="500">0.67%</text><rect x="822" y="262" width="2" height="22" rx="0" fill="var(--transparent)" stroke="var(--vision)" stroke-width="2"/><text x="35" y="352" font-size="24" fill="var(--ink-2)" text-anchor="start" font-weight="500">997 more classes</text><text x="355" y="352" font-size="27" fill="var(--c-e)" text-anchor="middle" font-weight="500">⋮</text><text x="968" y="352" font-size="23" fill="var(--ink-2)" text-anchor="middle" font-weight="500">1.97% across 997 others</text><path d="M424 220 L460 220" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M449.8683290659683 224.28360176539516 L460 220" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M460 220 L449.8683290659683 215.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="474" y="178" width="277" height="84" rx="6" fill="var(--transparent)" stroke="var(--vision)" stroke-width="2"/><text x="612.5" y="212.5" font-size="27" fill="var(--vision)" text-anchor="middle" font-weight="500">softmax</text><text x="612.5" y="243.5" font-size="27" fill="var(--vision)" text-anchor="middle" font-weight="500">all 1,000 scores</text><path d="M763 220 L802 220" fill="none" stroke="var(--vision)" stroke-width="2.5" stroke-dasharray=""/><path d="M791.8683290659683 224.28360176539516 L802 220" fill="none" stroke="var(--vision)" stroke-width="2.5" stroke-dasharray=""/><path d="M802 220 L791.8683290659683 215.71639823460484" fill="none" stroke="var(--vision)" stroke-width="2.5" stroke-dasharray=""/><text x="580" y="405" font-size="26" fill="var(--vision)" text-anchor="middle" font-weight="500">p(Newfoundland) = exp(15.476) / sum of exp(all 1,000 scores)</text><text x="580" y="439" font-size="27" fill="var(--vision)" text-anchor="middle" font-weight="500">≈ 0.9573     ·     All 1,000 probabilities sum to 1.</text></svg>