<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Your turn: are these two shuffles equivalent?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Your turn: are these two shuffles equivalent?</title><text x="30" y="70" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">1. Shuffle patch contents; keep locations fixed.</text><text x="30" y="155" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">2. Shuffle complete (content + position) rows.</text><g data-build="1"><text x="30" y="260" font-size="33" fill="var(--c-a)" text-anchor="start" font-weight="500">1 can change the image prediction.</text></g><g data-build="2"><text x="30" y="345" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">2 preserves CLS under shared self-attention.</text></g><g data-build="3"><text x="30" y="421" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Which shuffle changes the arrangement of image content?</text></g></svg>