<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Your turn: are these two shuffles equivalent?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Your turn: are these two shuffles equivalent?</title><text x="30" y="70" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">1. Shuffle patch contents; keep locations fixed.</text><text x="30" y="155" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">2. Shuffle complete (content + position) rows.</text><g data-build="1"><text x="30" y="260" font-size="33" fill="var(--c-a)" text-anchor="start" font-weight="500">1 can change the image prediction.</text></g><g data-build="2"><text x="30" y="345" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">2 preserves CLS under shared self-attention.</text></g><g data-build="3"><text x="30" y="421" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Which experiment did our position control perform?</text></g></svg>