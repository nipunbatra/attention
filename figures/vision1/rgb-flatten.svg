<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Flatten one channel at a time: R, then G, then B" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Flatten one channel at a time: R, then G, then B</title><rect x="35" y="105" width="90" height="90" fill="rgb(255,0,0)" stroke="var(--line)" stroke-width="2"/><text x="80.0" y="162.6" font-size="28" fill="var(--card)" text-anchor="middle" font-weight="500">A</text><rect x="125" y="105" width="90" height="90" fill="rgb(0,255,0)" stroke="var(--line)" stroke-width="2"/><text x="170.0" y="162.6" font-size="28" fill="var(--ink)" text-anchor="middle" font-weight="500">B</text><rect x="35" y="195" width="90" height="90" fill="rgb(0,0,255)" stroke="var(--line)" stroke-width="2"/><text x="80.0" y="252.6" font-size="28" fill="var(--card)" text-anchor="middle" font-weight="500">C</text><rect x="125" y="195" width="90" height="90" fill="rgb(255,255,255)" stroke="var(--line)" stroke-width="2"/><text x="170.0" y="252.6" font-size="28" fill="var(--ink)" text-anchor="middle" font-weight="500">D</text><text x="125" y="350" font-size="28" fill="var(--ink)" text-anchor="middle" font-weight="500">one RGB patch</text><text x="405" y="105" font-size="29" fill="var(--ink-2)" text-anchor="middle" font-weight="500">R channel</text><text x="405" y="185" font-size="33" fill="var(--c-e)" text-anchor="middle" font-weight="500">1, 0, 0, 1</text><path d="M295 220 L515 220" fill="none" stroke="var(--c-e)" stroke-width="2" stroke-dasharray=""/><text x="405" y="275" font-size="25" fill="var(--ink-2)" text-anchor="middle" f