<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="The class loss reaches the final CLS features" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>The class loss reaches the final CLS features</title><text x="35" y="45" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">First reverse the class head: 192 features → 1,000 scores.</text><rect x="35" y="112" width="245" height="76" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="157.5" y="143.0" font-size="24" fill="var(--c-q)" text-anchor="middle" font-weight="500">Final CLS</text><text x="157.5" y="173.0" font-size="24" fill="var(--c-q)" text-anchor="middle" font-weight="500">192 features</text><path d="M286 150 L360 150" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M349.8683290659683 154.28360176539516 L360 150" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M360 150 L349.8683290659683 145.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="375" y="112" width="270" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="510.0" y="143.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Linear(192, 1000)</text><text x="510.0" y="173.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">weights + biases</text><path d="M651 150 L715 150" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M704.8683290659683 154.28360176539516 L715 150" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M715 150 L704.8683290659683 145.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="730" y="112" width="395" height="76" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="927.5" y="143.0" font-size="24" fill="var(--c-a)" text-anchor="middle" font-weight="500">Class scores → label loss</text><text x="927.5" y="173.0" font-size="24" fill="var(--c-a)" text-anchor="middle" font-weight="500">1,000 → 1</text><g data-build="1"><path d="M890 269 L535 269" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M545.1316709340317 264.71639823460487 L535 269" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M535 269 L545.1316709340317 273.28360176539513" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M515 269 L158 269" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M168.13167093403175 264.71639823460487 L158 269" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M158 269 L168.13167093403175 273.28360176539513" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/></g><g data-build="1"><text x="35" y="325" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">Each score gets gradient: p(class) − 1[class is the label]</text><text x="35" y="383" font-size="28" fill="var(--c-a)" text-anchor="start" font-weight="500">Newfoundland: 0.9573 − 1 = -0.0427 → increase its score</text></g></svg>