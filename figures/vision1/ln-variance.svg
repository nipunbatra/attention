<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How spread out is the centered row?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How spread out is the centered row?</title><text x="35" y="95" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">squared differences</text><text x="440" y="95" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">[0.25, 0.25, 0.25, 0.25]</text><g data-build="1"><text x="35" y="200" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">variance</text><text x="440" y="200" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">(0.25 + 0.25 + 0.25 + 0.25)/4</text></g><g data-build="2"><text x="35" y="305" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">standard deviation</text><text x="440" y="305" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">√0.25 = 0.5</text></g></svg>