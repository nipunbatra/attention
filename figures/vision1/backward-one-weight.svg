<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Use the gradient to change one query weight" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Use the gradient to change one query weight</title><text x="35" y="50" font-size="28" fill="var(--ink)" text-anchor="start" font-weight="500">Change one real worksheet parameter; keep all other weights fixed.</text><rect x="35" y="105" width="340" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-q)" stroke-width="2"/><text x="205.0" y="135.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">Head 1 W_Q[4th row, 1st col]</text><text x="205.0" y="165.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">starting value = 1</text><g data-build="1"><text x="445" y="138" font-size="33" fill="var(--c-a)" text-anchor="start" font-weight="500">gradient = 0.284</text><text x="445" y="199" font-size="30" fill="var(--ink-2)" text-anchor="start" font-weight="500">learning rate = 0.1</text></g><g data-build="2"><text x="35" y="286" font-size="34" fill="var(--c-q)" text-anchor="start" font-weight="500">new weight = 1 − 0.1 × 0.284 = 0.972</text></g><g data-build="3"><text x="35" y="377" font-size="33" fill="var(--c-a)" text-anchor="start" font-weight="500">Run forward again: loss 0.154 → 0.146</text></g></svg>