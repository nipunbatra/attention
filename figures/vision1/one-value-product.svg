<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Can an empty patch still send something?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Can an empty patch still send something?</title><text x="35" y="75" font-size="34" fill="var(--c-a)" text-anchor="start" font-weight="500">P3 weight = 0.229</text><text x="35" y="165" font-size="34" fill="var(--c-v)" text-anchor="start" font-weight="500">P3 value = [0,1]</text><g data-build="1"><text x="35" y="285" font-size="38" fill="var(--c-v)" text-anchor="start" font-weight="500">0.229 × [0,1] = [0,0.229]</text></g><g data-build="2"><text x="35" y="405" font-size="31" fill="var(--ink-2)" text-anchor="start" font-weight="500">no ink contribution; a row contribution</text></g></svg>