<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What does a finer grid cost?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>What does a finer grid cost?</title><rect x="45" y="99" width="460" height="180" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="275.0" y="167.0" font-size="32" fill="var(--vision)" text-anchor="middle" font-weight="500">16 × 16 patches</text><text x="275.0" y="197.0" font-size="32" fill="var(--vision)" text-anchor="middle" font-weight="500">196 patch tokens</text><text x="275.0" y="227.0" font-size="32" fill="var(--vision)" text-anchor="middle" font-weight="500">197 tokens with CLS</text><path d="M530 187 L621 187" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M610.8683290659683 191.28360176539516 L621 187" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M621 187 L610.8683290659683 182.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="650" y="99" width="460" height="180" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="880.0" y="167.0" font-size="32" fill="var(--vision)" text-anchor="middle" font-weight="500">8 × 8 patches</text><text x="880.0" y="197.0" font-size="32" fill="var(--vision)" text-anchor="middle" font-weight="500">784 patch tokens</text><text x="880.0" y="227.0" font-size="32" fill="var(--vision)" text-anchor="middle" font-weight="500">785 tokens with CLS</text><text x="580" y="349" font-size="38" fill="var(--mixing)" text-