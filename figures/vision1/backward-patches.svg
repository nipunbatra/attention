00">dW_patch = Σᵢ xᵢᵀ dEᵢ</text></g><g data-build="2"><text x="35" y="430" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">CLS gets dE₀. Each position gets its row gradient. Pixels are fixed input data.</text></g></svg>