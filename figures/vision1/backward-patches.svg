<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Every patch contributes to the same projection weights" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Every patch contributes to the same projection weights</title><text x="35" y="45" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">Input row for a patch: eᵢ = xᵢW_patch + b_patch + pᵢ</text><rect x="35" y="102" width="240" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-a)" stroke-width="2"/><text x="155.0" y="132.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">patch P1</text><text x="155.0" y="162.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">row gradient dEᵢ</text><path d="M155 181 L580 278" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M569.1691750857897 279.9217782592485 L580 278" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M580 278 L571.075492274875 271.56935758542085" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><rect x="315" y="102" width="240" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-a)" stroke-width="2"/><text x="435.0" y="132.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">patch P2</text><text x="435.0" y="162.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">row gradient dEᵢ</text><path d="M435 181 L580 278" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M569.1971075999567 275.92695