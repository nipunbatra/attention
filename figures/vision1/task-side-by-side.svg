<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What changed, and what stayed the same?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>What changed, and what stayed the same?</title><text x="30" y="45" font-size="25" fill="var(--ink)" text-anchor="start" font-weight="500"></text><text x="380" y="55" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">Text generation</text><text x="800" y="55" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">Image classification</text><text x="30" y="140" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">given</text><text x="380" y="140" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">prefix tokens</text><text x="800" y="140" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">whole image</text><g data-build="1"><text x="30" y="227" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">predict</text><text x="380" y="227" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">next token</text><text x="800" y="227" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">image label</text></g><g data-build="2"><text x="30" y="314" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">use to predict</text><text x="380" y="314" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">last available row</text><text x="800" y="314" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">one image summary</text></g><g data-build="3"><text x="30" y="401" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">loss</text><text x="380" y="401" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">−log p(next token)</text><text x="800" y="401" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">−log p(correct class)</text></g></svg>