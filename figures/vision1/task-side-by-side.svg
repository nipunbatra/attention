<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What changed, and what stayed the same?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>What changed, and what stayed the same?</title><text x="30" y="45" font-size="25" fill="var(--ink)" text-anchor="start" font-weight="500"></text><text x="380" y="55" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">Text generation</text><text x="800" y="55" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">Image classification</text><text x="30" y="140" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">given</text><text x="380" y="140" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">prefix tokens</text><text x="800" y="140" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">whole image</text><g data-build="1"><text x="30" y="227" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">predict</text><text x="380" y="227" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">next token</text><text x="800" y="227" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">image label</text></g><g data-build="2"><text x="30" y="314" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">use to predict</text><text x="380" y="314" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">last available row</text><text x="800" y="314" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">one image summary</text></g><g data-build="3"><text x="30" y="401" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">loss</text><text x="380" y="401" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">−log p(next token)</text><text x="800" y="401" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">−log p(correct class)</text></g></svg>