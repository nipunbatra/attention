<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Does this layer merely cut up the image?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Does this layer merely cut up the image?</title><text x="35" y="55" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">two filters → two coordinates per patch</text><text x="35" y="140" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">top-left</text><text x="400" y="140" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">[2, 0]</text><text x="35" y="210" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">top-right</text><text x="400" y="210" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">[0, 2]</text><text x="35" y="280" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">bottom-left</text><text x="400" y="280" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">[-2, 0]</text><text x="35" y="350" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">bottom-right</text><text x="400" y="350" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">[0, 0]</text><g data-build="1"><text x="700" y="145" font-size="29" fill="var(--c-k)" text-anchor="start" font-weight="500">2 × (4 weights + 1 bias)</text><text x="700" y="215" font-size="29" fill="var(--c-k)" text-anchor="start" font-weight="500">= 10 learned parameters</text></g><g data-build="2"><text x="700" y="315" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">[B,2,2,2] → [B,4,2]</text><text x="700" y="390" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">channels → row coordinates</text></g></svg>