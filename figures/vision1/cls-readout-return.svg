<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Why is CLS a common choice if pooling also works?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Why is CLS a common choice if pooling also works?</title><text x="35" y="32" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="650">1 · A familiar convention</text><rect x="35" y="59" width="285" height="52" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="177.5" y="93.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">BERT: classification token</text><path d="M328 85 L398 85" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M387.8683290659683 89.28360176539516 L398 85" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M398 85 L387.8683290659683 80.71639823460484" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><rect x="414" y="59" width="285" height="52" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="556.5" y="93.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">Original ViT adopts it</text><path d="M707 85 L777 85" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M766.8683290659683 89.28360176539516 L777 85" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M777 85 L766.8683290659683 80.71639823460484" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><rect x="793" y="59" width="332" height="52" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="959.0" y="93.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">Our checkpoint uses CLS</text><g data-build="1"><text x="35" y="164" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="650">2 · A dedicated summary, refined through the blocks</text><rect x="35" y="192" width="240" height="70" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="155.0" y="235.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Patch rows + CLS</text><path d="M286 227 L448 227" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M437.8683290659683 231.28360176539516 L448 227" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M448 227 L437.8683290659683 222.71639823460484" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><text x="368" y="211" font-size="22" fill="var(--c-v)" text-anchor="middle" font-weight="500">attention</text><rect x="461" y="192" width="240" height="70" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="581.0" y="235.0" font-size="25" fill="var(--c-q)" text-anchor="middle" font-weight="500">Updated CLS</text><path d="M712 227 L835 227" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M824.8683290659683 231.28360176539516 L835 227" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M835 227 L824.8683290659683 222.71639823460484" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><text x="773" y="211" font-size="20" fill="var(--ink-2)" text-anchor="middle" font-weight="500">later blocks</text><rect x="848" y="182" width="277" height="90" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="986.5" y="220.0" font-size="24" fill="var(--c-q)" text-anchor="middle" font-weight="500">Final CLS</text><text x="986.5" y="250.0" font-size="24" fill="var(--c-q)" text-anchor="middle" font-weight="500">→ class head</text><text x="35" y="308" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">Attention learns how to weight sources; the label loss trains the summary.</text></g><g data-build="2"><text x="35" y="364" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="650">3 · Both readouts deserve a fair comparison</text><text x="35" y="404" font-size="25" fill="var(--c-v)" text-anchor="start" font-weight="500">Original ViT found similar performance after tuning each readout’s learning rate.</text><text x="35" y="439" font-size="20" fill="var(--ink-2)" text-anchor="start" font-weight="500">ViT paper · §3.1 and Appendix D.3, Figure 9</text></g></svg>