<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Open the classifier: 192 features become 1,000 scores" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Open the classifier: 192 features become 1,000 scores</title><text x="580" y="34" font-size="29" fill="var(--ink)" text-anchor="middle" font-weight="500">This checkpoint predicts 1,000 ImageNet classes.</text><text x="210" y="83" font-size="26" fill="var(--c-q)" text-anchor="middle" font-weight="500">CLS features · 1 × 192</text><text x="870" y="83" font-size="26" fill="var(--c-e)" text-anchor="middle" font-weight="500">Class scores · 1 × 1,000</text><g opacity=".3"><path d="M249 144 L681 144" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/><path d="M249 144 L681 234" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/><path d="M249 144 L681 324" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/><path d="M249 234 L681 144" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/><path d="M249 234 L681 234" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/><path d="M249 234 L681 324" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/><path d="M249 344 L681 144" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/><path d="M249 344 L681 234" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/><path d="M249 344 L681 324" fill="none" stroke="var(--c-e)" stroke-width="1.6" stroke-dasharray=""/></g><circle cx="210" cy="144" r="37" fill="var(--card)" stroke="var(--c-q)" stroke-width="2"/><text x="210" y="151" font-size="21" fill="var(--c-q)" text-anchor="middle" font-weight="500">−0.144</text><text x="141"