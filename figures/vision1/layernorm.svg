<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What does LayerNorm do to one row?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>What does LayerNorm do to one row?</title><text x="30" y="90" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">one row</text><text x="300" y="90" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">[1, 0, 0, 1]</text><g data-build="1"><text x="30" y="190" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">mean = 0.5</text><text x="550" y="190" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">variance = 0.25</text></g><g data-build="2"><text x="30" y="290" font-size="34" fill="var(--ink)" text-anchor="start" font-weight="500">(x − mean) / √(variance + ε)</text></g><g data-build="3"><text x="30" y="395" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">≈ [1, −1, −1, 1]</text><text x="660" y="395" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">then learned scale + bias</text></g></svg>