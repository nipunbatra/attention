<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What does LayerNorm do to one row?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>What does LayerNorm do to one row?</title><text x="30" y="90" font-size="27" fill="var(--ink-2)" text-anchor="start" font-weight="500">one row</text><text x="300" y="90" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">[1, 0, 0, 1]</text><g data-build="1"><text x="30" y="190" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">mean = 0.5</text><text x="550" y="190" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">variance = 0.25</text></g><g data-build="2"><text x="30" y="290" font-size="34" fill="var(--ink)" text-anchor="start" font-weight="500">(x − mean) / √(variance + ε)</text></g><g data-build="3"><text x="30" y="395" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">≈ [1, −1, −1, 1]</text><text x="660" y="395" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">then learned scale + bias</text></g></svg>