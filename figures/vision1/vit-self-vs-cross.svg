<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Self-attention: Q, K and V share the same input" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Self-attention: Q, K and V share the same input</title><text x="30" y="35" font-size="28" fill="var(--neutral)" text-anchor="start" font-weight="650">TRANSLATION · cross-attention</text><rect x="30" y="64" width="290" height="70" rx="5" fill="var(--t-language)" stroke="var(--language)" stroke-width="2"/><text x="175.0" y="107.0" font-size="26" fill="var(--language)" text-anchor="middle" font-weight="500">Target-prefix states</text><path d="M332 99 L370 99" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><path d="M359.8683290659683 103.28360176539516 L370 99" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><path d="M370 99 L359.8683290659683 94.71639823460484" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><rect x="380" y="64" width="175" height="70" rx="5" fill="var(--t-mixing)" stroke="var(--mixing)" stroke-width="2"/><text x="467.5" y="107.0" font-size="30" fill="var(--mixing)" text-anchor="middle" font-weight="500">Q</text><rect x="610" y="64" width="290" height="70" rx="5" fill="var(--t-language)" stroke="var(--language)" stroke-width="2"/><text x="755.0" y="107.0" font-size="26" fill="var(--language)" text-anchor="middle" font-weight="500">Encoded source states</text><path d="M912 99 L950 99" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><path d="M939.8683290659683 103.28360176539516 L950 99" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><path d="M950 99 L939.8683290659683 94.71639823460484" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><rect x="960" y="64" width="175" height="70" rx="5" fill="var(--t-mixing)" stroke="var(--mixing)" stroke-width="2"/><text x="1047.5" y="107.0" font-size="30" fill="var(--mixing)" text-anchor="middle" font-weight="500">K, V</text><text x="580" y="175" font-size="26" fill="var(--language)" text-anchor="middle" font-weight="500">Two language streams meet at attention.</text><path d="M30 207 L1130 207" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray=""/><text x="30" y="251" font-size="28" fill="var(--neutral)" text-anchor="start" font-weight="650">ViT · self-attention</text><rect x="30" y="281" width="430" height="86" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="245.0" y="317.0" font-size="26" fill="var(--vision)" text-anchor="middle" font-weight="500">Current CLS + patch states</text><text x="245.0" y="347.0" font-size="26" fill="var(--vision)" text-anchor="middle" font-weight="500">one image sequence</text><path d="M475 324 L537 324" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><path d="M526.8683290659683 328.28360176539513 L537 324" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><path d="M537 324 L526.8683290659683 319.71639823460487" fill="none" stroke="var(--mixing)" stroke-width="2.5" stroke-dasharray=""/><rect x="550" y="281" width="575" height="86" rx="5" fill="var(--t-mixing)" stroke="var(--mixing)" stroke-width="2"/><text x="837.5" y="317.0" font-size="26" fill="var(--mixing)" text-anchor="middle" font-weight="500">Project the same rows into Q, K and V</text><text x="837.5" y="347.0" font-size="26" fill="var(--mixing)" text-anchor="middle" font-weight="500">then mix their information</text><text x="580" y="427" font-size="34" fill="var(--ink)" text-anchor="middle" font-weight="650">ViT has one stream. Translation had two streams.</text></svg>