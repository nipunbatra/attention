<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Does the embedding need 768 coordinates too?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Does the embedding need 768 coordinates too?</title><text x="35" y="60" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">pixel row</text><text x="380" y="60" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">weights W</text><text x="710" y="60" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">bias b</text><text x="930" y="60" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">embedding</text><text x="35" y="155" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">1 × 768</text><text x="275" y="155" font-size="32" fill="var(--ink)" text-anchor="start" font-weight="500">×</text><g data-build="1"><rect x="340" y="112" width="300" height="65" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="490.0" y="155" font-size="33" fill="var(--c-e)" text-anchor="middle" font-weight="500">768 × 192</text><text x="675" y="155" font-size="32" fill="var(--ink)" text-anchor="start" font-weight="500">+</text><text x="710" y="155" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">1 × 192</text></g><g data-build="2"><path d="M855 143 L930 143" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M919.8683290659683 147.28360176539516 L930 143" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M930 143 L919.8683290659683 138.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><text x="945" y="155" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">1 × 192</text></g><g data-build="2"><text x="35" y="285" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">nn.Linear(768, 192)</text><text x="35" y="355" font-size="28" fill="var(--ink-2)" text-anchor="start" font-weight="500">Affine map: weighted sums + bias; no activation.</text></g><g data-build="3"><text x="35" y="425" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">One patch stays one row. Its feature width changes: 768 → 192.</text></g></svg>