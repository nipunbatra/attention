<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Load the learned CLS for our dog example" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Load the learned CLS for our dog example</title><text x="35" y="42" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">Return to the pretrained model used for this dog.</text><text x="35" y="118" font-size="27" fill="var(--c-q)" text-anchor="start" font-weight="500">Stored CLS parameter s</text><text x="615" y="118" font-size="30" fill="var(--c-q)" text-anchor="start" font-weight="500">[−0.356, −0.038, −0.072, …]</text><text x="35" y="213" font-size="27" fill="var(--c-e)" text-anchor="start" font-weight="500">Its learned position p₀</text><text x="615" y="213" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">[−0.349, −0.030, −0.074, …]</text><text x="568" y="213" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">+</text><text x="35" y="308" font-size="27" fill="var(--c-q)" text-anchor="start" font-weight="500">Starting input row e₀ = s + p₀</text><text x="615" y="308" font-size="30" fill="var(--c-q)" text-anchor="start" font-weight="500">[−0.704, −0.067, −0.146, …]</text><path d="M600 266 L1125 266" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray=""/><text x="568" y="308" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">≈</text><text x="35" y="407" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">First 3 of 192 coordinates · loaded from the saved model · rounded</text></svg>