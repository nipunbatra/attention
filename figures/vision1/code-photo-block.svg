<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Match the two residual branches to code" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Match the two residual branches to code</title><rect x="20" y="23" width="690" height="362" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="55" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">self.norm1 = nn.LayerNorm(192, eps=1e-6)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="89" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">self.attn = Attention()</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="123" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">self.norm2 = nn.LayerNorm(192, eps=1e-6)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="157" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">self.mlp = nn.Sequential(</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="191" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">    nn.Linear(192, 768), nn.GELU(),</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="225" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">    nn.Linear(768, 192))</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="259" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500"></text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="293" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">x = x + self.attn(self.norm1(x))</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="327" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">x = x + self.mlp(self.norm2(x))</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="361" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">return x</text><rect x="787" y="24" width="320" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="947.0" y="55.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Input E</text><text x="947.0" y="85.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 197 × 192</text><path d="M947 105 L947 138" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M942.7163982346049 127.86832906596827 L947 138" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M947 138 L951.2836017653951 127.86832906596827" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="787" y="151" width="320" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="947.0" y="182.0" font-size="22" fill="var(--c-e)" text-anchor="middle" font-weight="500">LN → attention → add E</text><text x="947.0" y="212.0" font-size="22" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 197 × 192</text><path d="M947 233 L947 263" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M942.7163982346049 252.86832906596825 L947 263" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M947 263 L951.2836017653951 252.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="787" y="276" width="320" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="947.0" y="307.0" font-size="22" fill="var(--c-e)" text-anchor="middle" font-weight="500">LN → MLP → add input</text><text x="947.0" y="337.0" font-size="22" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 197 × 192</text><text x="947" y="408" font-size="23" fill="var(--c-v)" text-anchor="middle" font-weight="500">MLP features: 192 → 768 → 192</text></svg>