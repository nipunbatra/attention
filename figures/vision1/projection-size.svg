<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How many weights turn pixels into a patch row?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How many weights turn pixels into a patch row?</title><text x="30" y="75" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">one patch</text><text x="30" y="145" font-size="40" fill="var(--c-e)" text-anchor="start" font-weight="500">1 × 768</text><g data-build="1"><text x="345" y="75" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">shared W_patch</text><rect x="335" y="112" width="250" height="75" rx="4" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="460" y="158" font-size="33" fill="var(--c-e)" text-anchor="middle" font-weight="500">768 × 192</text><text x="275" y="158" font-size="34" fill="var(--ink)" text-anchor="start" font-weight="500">×</text></g><g data-build="2"><text x="635" y="155" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">+ bias</text><path d="M785 145 L865 145" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M854.8683290659683 149.28360176539516 L865 145" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M865 145 L854.8683290659683 140.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><text x="900" y="145" font-size="36" fill="var(--c-e)" text-anchor="start" font-weight="500">1 × 192</text></g><g data-build="3"><text x="30" y="290" font-size="32" fill="var(--ink)" text-anchor="start" font-weight="500">196 patches → 196 applications of the same layer</text><text x="30" y="380" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">768 × 192 + 192 = 147,648 parameters</text></g></svg>