<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="One layer produces all 196 patch embeddings" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>One layer produces all 196 patch embeddings</title><text x="35" y="55" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">224 × 224 image / 16 × 16 patches → 196 patches</text><text x="35" y="140" font-size="40" fill="var(--c-e)" text-anchor="start" font-weight="500">X</text><text x="35" y="205" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">(196, 768)</text><g data-build="1"><path d="M285 178 L395 178" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M384.8683290659683 182.28360176539516 L395 178" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M395 178 L384.8683290659683 173.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="395" y="143" width="375" height="65" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="582.5" y="186" font-size="29" fill="var(--c-e)" text-anchor="middle" font-weight="500">nn.Linear(768, 192)</text><path d="M770 178 L870 178" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M859.8683290659683 182.28360176539516 L870 178" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M870 178 L859.8683290659683 173.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><text x="895" y="140" font-size="40" fill="var(--c-e)" text-anchor="start" font-weight="500">C</text><text x="895" y="205" font-size="32" fill="var(--c-e)" text-anchor="start" font-weight="500">(196, 192)</text></g><g data-build="2"><text x="35" y="315" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">W: (768, 192)</text><text x="650" y="315" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">bias: (192,)</text></g><g data-build="3"><text x="35" y="415" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">768 × 192 + 192 = 147,648 parameters, shared by all patches</text></g></svg>