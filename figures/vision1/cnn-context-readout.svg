<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="A wider view, then one image label" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>A wider view, then one image label</title><text x="35" y="29" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">3 · Build a wider view: how do distant clues meet?</text><text x="35" y="77" font-size="29" fill="var(--c-v)" text-anchor="start" font-weight="600">CNN · local filters</text><text x="620" y="77" font-size="29" fill="var(--c-q)" text-anchor="start" font-weight="600">ViT · global attention</text><rect x="35" y="112" width="150" height="72" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="110.0" y="156.0" font-size="22" fill="var(--c-v)" text-anchor="middle" font-weight="500">Local features</text><rect x="220" y="112" width="150" height="72" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="295.0" y="156.0" font-size="22" fill="var(--c-v)" text-anchor="middle" font-weight="500">Combine them</text><rect x="405" y="112" width="150" height="72" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="480.0" y="156.0" font-size="22" fill="var(--c-v)" text-anchor="middle" font-weight="500">Wider context</text><path d="M190 148 L213 148" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M202.86832906596825 152.28360176539516 L213 148" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M213 148 L202.86832906596825 143.71639823460484" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M377 148 L398 148" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M387.8683290659683 152.2