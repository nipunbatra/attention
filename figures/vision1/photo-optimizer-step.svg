<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Backward: compute gradients, then update the model" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Backward: compute gradients, then update the model</title><text x="35" y="38" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">Same model, reverse direction: loss → parameter gradients</text><rect x="35" y="105" width="132" height="90" rx="5" fill="var(--card)" stroke="var(--ink-2)" stroke-width="2"/><text x="101.0" y="143.0" font-size="18" fill="var(--ink-2)" text-anchor="middle" font-weight="500">Image x</text><text x="101.0" y="173.0" font-size="18" fill="var(--ink-2)" text-anchor="middle" font-weight="500">3 × 224 × 224</text><rect x="199" y="105" width="217" height="90" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="307.5" y="143.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">Input embedding</text><text x="307.5" y="173.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">197 × 192</text><rect x="448" y="105" width="239" height="90" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="567.5" y="143.0" font-size="25" fill="var(--c-a)" text-anchor="middle" font-weight="500">12 blocks</text><text x="567.5" y="173.0" font-size="25" fill="var(--c-a)" text-anchor="middle" font-weight="500">197 × 192</text><rect x="719" y="105" width="211" height="90" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="824.5" y="143.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">Read CLS + head</text><text x="824.5" y="173.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">192 → 1,000</text><rect x="962" y="105" width="163" height="90" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="1043.5" y="143.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">Label loss</text><text x="1043.5" y="173.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">L = 0.0437</text><path d="M958 150 L935 150" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M945.1316709340317 145.71639823460484 L935 150" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M935 150 L945.1316709340317 154.28360176539516" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M714 150 L692 150" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M702.1316709340317 145.71639823460484 L692 150" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M692 150 L702.1316709340317 154.28360176539516" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M443 150 L421 150" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M431.1316709340317 145.71639823460484 L421 150" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M421 150 L431.1316709340317 154.28360176539516" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><text x="101" y="229" font-size="23" fill="var(--ink-2)" text-anchor="middle" font-weight="500">Fixed data</text><text x="199" y="244" font-size="25" fill="var(--c-a)" text-anchor="start" font-weight="500">Gradients reach the head, all blocks, and the learned input parameters.</text><g data-build="1"><rect x="35" y="295" width="310" height="84" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="190.0" y="330.0" font-size="28" fill="var(--c-a)" text-anchor="middle" font-weight="500">Compute gradients</text><text x="190.0" y="360.0" font-size="28" fill="var(--c-a)" text-anchor="middle" font-weight="500">θ.grad = ∂L/∂θ</text><path d="M351 337 L389 337" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M378.8683290659683 341.28360176539513 L389 337" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M389 337 L378.8683290659683 332.71639823460487" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><rect x="397" y="295" width="350" height="84" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="572.0" y="330.0" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">Optimizer step</text><text x="572.0" y="360.0" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">θ ← θ − η ∇θ L</text><path d="M754 337 L795 337" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M784.8683290659683 341.28360176539513 L795 337" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M795 337 L784.8683290659683 332.71639823460487" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><rect x="803" y="295" width="322" height="84" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="964.0" y="330.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Next forward pass</text><text x="964.0" y="360.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">use updated parameters</text></g><g data-build="1"><path d="M199 181 L181 181" fill="none" stroke="var(--c-a)" stroke-width="2" stroke-dasharray=""/><path d="M181 181 L181 267" fill="none" stroke="var(--c-a)" stroke-width="2" stroke-dasharray=""/><path d="M181 267 L190 267" fill="none" stroke="var(--c-a)" stroke-width="2" stroke-dasharray=""/><path d="M190 267 L190 288" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M185.71639823460484 277.8683290659683 L190 288" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M190 288 L194.28360176539516 277.8683290659683" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/></g><text x="35" y="433" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">backward() computes gradients; step() changes the parameters.</text></svg>