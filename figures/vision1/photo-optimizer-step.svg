<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Only the optimizer changes the model parameters" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Only the optimizer changes the model parameters</title><text x="35" y="47" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">One illustrative SGD update of a class bias</text><rect x="35" y="122" width="270" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="170.0" y="153.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Stored bias b</text><text x="170.0" y="183.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Newfoundland</text><path d="M313 160 L377 160" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M366.8683290659683 164.28360176539516 L377 160" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M377 160 L366.8683290659683 155.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="395" y="122" width="325" height="76" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="557.5" y="153.0" font-size="24" fill="var(--c-a)" text-anchor="middle" font-weight="500">Gradient = -0.0427</text><text x="557.5" y="183.0" font-size="24" fill="var(--c-a)" text-anchor="middle" font-weight="500">learning rate = 0.1</text><path d="M730 160 L792 160" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M781.8683290659683 164.28360176539516 L792 160" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M792 160 L781.8683290659683 155.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="810" y="122" width="315" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="967.5" y="153.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">New bias</text><text x="967.5" y="183.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">b + 0.00427</text><g data-build="1"><text x="35" y="285" font-size="31" fill="var(--c-a)" text-anchor="start" font-weight="500">backward(): compute gradients</text><text x="35" y="346" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">step(): update trainable parameters using those gradients</text><text x="35" y="410" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">Then run a new forward pass. The next activations will be different.</text></g></svg>