<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How does this connect to text embeddings?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How does this connect to text embeddings?</title><text x="35" y="55" font-size="30" fill="var(--ink-2)" text-anchor="start" font-weight="500">Text: a token ID</text><text x="655" y="55" font-size="30" fill="var(--ink-2)" text-anchor="start" font-weight="500">Image: pixel values</text><rect x="35" y="110" width="440" height="65" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="255.0" y="153" font-size="30" fill="var(--c-e)" text-anchor="middle" font-weight="500">bank → its vocabulary ID</text><rect x="655" y="110" width="440" height="65" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="875.0" y="153" font-size="30" fill="var(--c-e)" text-anchor="middle" font-weight="500">x₁: twelve values</text><g data-build="1"><path d="M255 175 L255 220" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M250.71639823460484 209.86832906596825 L255 220" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M255 220 L259.28360176539513 209.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="35" y="220" width="440" height="65" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="255.0" y="263" font-size="29" fill="var(--c-e)" text-anchor="middle" font-weight="500">nn.Embedding(V, 4)</text><path d="M875 175 L875 220" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M870.7163982346049 209.86832906596825 L875 220" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M875 220 L879.2836017653951 209.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="655" y="220" width="440" height="65" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="875.0" y="263" font-size="29" fill="var(--c-e)" text-anchor="middle" font-weight="500">nn.Linear(12, 2)</text></g><g data-build="2"><path d="M255 285 L255 330" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M250.71639823460484 319.8683290659683 L255 330" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M255 330 L259.28360176539513 319.8683290659683" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><text x="255" y="370" font-size="31" fill="var(--c-e)" text-anchor="middle" font-weight="500">look up 4 coordinates</text><path d="M875 285 L875 330" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M870.7163982346049 319.8683290659683 L875 330" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M875 330 L879.2836017653951 319.8683290659683" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><text x="875" y="370" font-size="27" fill="var(--c-e)" text-anchor="middle" font-weight="500">2 coordinates · no activation</text></g><text x="35" y="420" font-size="23" fill="var(--ink-2)" text-anchor="start" font-weight="500">V = vocabulary size; the two models may choose different embedding widths.</text></svg>