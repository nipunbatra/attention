<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Attention turns the extra row into an image summary" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Attention turns the extra row into an image summary</title><text x="45" y="43" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Start with the same learned summary row for every image.</text><rect x="45" y="94" width="255" height="86" rx="6" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="172.5" y="129" font-size="25" fill="var(--c-q)" text-anchor="middle" font-weight="500">Initial CLS</text><text x="172.5" y="161" font-size="25" fill="var(--c-q)" text-anchor="middle" font-weight="500">192 learned numbers</text><path d="M306 137 L389 137" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M378.8683290659683 141.28360176539516 L389 137" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M389 137 L378.8683290659683 132.71639823460484" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><rect x="405" y="94" width="300" height="86" rx="6" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="555.0" y="129" font-size="25" fill="var(--c-q)" text-anchor="middle" font-weight="500">Attention</text><text x="555.0" y="161" font-size="25" fill="var(--c-q)" text-anchor="middle" font-weight="500">gather patch features</text><path d="M711 137 L794 137" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M783.8683290659683 141.28360176539516 L794 137" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M794 137 L783.8683290659683 132.71639823460484" fill="none" stroke="var(--c-q)" stroke-widt