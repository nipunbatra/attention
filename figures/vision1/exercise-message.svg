<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Your turn: which message arrives?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Your turn: which message arrives?</title><text x="30" y="70" font-size="36" fill="var(--c-q)" text-anchor="start" font-weight="500">q = [1, 0]</text><text x="470" y="70" font-size="31" fill="var(--c-k)" text-anchor="start" font-weight="500">already-scaled logits = [ln 2, 0]</text><g data-build="1"><text x="30" y="185" font-size="33" fill="var(--c-v)" text-anchor="start" font-weight="500">values: [2, 0] and [0, 3]</text></g><g data-build="2"><text x="30" y="295" font-size="35" fill="var(--c-a)" text-anchor="start" font-weight="500">weights = [2/3, 1/3]</text></g><g data-build="3"><text x="30" y="402" font-size="30" fill="var(--c-v)" text-anchor="start" font-weight="500">message = (2/3)[2,0] + (1/3)[0,3] = [4/3, 1]</text></g></svg>