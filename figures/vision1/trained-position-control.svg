<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What happens when a trained ViT loses position?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>What happens when a trained ViT loses position?</title><text x="30" y="70" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">positions on</text><text x="30" y="220" font-size="31" fill="var(--ink-2)" text-anchor="start" font-weight="500">positions off</text><g data-build="1"><rect x="340" y="105" width="650.0" height="52" rx="4" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="1080" y="141" font-size="30" fill="var(--c-e)" text-anchor="end" font-weight="500">256 / 256</text></g><g data-build="1"><rect x="340" y="255" width="325.0" height="52" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="1080" y="291" font-size="30" fill="var(--c-e)" text-anchor="end" font-weight="500">128 / 256</text></g><g data-build="2"><text x="30" y="419" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">Without position, each opposite-label pair has the same prediction.</text></g></svg>