<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Next option: fine-tune the last block as well" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Next option: fine-tune the last block as well</title><text x="35" y="47" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">If head-only training is insufficient, adapt some features too.</text><g transform="translate(0 -175)"><path d="M35 290 L1128 290" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray=""/><text x="35" y="327" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="600">2 · Optional:</text><text x="35" y="360" font-size="24" fill="var(--ink)" text-anchor="start" font-weight="500">fine-tune the</text><text x="35" y="391" font-size="24" fill="var(--ink)" text-anchor="start" font-weight="500">last block too</text><rect x="260" y="318" width="250" height="106" rx="8" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><g transform="translate(290 346) scale(0.8)" role="img" aria-label="Frozen weights"><title>Frozen weights</title><g fill="none" stroke="var(--c-e)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path transform="rotate(0)" d="M0 -15 V15 M-5 -12 L0 -8 L5 -12 M-5 12 L0 8 L5 12"/><path transform="rotate(60)" d="M0 -15 V15 M-5 -12 L0 -8 L5 -12 M-5 12 L0 8 L5 12"/><path transform="rotate(120)" d="M0 -15 V15 M-5 -12 L0 -8 L5 -12 M-5 12 L0 8 L5 12"/></g></g><text x="405" y="352" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">Earlier encoder</text><text x="385" y="390" font-size="22" fill="var(--c-e)" text-anchor="middle" font-weight="500">weights stay fixed</text><path d="M519 371 L552 371" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M541.8683290659683 375.28360176539513 L552 371" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M552 371 L541.8683290659683 366.71639823460487" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="567" y="318" width="242" height="106" rx="8" fill="var(--transparent)" stroke="var(--loss)" stroke-width="2"/><g transform="translate(598 346) scale(0.8)" role="img" aria-label="Trainable weights"><title>Trainable weights</title><g fill="none" stroke="var(--loss)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -17 C-1 -7 -12 -5 -11 6 C-10 20 12 19 12 5 C12 -2 7 -7 5 -9 C7 -2 2 0 0 -17 Z" fill="var(--loss)"/></g></g><text x="707" y="352" font-size="24" fill="var(--loss)" text-anchor="middle" font-weight="500">Last block</text><text x="688" y="390" font-size="22" fill="var(--loss)" text-anchor="middle" font-weight="500">unfreeze weights</text><path d="M820 371 L865 371" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M854.8683290659683 375.28360176539513 L865 371" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M865 371 L854.8683290659683 366.71639823460487" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><g transform="translate(911 316) scale(0.7)" role="img" aria-label="Trainable weights"><title>Trainable weights</title><g fill="none" stroke="var(--loss)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -17 C-1 -7 -12 -5 -11 6 C-10 20 12 19 12 5 C12 -2 7 -7 5 -9 C7 -2 2 0 0 -17 Z" fill="var(--loss)"/></g></g><text x="944" y="324" font-size="23" fill="var(--loss)" text-anchor="start" font-weight="500">Head</text><g opacity="0.43"><path d="M910 347 L1025 357" fill