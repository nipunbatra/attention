<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Can we write attention in five lines?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Can we write attention in five lines?</title><text x="50" y="90" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">E: 5 × 4</text><g data-build="1"><text x="50" y="175" font-size="27" fill="var(--c-q)" text-anchor="start" font-weight="500">Q, K, V: 5 × 2</text></g><g data-build="2"><text x="50" y="260" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">A: 5 × 5</text></g><g data-build="3"><text x="50" y="345" font-size="30" fill="var(--c-v)" text-anchor="start" font-weight="500">H: 5 × 2</text></g></svg>