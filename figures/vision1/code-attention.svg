<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Can we write attention in five lines?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Can we write attention in five lines?</title><text x="50" y="90" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">E: 5 × 4</text><g data-build="1"><text x="50" y="175" font-size="27" fill="var(--c-q)" text-anchor="start" font-weight="500">Q, K, V: 5 × 2</text></g><g data-build="2"><text x="50" y="260" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">A: 5 × 5</text></g><g data-build="3"><text x="50" y="345" font-size="30" fill="var(--c-v)" text-anchor="start" font-weight="500">H: 5 × 2</text></g></svg>