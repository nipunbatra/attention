<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Change only a value. What happens?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Change only a value. What happens?</title><text x="35" y="65" font-size="31" fill="var(--ink-2)" text-anchor="start" font-weight="500">Keep q, keys and weights [¾, ¼] fixed.</text><text x="35" y="165" font-size="37" fill="var(--c-v)" text-anchor="start" font-weight="500">v_face: [2,0] → [4,0]</text><text x="35" y="250" font-size="32" fill="var(--c-v)" text-anchor="start" font-weight="500">v_branches stays [0,2]</text><g data-build="1"><text x="35" y="385" font-size="36" fill="var(--c-v)" text-anchor="start" font-weight="500">message: [1.5, 0.5] → [3.0, 0.5]</text></g></svg>