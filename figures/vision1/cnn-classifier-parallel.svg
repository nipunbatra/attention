<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Both models turn visual features into class scores" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Both models turn visual features into class scores</title><text x="35" y="47" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Same classification goal; different choices about spatial structure</text><text x="35" y="112" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">Question</text><text x="380" y="112" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">CNN</text><text x="780" y="112" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">ViT</text><text x="35" y="180" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">Spatial mixing</text><text x="380" y="180" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">local kernel at each location</text><text x="780" y="180" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">query–key weights across rows</text><text x="35" y="235" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">Shared parameters</text><text x="380" y="235" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">kernel weights across locations</text><text x="780" y="235" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">Q/K/V and MLP across rows</text><text x="35" y="290" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">Image summary</text><text x="380" y="290" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">often global average pooling</text><text x="780" y="290" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">CLS or mean pooling</text><text x="35" y="345" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">Position</text><text x="380" y="345" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">grid neighborhoods are explicit</text><text x="780" y="345" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">position signals supplement rows</text><text x="35" y="400" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">Learning signal</text><text x="380" y="400" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">image-label cross-entropy</text><text x="780" y="400" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">image-label cross-entropy</text></svg>