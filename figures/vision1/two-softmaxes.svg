<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="We used softmax twice. What changed?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>We used softmax twice. What changed?</title><text x="35" y="70" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">attention softmax</text><text x="620" y="70" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">class softmax</text><text x="35" y="145" font-size="28" fill="var(--c-e)" text-anchor="start" font-weight="500">CLS</text><text x="35" y="197" font-size="28" fill="var(--c-e)" text-anchor="start" font-weight="500">P1</text><text x="35" y="249" font-size="28" fill="var(--c-e)" text-anchor="start" font-weight="500">P2</text><text x="35" y="301" font-size="28" fill="var(--c-e)" text-anchor="start" font-weight="500">P3</text><text x="35" y="353" font-size="28" fill="var(--c-e)" text-anchor="start" font-weight="500">P4</text><g data-build="1"><text x="620" y="165" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">Across the top</text><text x="620" y="265" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">Down the left</text></g><g data-build="2"><text x="35" y="427" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">Which sources should I read?</text><text x="620" y="427" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">Which label should I predict?</text></g></svg>