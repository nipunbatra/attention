<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Mix the values, join the heads, and add the input" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Mix the values, join the heads, and add the input</title><text x="25" y="48" font-size="31" fill="var(--c-v)" text-anchor="start" font-weight="500">One head’s message into CLS</text><rect x="25" y="97" width="245" height="80" rx="6" fill="var(--transparent)" stroke="var(--c-k)" stroke-width="2"/><text x="147.5" y="128.0" font-size="25" fill="var(--c-k)" text-anchor="middle" font-weight="500">197 source weights</text><text x="147.5" y="164.0" font-size="25" fill="var(--c-k)" text-anchor="middle" font-weight="500">a₀₀ … a₀,₁₉₆</text><text x="300" y="149" font-size="38" fill="var(--ink)" text-anchor="start" font-weight="500">×</text><rect x="350" y="97" width="285" height="80" rx="6" fill="var(--transparent)" stroke="var(--c-v)" stroke-width="2"/><text x="492.5" y="128.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">197 value rows</text><text x="492.5" y="164.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">each 64 features</text><path d="M635 137 L730 137" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M719.8683290659683 141.28360176539516 L730 137" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M730 137 L719.8683290659683 132.71639823460484" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><rect x="750" y="97" width="365" height="80" rx="6" fill="var(--transparent)" stroke="var(--c-v)" stroke-width="2"/><text x="932.5" y="128.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">h₀ = Σⱼ a₀ⱼvⱼ</text><text x="932.5" y="164.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">one row · 1 × 64</text><g data-build="1"><text x="25" y="258" font-size="31" fill="var(--c-v)" text-anchor="start" font-weight="500">Three heads: 64 + 64 + 64 = 192 features</text></g><g data-build="2"><rect x="25" y="302" width="290" height="80" rx="6" fill="var(--transparent)" stroke="var(--c-v)" stroke-width="2"/><text x="170.0" y="333.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">join the messages</text><text x="170.0" y="369.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">197 × 192</text><path d="M315 342 L382 342" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M371.8683290659683 346.28360176539513 L382 342" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M382 342 L371.8683290659683 337.71639823460487" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="400" y="302" width="315" height="80" rx="6" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="557.5" y="333.0" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">output Linear(192,192)</text><text x="557.5" y="369.0" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">197 × 192</text><path d="M715 342 L782 342" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M771.8683290659683 346.28360176539513 L782 342" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M782 342 L771.8683290659683 337.71639823460487" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="800" y="302" width="315" height="80" rx="6" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="957.5" y="333.0" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">add the input E</text><text x="957.5" y="369.0" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">197 × 192</text></g></svg>