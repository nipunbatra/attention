<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How much matching happens inside the tiny real model?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How much matching happens inside the tiny real model?</title><text x="35" y="75" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">196 patch rows + CLS</text><g data-build="1"><text x="35" y="185" font-size="34" fill="var(--c-a)" text-anchor="start" font-weight="500">197 × 197 = 38,809 scores per head</text></g><g data-build="2"><text x="35" y="295" font-size="34" fill="var(--ink)" text-anchor="start" font-weight="500">3 heads × 12 blocks</text><text x="35" y="400" font-size="37" fill="var(--c-a)" text-anchor="start" font-weight="500">1,397,124 scores for one image</text></g></svg>