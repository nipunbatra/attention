<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How much matching happens inside the tiny real model?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>How much matching happens inside the tiny real model?</title><text x="35" y="75" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">196 patch rows + CLS</text><g data-build="1"><text x="35" y="185" font-size="34" fill="var(--mixing)" text-anchor="start" font-weight="500">197 × 197 = 38,809 scores per head</text></g><g data-build="2"><text x="35" y="295" font-size="34" fill="var(--ink)" text-anchor="start" font-weight="500">3 heads × 12 blocks</text><text x="35" y="400" font-size="37" fill="var(--mixing)" text-anchor="start" font-weight="500">1,397,124 scores for one image</text></g></svg>