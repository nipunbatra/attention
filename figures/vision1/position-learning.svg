<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="The image loss teaches the position table" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>The image loss teaches the position table</title><text x="35" y="32" font-size="28" fill="var(--ink)" text-anchor="start" font-weight="500">Start with small random values; train with the class loss.</text><rect x="35" y="112" width="190" height="66" rx="4" fill="var(--transparent)" stroke="var(--c-q)" stroke-width="2"/><text x="130.0" y="153" font-size="25" fill="var(--c-q)" text-anchor="middle" font-weight="500">p₆₃: 192 entries</text><path d="M225 145 L308 145" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M297.8683290659683 149.28360176539516 L308 145" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M308 145 L297.8683290659683 140.71639823460484" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><circle cx="330" cy="145" r="22" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="330" y="155" font-size="35" fill="var(--ink)" text-anchor="middle" font-weight="500">+</text><text x="330" y="78" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">c₆₃ from pixels</text><path d="M330 89 L330 123" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M325.71639823460487 112.86832906596827 L330 123" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M330 123 L334.28360176539513 112.86832906596827" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M352 145 L415 145" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M404.8683290659683 149.28360176539516 L415 145" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M415 145 L404.8683290659683 140.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="415" y="112" width="190" height="66" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="510.0" y="153" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">e₆₃ = c₆₃ + p₆₃</text><path d="M605 145 L670 145" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M659.8683290659683 149.28360176539516 L670 145" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M670 145 L659.8683290659683 140.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="670" y="112" width="255" height="66" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="797.5" y="139" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">Transformer blocks</text><text x="797.5" y="166" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">+ classifier</text><path d="M925 145 L1000 145" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M989.8683290659683 149.28360176539516 L1000 145" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M1000 145 L989.8683290659683 140.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="1000" y="112" width="130" height="66" rx="4" fill="var(--transparent)" stroke="var(--c-a)" stroke-width="2"/><text x="1065.0" y="139" font-size="25" fill="var(--c-a)" text-anchor="middle" font-weight="500">class loss</text><text x="1065.0" y="166" font-size="25" fill="var(--c-a)" text-anchor="middle" font-weight="500">L</text><g data-build="1"><path d="M1065 178 L1065 228" fill="none" stroke="var(--c-a)" stroke-width="2" stroke-dasharray=""/><path d="M1065 228 L130 228" fill="none" stroke="var(--c-a)" stroke-width="2" stroke-dasharray=""/><path d="M130 228 L130 178" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M134.28360176539516 188.13167093403175 L130 178" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M130 178 L125.71639823460484 188.13167093403175" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><text x="580" y="267" font-size="26" fill="var(--c-a)" text-anchor="middle" font-weight="500">Backpropagation: gradients reach every trainable position row.</text></g><g data-build="2"><text x="35" y="319" font-size="25" fill="var(--ink-2)" text-anchor="start" font-weight="500">Illustrative SGD update of one entry</text><text x="35" y="366" font-size="29" fill="var(--c-q)" text-anchor="start" font-weight="500">p₆₃,₁: 0.020 − 0.1 × 0.30 = −0.010</text><text x="35" y="409" font-size="25" fill="var(--ink-2)" text-anchor="start" font-weight="500">old value − learning rate × gradient</text></g><g data-build="3"><rect x="670" y="294" width="460" height="133" rx="4" fill="var(--transparent)" stroke="var(--c-v)" stroke-width="2"/><text x="900" y="327" font-size="26" fill="var(--c-v)" text-anchor="middle" font-weight="500">Alternative: fixed sinusoidal</text><text x="900" y="367" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">sin/cos(position, coordinate)</text><text x="900" y="405" font-size="24" fill="var(--ink-2)" text-anchor="middle" font-weight="500">No learned table entries.</text></g></svg>