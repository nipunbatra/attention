<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="First ask how the two class scores should change" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>First ask how the two class scores should change</title><text x="35" y="60" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">Class order: [Across the top, Down the left]</text><g data-build="0"><text x="35" y="142" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">probabilities p</text><text x="555" y="142" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">[0.857, 0.143]</text></g><g data-build="1"><text x="35" y="230" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">known target y</text><text x="555" y="230" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">[1, 0]</text></g><g data-build="2"><text x="35" y="318" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">score gradient p − y</text><text x="555" y="318" font-size="34" fill="var(--c-a)" text-anchor="start" font-weight="500">[−0.143, 0.143]</text></g><g data-build="2"><text x="35" y="416" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">Raise the correct score; lower the competing score.</text></g></svg>