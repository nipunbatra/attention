<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Write the three-head computation with explicit axes" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Write the three-head computation with explicit axes</title><rect x="20" y="23" width="690" height="294" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="55" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">B, N, D = x.shape</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="89" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">qkv = self.qkv(x).reshape(B, N, 3, 3, 64)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="123" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">q, k, v = qkv.permute(2, 0, 3, 1, 4).unbind(0)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="157" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">scores = (q @ k.transpose(-2, -1)) / 8</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="191" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">weights = scores.softmax(dim=-1)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="225" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">messages = weights @ v</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="259" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">joined = messages.transpose(1, 2).reshape(B, N, D)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="293" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">return self.proj(joined)</text><rect x="770" y="22" width="355" height="76" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="947.5" y="53.0" font-size="24" fill="var(--c-q)" text-anchor="middle" font-weight="500">Q, K, V — each</text><text x="947.5" y="83.0" font-size="24" fill="var(--c-q)" text-anchor="middle" font-weight="500">B × 3 × 197 × 64</text><path d="M947 104 L947 132" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M942.7163982346049 121.86832906596827 L947 132" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M947 132 L951.2836017653951 121.86832906596827" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="770" y="144" width="355" height="76" rx="5" fill="var(--card)" stroke="var(--c-k)" stroke-width="2"/><text x="947.5" y="175.0" font-size="24" fill="var(--c-k)" text-anchor="middle" font-weight="500">scores and weights</text><text x="947.5" y="205.0" font-size="24" fill="var(--c-k)" text-anchor="middle" font-weight="500">B × 3 × 197 × 197</text><path d="M947 226 L947 254" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M942.7163982346049 243.86832906596825 L947 254" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M947 254 L951.2836017653951 243.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="770" y="266" width="355" height="76" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="947.5" y="297.0" font-size="22" fill="var(--c-v)" text-anchor="middle" font-weight="500">messages → joined → project</text><text x="947.5" y="327.0" font-size="22" fill="var(--c-v)" text-anchor="middle" font-weight="500">B × 197 × 192</text><text x="947" y="391" font-size="19" fill="var(--ink-2)" text-anchor="middle" font-weight="500">No causal mask: the whole image is available.</text></svg>