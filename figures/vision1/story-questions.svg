<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Five questions build the architecture" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Five questions build the architecture</title><rect x="40" y="20" width="60" height="57" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="70.0" y="56.5" font-size="30" fill="var(--vision)" text-anchor="middle" font-weight="500">1</text><text x="130" y="56" font-size="32" fill="var(--ink)" text-anchor="start" font-weight="650">Make tokens</text><text x="580" y="56" font-size="28" fill="var(--ink-2)" text-anchor="start" font-weight="500">Pixels → vectors</text><path d="M70 80 L70 98" fill="none" stroke="var(--vision)" stroke-width="2.5" stroke-dasharray=""/><path d="M65.71639823460484 87.86832906596827 L70 98" fill="none" stroke="var(--vision)" stroke-width="2.5" stroke-dasharray=""/><path d="M70 98 L74.28360176539516 87.86832906596827" fill="none" stroke="var(--vision)" stroke-width="2.5" stroke-dasharray=""/><rect x="40" y="103" width="60" height="57" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="70.0" y="139.5" font-size="30" fill="var(--vision)" text-anchor="middle" font-weight="500">2</text><text x="130" y="139" font-size="32" fill="var(--ink)" text-anchor="start" font-weight="650">Keep location</text><text x="580" y="139" font-size="28" fill="var(--ink-2)" text-anchor="start" font-weight="500">Which patch goes where?</text><path d="M70 163 L70 181" fill="none" stroke="var(--vision)" stroke-width="2.5" stroke-dasharray=""/><path d="M65.71639823