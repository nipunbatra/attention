<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Can you now explain the whole photograph-to-answer path?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Can you now explain the whole photograph-to-answer path?</title><text x="30" y="80" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">pixels → shared patch projection + location</text><g data-build="1"><text x="30" y="185" font-size="33" fill="var(--c-v)" text-anchor="start" font-weight="500">Q,K choose weights · V supplies messages</text></g><g data-build="2"><text x="30" y="290" font-size="32" fill="var(--c-d)" text-anchor="start" font-weight="500">multiple heads → W_O → residual + row MLP</text></g><g data-build="3"><text x="30" y="395" font-size="32" fill="var(--c-a)" text-anchor="start" font-weight="500">updated CLS → class scores → loss → learning</text></g></svg>