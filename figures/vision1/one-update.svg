<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Can we make the correct answer a little more likely?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Can we make the correct answer a little more likely?</title><text x="30" y="60" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">target: Across the top</text><text x="30" y="145" font-size="36" fill="var(--c-a)" text-anchor="start" font-weight="500">p − y = [−0.143, 0.143]</text><g data-build="1"><text x="30" y="240" font-size="33" fill="var(--c-d)" text-anchor="start" font-weight="500">class bias b: [0,0] → [0.071, −0.071]</text></g><g data-build="2"><text x="30" y="335" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">P(Across): 0.857 → 0.874</text></g><g data-build="3"><text x="30" y="416" font-size="31" fill="var(--c-a)" text-anchor="start" font-weight="500">Loss: 0.154 → 0.135</text></g></svg>