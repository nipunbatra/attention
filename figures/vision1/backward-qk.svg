<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Follow the score gradients into queries and keys" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Follow the score gradients into queries and keys</title><rect x="35.0" y="80" width="232.0" height="74" rx="6" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="151.0" y="110.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">starting rows E</text><text x="151.0" y="140.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">5 × 4</text><path d="M271.0 117 L299.0 117" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M288.8683290659683 121.28360176539516 L299.0 117" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M299.0 117 L288.8683290659683 112.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="305.0" y="80" width="232.0" height="74" rx="6" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="421.0" y="110.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">Q and K</text><text x="421.0" y="140.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">5 × 2 each</text><path d="M541.0 117 L569.0 117" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M558.8683290659683 121.28360176539516 L569.0 117" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M569.0 117 L558.8683290659683 112.71639823460484" fill="