<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="The loss teaches both what to read and what to send" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>The loss teaches both what to read and what to send</title><text x="35" y="40" font-size="30" fill="var(--c-v)" text-anchor="start" font-weight="500">Zoom into one head and the CLS message: h = a V</text><rect x="780" y="95" width="340" height="76" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="950.0" y="126.0" font-size="24" fill="var(--c-a)" text-anchor="middle" font-weight="500">Gradient arriving at h</text><text x="950.0" y="156.0" font-size="24" fill="var(--c-a)" text-anchor="middle" font-weight="500">1 × 64</text><path d="M774 133 L575 133" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M585.1316709340317 128.71639823460484 L575 133" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M575 133 L585.1316709340317 137.28360176539516" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><rect x="340" y="95" width="220" height="76" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="450.0" y="126.0" font-size="24" fill="var(--c-v)" text-anchor="middle" font-weight="500">Weighted sum</text><text x="450.0" y="156.0" font-size="24" fill="var(--c-v)" text-anchor="middle" font-weight="500">a V</text><g data-build="1"><path d="M400 177 L240 256" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M247.18818347006294 247.67353505977994 L240 256" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M240 256 L250.98109599213944 255.35538320575765" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><rect x="35" y="271" width="390" height="76" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="230.0" y="302.0" font-size="24" fill="var(--c-v)" text-anchor="middle" font-weight="500">Value route</text><text x="230.0" y="332.0" font-size="24" fill="var(--c-v)" text-anchor="middle" font-weight="500">dV = aᵀ dh  ·  197 × 64</text></g><g data-build="1"><path d="M500 177 L765 256" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M754.0668155428722 257.2105691332666 L765 256" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M765 256 L756.5143678929851 249.00042517402673" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><rect x="565" y="271" width="555" height="76" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="842.5" y="302.0" font-size="24" fill="var(--c-q)" text-anchor="middle" font-weight="500">Weight route: da = dh Vᵀ</text><text x="842.5" y="332.0" font-size="24" fill="var(--c-q)" text-anchor="middle" font-weight="500">softmax → scores → Q and K</text></g><g data-build="2"><text x="35" y="412" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">Patch rows learn because their keys and values helped CLS make the prediction.</text></g></svg>