<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="A tensor can have the right shape and the wrong meaning" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>A tensor can have the right shape and the wrong meaning</title><text x="35" y="55" font-size="33" fill="var(--ink)" text-anchor="start" font-weight="500">Input shape: [2 images, 3 rows, 2 coordinates]</text><text x="35" y="155" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">batch_first=True</text><text x="635" y="155" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">wrong axis interpretation</text><g data-build="1"><text x="35" y="255" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">read A’s three rows</text><text x="635" y="255" font-size="31" fill="var(--c-a)" text-anchor="start" font-weight="500">read P1 in A and B</text></g><g data-build="2"><text x="35" y="345" font-size="28" fill="var(--c-v)" text-anchor="start" font-weight="500">( [2,0]+[4,0]+[6,0] ) / 3</text><text x="635" y="345" font-size="29" fill="var(--c-v)" text-anchor="start" font-weight="500">( [2,0]+[0,2] ) / 2</text></g><g data-build="3"><text x="35" y="425" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">= [4,0]</text><text x="635" y="425" font-size="35" fill="var(--c-a)" text-anchor="start" font-weight="500">= [1,1]</text></g></svg>