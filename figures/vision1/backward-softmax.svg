<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="The source scores compete for attention weight" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>The source scores compete for attention weight</title><text x="35" y="50" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Attention weights came from a softmax over source scores.</text><rect x="35" y="116" width="285" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-k)" stroke-width="2"/><text x="177.5" y="146.0" font-size="23" fill="var(--c-k)" text-anchor="middle" font-weight="500">source scores s</text><text x="177.5" y="176.0" font-size="23" fill="var(--c-k)" text-anchor="middle" font-weight="500">q · k / √2</text><path d="M320 153 L425 153" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M414.8683290659683 157.28360176539516 L425 153" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M425 153 L414.8683290659683 148.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="445" y="116" width="285" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-a)" stroke-width="2"/><text x="587.5" y="146.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">weights a</text><text x="587.5" y="176.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">sum to one</text><path d="M730 153 L830 153" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M819.8683290659683 157.28360176539516 L830 153" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M830 153 L819.8683290659683 148.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="850" y="116" width="275" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-v)" stroke-width="2"/><text x="987.5" y="146.0" font-size="23" fill="var(--c-v)" text-anchor="middle" font-weight="500">weighted values</text><text x="987.5" y="176.0" font-size="23" fill="var(--c-v)" text-anchor="middle" font-weight="500">message</text><g data-build="1"><text x="35" y="264" font-size="27" fill="var(--c-a)" text-anchor="start" font-weight="500">g = gradient of the attention weights</text><text x="35" y="327" font-size="34" fill="var(--c-a)" text-anchor="start" font-weight="500">∂L/∂sⱼ = aⱼ (gⱼ − Σₖ aₖgₖ)</text></g><g data-build="2"><text x="35" y="407" font-size="27" fill="var(--c-a)" text-anchor="start" font-weight="500">Head 1 score gradients: [−0.044, 0.142, 0.142, −0.120, −0.120]</text></g></svg>