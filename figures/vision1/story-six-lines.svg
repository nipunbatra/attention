<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="The whole ViT in six lines" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>The whole ViT in six lines</title><rect x="50" y="22" width="1040" height="396" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="65" y="54" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace"><tspan fill="#526174" class="py-comment"># Project each image patch to 192 features.</tspan></text><text x="65" y="88" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace">x <tspan fill="#374151" class="py-operator">=</tspan> <tspan fill="#174f9e" class="py-call">patch_embed</tspan><tspan fill="#374151" class="py-operator">(</tspan>image<tspan fill="#374151" class="py-operator">)</tspan>        <tspan fill="#526174" class="py-comment"># (B, 196, 192)</tspan></text><text x="65" y="122" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace"><tspan fill="#526174" class="py-comment"># Add CLS at index 0 and position to every token.</tspan></text><text x="65" y="156" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace">x <tspan fill="#374151" class="py-operator">=</tspan> <tspan fill="#174f9e" class="py-call">prepend_cls</tspan><tspan fill="#374151" class="py-operator">(</tspan>x<tspan fill="#374151" class="py-operator">)</tspan> <tspan fill="#374151" class="py-operator">+</tspan> pos      <tspan fill="#526174" class="py-comment"># (B, 197, 192)</tspan></text><text x="65" y="190" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace"><tspan fill="#526174" class="py-comment"># Update all patch embeddings and CLS in each block.</tspan></text><text x="65" y="224" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace"><tspan fill="#7135a5" class="py-keyword">for</tspan> block <tspan fill="#7135a5" class="py-keyword">in</tspan> blocks<tspan fill="#374151" class="py-operator">:</tspan></text><text x="65" y="258" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace">    x <tspan fill="#374151" class="py-operator">=</tspan> <tspan fill="#174f9e" class="py-call">block</tspan><tspan fill="#374151" class="py-operator">(</tspan>x<tspan fill="#374151" class="py-operator">)</tspan>              <tspan fill="#526174" class="py-comment"># (B, 197, 192)</tspan></text><text x="65" y="292" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace"><tspan fill="#526174" class="py-comment"># Normalize, then extract token 0: final CLS.</tspan></text><text x="65" y="326" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace">h <tspan fill="#374151" class="py-operator">=</tspan> <tspan fill="#174f9e" class="py-call">norm</tspan><tspan fill="#374151" class="py-operator">(</tspan>x<tspan fill="#374151" class="py-operator">)</tspan><tspan fill="#374151" class="py-operator">[</tspan><tspan fill="#374151" class="py-operator">:</tspan><tspan fill="#374151" class="py-operator">,</tspan> <tspan fill="#9a410c" class="py-number">0</tspan><tspan fill="#374151" class="py-operator">]</tspan>             <tspan fill="#526174" class="py-comment"># (B, 192)</tspan></text><text x="65" y="360" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace"><tspan fill="#526174" class="py-comment"># Turn the image summary into 1,000 class scores.</tspan></text><text x="65" y="394" font-size="28" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace">logits <tspan fill="#374151" class="py-operator">=</tspan> <tspan fill="#174f9e" class="py-call">head</tspan><tspan fill="#374151" class="py-operator">(</tspan>h<tspan fill="#374151" class="py-operator">)</tspan>              <tspan fill="#526174" class="py-comment"># (B, 1000)</tspan></text></svg>