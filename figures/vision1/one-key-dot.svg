<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How does P1 get the key [√2,0]?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How does P1 get the key [√2,0]?</title><text x="35" y="95" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">P1 input</text><text x="440" y="95" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">[1, 0, 0, 1]</text><g data-build="1"><text x="35" y="200" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">first key coordinate</text><text x="440" y="200" font-size="29" fill="var(--c-k)" text-anchor="start" font-weight="500">1·√2 + 0·0 + 0·0 + 1·0 = √2</text></g><g data-build="2"><text x="35" y="305" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">second key coordinate</text><text x="440" y="305" font-size="29" fill="var(--c-k)" text-anchor="start" font-weight="500">1·0 + 0·√2 + 0·0 + 1·0 = 0</text></g></svg>