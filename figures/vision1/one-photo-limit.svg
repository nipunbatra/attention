<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Does one correct photograph tell us the accuracy?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Does one correct photograph tell us the accuracy?</title><text x="35" y="70" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">probability of the known breed: 0.957</text><g data-build="1"><text x="35" y="200" font-size="34" fill="var(--ink)" text-anchor="start" font-weight="500">one successful prediction</text></g><g data-build="2"><text x="35" y="330" font-size="32" fill="var(--c-a)" text-anchor="start" font-weight="500">How often does that happen on new photos?</text></g></svg>