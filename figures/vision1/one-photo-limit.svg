<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Does one correct photograph tell us the accuracy?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Does one correct photograph tell us the accuracy?</title><text x="35" y="70" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">probability of the known breed: 0.957</text><g data-build="1"><text x="35" y="200" font-size="34" fill="var(--ink)" text-anchor="start" font-weight="500">one successful prediction</text></g><g data-build="2"><text x="35" y="330" font-size="32" fill="var(--c-a)" text-anchor="start" font-weight="500">How often does that happen on new photos?</text></g></svg>