<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Two softmaxes, two different questions" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Two softmaxes, two different questions</title><text x="35" y="40" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">The same normalization, applied to two different questions</text><rect x="35" y="103" width="325" height="76" rx="5" fill="var(--card)" stroke="var(--c-k)" stroke-width="2"/><text x="197.5" y="134.0" font-size="23" fill="var(--c-k)" text-anchor="middle" font-weight="500">ATTENTION · one query</text><text x="197.5" y="164.0" font-size="23" fill="var(--c-k)" text-anchor="middle" font-weight="500">Which source rows help?</text><path d="M374 141 L452 141" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><path d="M441.8683290659683 145.28360176539516 L452 141" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><path d="M452 141 L441.8683290659683 136.71639823460484" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><rect x="471" y="103" width="650" height="76" rx="5" fill="var(--card)" stroke="var(--c-k)" stroke-width="2"/><text x="796.0" y="134.0" font-size="24" fill="var(--c-k)" text-anchor="middle" font-weight="500">197 scores → softmax over sources → 197 weights</text><text x="796.0" y="164.0" font-size="24" fill="var(--c-k)" text-anchor="middle" font-weight="500">CLS + P1 + P2 + … + P196</text><g data-build="1"><rect x="35" y="276" width="325" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="197.5" y="307.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">CLASSIFIER · one image</text><text x="197.5" y="337.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">Which image label fits?</text><path d="M374 314 L452 314" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M441.8683290659683 318.28360176539513 L452 314" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M452 314 L441.8683290659683 309.71639823460487" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><rect x="471" y="276" width="650" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="796.0" y="307.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">1,000 logits → softmax over labels → probabilities</text><text x="796.0" y="337.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Newfoundland, Persian cat, …</text></g></svg>