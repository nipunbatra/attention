<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="And what were we predicting in the bank example?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>And what were we predicting in the bank example?</title><text x="35" y="38" font-size="26" fill="var(--ink-2)" text-anchor="start" font-weight="500">Part II · continue the river-bank sentence</text><text x="35" y="98" font-size="32" fill="var(--ink)" text-anchor="start" font-weight="500">The fisherman sat beside the river bank</text><text x="35" y="160" font-size="32" fill="var(--ink)" text-anchor="start" font-weight="500">and watched</text><rect x="240" y="120" width="110" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="295.0" y="160" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">the</text><text x="380" y="160" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">___</text><g data-build="1"><path d="M295 190 L295 234" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M290.71639823460487 223.86832906596825 L295 234" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M295 234 L299.28360176539513 223.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="95" y="250" width="400" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="295.0" y="290" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">updated final “the” row</text><text x="295" y="348" font-size="23" fill="var(--ink-2)" text-anchor="middle" font-weight="500">representation after attention</text></g><g data-build="2"><path d="M510 280 L590 280" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M579.8683290659683 284.28360176539513 L590 280" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M590 280 L579.8683290659683 275.71639823460487" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="605" y="250" width="240" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-a)" stroke-width="2"/><text x="725.0" y="290" font-size="28" fill="var(--c-a)" text-anchor="middle" font-weight="500">word scores</text><path d="M858 280 L925 280" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M914.8683290659683 284.28360176539513 L925 280" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M925 280 L914.8683290659683 275.71639823460487" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="940" y="250" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="1030.0" y="290" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">water</text><text x="1030" y="219" font-size="22" fill="var(--ink-2)" text-anchor="middle" font-weight="500">one possible next word</text></g><g data-build="3"><text x="35" y="421" font-size="31" fill="var(--c-v)" text-anchor="start" font-weight="500">Append water, then predict the following word.</text></g></svg>