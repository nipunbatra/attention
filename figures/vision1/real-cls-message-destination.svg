<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Where does the CLS message go?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Where does the CLS message go?</title><text x="35" y="32" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">Same pattern as text: current token row + context update → updated token row.</text><rect x="35" y="85" width="250" height="88" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="160.0" y="122.0" font-size="27" fill="var(--c-v)" text-anchor="middle" font-weight="500">Head 1 message</text><text x="160.0" y="152.0" font-size="27" fill="var(--c-v)" text-anchor="middle" font-weight="500">for CLS · 1 × 64</text><path d="M300 129 L363 129" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M352.8683290659683 133.28360176539516 L363 129" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M363 129 L352.8683290659683 124.71639823460484" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><rect x="379" y="75" width="351" height="108" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="554.5" y="122.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">Combine 3 head messages</text><text x="554.5" y="152.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">then project to 192 features</text><text x="555" y="216" font-size="25" fill="var(--ink-2)" text-anchor="middle" font-weight="500">We open this box next.</text><path d="M744 129 L804 129" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M793.8683290659683 133.28360176539516 L804 129" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M804 129 L793.8683290659683 124.71639823460484" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><rect x="820" y="85" width="300" height="88" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="970.0" y="122.0" font-size="28" fill="var(--c-v)" text-anchor="middle" font-weight="500">CLS context update</text><text x="970.0" y="152.0" font-size="28" fill="var(--c-v)" text-anchor="middle" font-weight="500">1 × 192</text><g data-build="1"><rect x="35" y="292" width="250" height="88" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="160.0" y="329.0" font-size="28" fill="var(--c-q)" text-anchor="middle" font-weight="500">Current CLS row</text><text x="160.0" y="359.0" font-size="28" fill="var(--c-q)" text-anchor="middle" font-weight="500">1 × 192</text><path d="M300 336 L714 336" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M703.8683290659683 340.28360176539513 L714 336" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M714 336 L703.8683290659683 331.71639823460487" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M970 183 L970 253" fill="none" stroke="var(--c-v)" stroke-width="2" stroke-dasharray=""/><path d="M970 253 L750 253" fill="none" stroke="var(--c-v)" stroke-width="2" stroke-dasharray=""/><path d="M750 253 L750 301" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M745.7163982346049 290.8683290659683 L750 301" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M750 301 L754.2836017653951 290.8683290659683" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><circle cx="750" cy="336" r="28" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="750" y="348" font-size="40" fill="var(--ink)" text-anchor="middle" font-weight="500">+</text><path d="M791 336 L815 336" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M804.8683290659683 340.28360176539513 L815 336" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M815 336 L804.8683290659683 331.71639823460487" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><rect x="830" y="292" width="290" height="88" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="975.0" y="329.0" font-size="28" fill="var(--c-q)" text-anchor="middle" font-weight="500">Updated CLS row</text><text x="975.0" y="359.0" font-size="28" fill="var(--c-q)" text-anchor="middle" font-weight="500">1 × 192</text></g><text x="35" y="434" font-size="29" fill="var(--c-q)" text-anchor="start" font-weight="500">The CLS representation changes. It is still the same receiving token.</text></svg>