<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Could we classify the image without CLS?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Could we classify the image without CLS?</title><text x="35" y="55" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">Suppose the final patch rows are:</text><rect x="35" y="120" width="200" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="135.0" y="160" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">[2,0]</text><rect x="310" y="120" width="200" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="410.0" y="160" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">[0,2]</text><rect x="585" y="120" width="200" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="685.0" y="160" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">[1,1]</text><rect x="860" y="120" width="200" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="960.0" y="160" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">[1,1]</text><g data-build="1"><text x="35" y="285" font-size="33" fill="var(--c-v)" text-anchor="start" font-weight="500">mean = ([2,0] + [0,2] + [1,1] + [1,1]) / 4</text></g><g data-build="2"><text x="35" y="405" font-size="34" fill="var(--c-a)" text-anchor="start" font-weight="500">= [1,1] → learned classifier → class scores</text></g></svg>