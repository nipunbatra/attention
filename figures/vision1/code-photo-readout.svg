<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Run the stack and read one CLS per image" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Run the stack and read one CLS per image</title><rect x="20" y="23" width="690" height="328" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="55" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">self.blocks = nn.ModuleList([Block() for _ in range(12)])</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="89" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">self.norm = nn.LayerNorm(192, eps=1e-6)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="123" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">self.head = nn.Linear(192, num_classes)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="157" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500"></text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="191" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">rows = self.embed(x)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="225" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">for block in self.blocks:</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="259" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">    rows = block(rows)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="293" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">summary = self.norm(rows)[:, 0]</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="327" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">return self.head(summary)</text><rect x="782" y="24" width="330" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="947.0" y="55.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">12 distinct blocks</text><text x="947.0" y="85.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 197 × 192</text><path d="M947 108 L947 140" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M942.7163982346049 129.86832906596825 L947 140" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M947 140 L951.2836017653951 129.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="782" y="153" width="330" height="76" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="947.0" y="184.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">Final norm; select row 0</text><text x="947.0" y="214.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">B × 192</text><path d="M947 235 L947 266" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M942.7163982346049 255.86832906596825 L947 266" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M947 266 L951.2836017653951 255.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="782" y="278" width="330" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="947.0" y="309.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Linear(192, 1000)</text><text x="947.0" y="339.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 1000 scores</text><text x="947" y="408" font-size="21" fill="var(--ink-2)" text-anchor="middle" font-weight="500">num_classes = 1000 for this architecture</text></svg>