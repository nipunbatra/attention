<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How would we check whether the classifier learned?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>How would we check whether the classifier learned?</title><text x="35" y="48" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Before fitting: separate training, validation and test images</text><rect x="35" y="108" width="330" height="74" rx="6" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="200.0" y="138.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">TRAIN</text><text x="200.0" y="168.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">update weights</text><rect x="415" y="108" width="330" height="74" rx="6" fill="var(--transparent)" stroke="var(--neutral)" stroke-width="2"/><text x="580.0" y="138.0" font-size="23" fill="var(--neutral)" text-anchor="middle" font-weight="500">VALIDATION</text><text x="580.0" y="168.0" font-size="23" fill="var(--neutral)" text-anchor="middle" font-weight="500">choose settings</text><rect x="795" y="108" width="330" height="74" rx="6" fill="var(--transparent)" stroke="var(--vision)" stroke-width="2"/><text x="960.0" y="138.0" font-size="23" fill="var(--vision)" text-anchor="middle" font-weight="500">TEST</text><text x="960.0" y="168.0" font-size="23" fill="var(--vision)" text-anchor="middle" font-weight="500">final held-out check</text><g data-build="1"><text x="35" y="270" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Inspect: dog → dog    dog → cat    cat → dog    cat → cat</text></g><g data-build="2"><text x="35" y="345" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">Accuracy = correct predictions / number of test images</text></g><g data-build="2"><text x="35" y="417" font-size="25" fill="var(--ink)" text-anchor="start" font-weight="500">Keep mistakes beside correct examples. A confident score can still be wrong.</text></g></svg>