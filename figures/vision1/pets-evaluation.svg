<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How would we check whether the classifier learned?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How would we check whether the classifier learned?</title><text x="35" y="48" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Before fitting: separate training, validation and test images</text><rect x="35" y="108" width="330" height="74" rx="6" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="200.0" y="138.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">TRAIN</text><text x="200.0" y="168.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">update weights</text><rect x="415" y="108" width="330" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-v)" stroke-width="2"/><text x="580.0" y="138.0" font-size="23" fill="var(--c-v)" text-anchor="middle" font-weight="500">VALIDATION</text><text x="580.0" y="168.0" font-size="23" fill="var(--c-v)" text-anchor="middle" font-weight="500">choose settings</text><rect x="795" y="108" width="330" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-q)" stroke-width="2"/><text x="960.0" y="138.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">TEST</text><text x="960.0" y="168.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">final held-out check</text><g data-build="1"><text x="35" y="270" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Inspect: dog → dog    dog → cat    cat → dog    cat → cat</text></g><g data-build="2"><text x="35" y="345" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">Accuracy = correct predictions / number of test images</text></g><g data-build="2"><text x="35" y="417" font-size="25" fill="var(--c-a)" text-anchor="start" font-weight="500">Keep mistakes beside correct examples. A confident score can still be wrong.</text></g></svg>