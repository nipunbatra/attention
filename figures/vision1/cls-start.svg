<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Where does CLS come from?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Where does CLS come from?</title><text x="35" y="65" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">Four patch rows</text><rect x="35" y="125" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="125.0" y="165" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">P1</text><rect x="310" y="125" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="400.0" y="165" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">P2</text><rect x="585" y="125" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="675.0" y="165" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">P3</text><rect x="860" y="125" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="950.0" y="165" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">P4</text><g data-build="1"><rect x="35" y="285" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-q)" stroke-width="2"/><text x="125.0" y="325" font-size="28" fill="var(--c-q)" text-anchor="middle" font-weight="500">CLS</text><text x="260" y="325" font-size="31" fill="var(--c-q)" text-anchor="start" font-weight="500">one learned vector, copied for every image</text></g></svg>