<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Where does CLS come from?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Where does CLS come from?</title><text x="35" y="65" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">Four patch rows</text><rect x="35" y="125" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="125.0" y="165" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">P1</text><rect x="310" y="125" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="400.0" y="165" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">P2</text><rect x="585" y="125" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="675.0" y="165" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">P3</text><rect x="860" y="125" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-e)" stroke-width="2"/><text x="950.0" y="165" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">P4</text><g data-build="1"><rect x="35" y="285" width="180" height="60" rx="4" fill="var(--transparent)" stroke="var(--c-q)" stroke-width="2"/><text x="125.0" y="325" font-size="28" fill="var(--c-q)" text-anchor="middle" font-weight="500">CLS</text><text x="260" y="325" font-size="31" fill="var(--c-q)" text-anchor="start" font-weight="500">one learned vector, copied for every image</text></g></svg>