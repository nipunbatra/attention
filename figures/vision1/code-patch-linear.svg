<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Implementation 1: extract patches, then use Linear" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Implementation 1: extract patches, then use Linear</title><rect x="20" y="36" width="740" height="318" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="68" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">linear = nn.Linear(768, 192, bias=True)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="105" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500"></text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="142" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">def project_with_linear(images, linear):</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="179" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">    patches = F.unfold(images, kernel_size=16, stride=16)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="216" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">    # B × 768 × 196: one flattened patch per column</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="253" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">    patches = patches.transpose(1, 2)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="290" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">    # B × 196 × 768: one flattened patch per row</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="327" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">    return linear(patches)  # B × 196 × 192</text><text x="785" y="36" font-size="24" fill="var(--c-q)" text-anchor="start" font-weight="500">images · B × 3 × 224 × 224</text><path d="M951 55 L951 83" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M946.7163982346049 72.86832906596827 L951 83" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><path d="M951 83 L955.2836017653951 72.86832906596827" fill="none" stroke="var(--c-q)" stroke-width="2.5" stroke-dasharray=""/><rect x="790" y="95" width="330" height="76" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="955.0" y="126.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">unfold: flattened columns</text><text x="955.0" y="156.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">B × 768 × 196</text><path d="M951 181 L951 202" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M946.7163982346049 191.86832906596825 L951 202" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M951 202 L955.2836017653951 191.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="790" y="214" width="330" height="76" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="955.0" y="245.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">transpose: patch rows</text><text x="955.0" y="275.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">B × 196 × 768</text><path d="M951 299 L951 319" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M946.7163982346049 308.8683290659683 L951 319" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M951 319 L955.2836017653951 308.8683290659683" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><rect x="790" y="331" width="330" height="76" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="955.0" y="362.0" font-size="23" fill="var(--c-v)" text-anchor="middle" font-weight="500">Linear: project each row</text><text x="955.0" y="392.0" font-size="23" fill="var(--c-v)" text-anchor="middle" font-weight="500">B × 196 × 192</text><text x="35" y="401" font-size="23" fill="var(--ink-2)" text-anchor="start" font-weight="500">768 numbers per row: all R pixels, then G, then B.</text></svg>