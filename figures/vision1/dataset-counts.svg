<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How many images and classes are there?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>How many images and classes are there?</title><text x="35" y="90" font-size="62" fill="var(--c-e)" text-anchor="start" font-weight="500">7,349</text><text x="35" y="145" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">photographs</text><g data-build="1"><path d="M35 185 L610 185" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray=""/><text x="35" y="270" font-size="32" fill="var(--c-e)" text-anchor="start" font-weight="500">3,680 train / validation</text><text x="35" y="350" font-size="32" fill="var(--c-e)" text-anchor="start" font-weight="500">3,669 test</text></g><g data-build="2"><text x="730" y="90" font-size="45" fill="var(--c-e)" text-anchor="start" font-weight="500">2 species</text><text x="730" y="145" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">cat or dog</text></g><g data-build="3"><text x="730" y="275" font-size="45" fill="var(--c-k)" text-anchor="start" font-weight="500">37 breeds</text><text x="730" y="330" font-size="28" fill="var(--c-k)" text-anchor="start" font-weight="500">Persian, Pug, …</text></g></svg>