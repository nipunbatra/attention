<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How do 768 pixel values become 192 features?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>How do 768 pixel values become 192 features?</title><rect x="30" y="140" width="230" height="100" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="145.0" y="183.0" font-size="32" fill="var(--vision)" text-anchor="middle" font-weight="500">xᵢ</text><text x="145.0" y="213.0" font-size="32" fill="var(--vision)" text-anchor="middle" font-weight="500">768 values</text><path d="M275 190 L354 190" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M343.8683290659683 194.28360176539516 L354 190" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M354 190 L343.8683290659683 185.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="370" y="117" width="385" height="145" rx="5" fill="var(--t-special)" stroke="var(--special)" stroke-width="2"/><text x="562.5" y="167.5" font-size="28" fill="var(--special)" text-anchor="middle" font-weight="500">Shared learned projection</text><text x="562.5" y="197.5" font-size="28" fill="var(--special)" text-anchor="middle" font-weight="500">W_E: 768 × 192</text><text x="562.5" y="227.5" font-size="28" fill="var(--special)" text-anchor="middle" font-weight="500">b_E: 192</text><path d="M770 190 L851 190" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M840.8683290659683 194.28360176539516 L851 190" fill="n