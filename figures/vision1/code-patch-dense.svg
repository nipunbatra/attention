<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="See the patch projection as a layer of neurons" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>See the patch projection as a layer of neurons</title><text x="35" y="32" font-size="29" fill="var(--c-e)" text-anchor="start" font-weight="500">One affine layer: nn.Linear(768, 192, bias=True)</text><text x="142" y="76" font-size="26" fill="var(--c-q)" text-anchor="middle" font-weight="500">768 inputs</text><text x="459" y="76" font-size="26" fill="var(--c-v)" text-anchor="middle" font-weight="500">192 outputs</text><path d="M168 117 L434 117" fill="none" stroke="var(--c-v)" stroke-width="2" stroke-dasharray=""/><path d="M168 117 L434 183" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray=""/><path d="M168 117 L434 302" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray=""/><path d="M168 183 L434 117" fill="none" stroke="var(--c-v)" stroke-width="2" stroke-dasharray=""/><path d="M168 183 L434 183" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray=""/><path d="M168 183 L434 302" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray=""/><path d="M168 302 L434 117" fill="none" stroke="var(--c-v)" stroke-width="2" stroke-dasharray=""/><path d="M168 302 L434 183" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray=""/><path d="M168 302 L434 302" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray=""/><text x="283" y="100" font-size="21" fill="var(--c-v)" text-anchor="middle" font-weight="500">w₁,₁, w₁,₂, …, w₁,₇₆₈</text><circle cx="142" cy="117" r="27" fill="var(--card)" stroke="var(--c-q)" stroke-width="2"/><text x="142" y="124" font-size="21" fill="var(--c-q)" text-anchor="middle" font-weight="500">x₁</text><circle cx="142" cy="183" r="27" fill="var(--card)" stroke="var(--c-q)" stroke-width="2"/><text x="142" y="190" font-size="21" fill="var(--c-q)" text-anchor="middle" font-weight="500">x₂</text><circle cx="142" cy="302" r="27" fill="var(--card)" stroke="var(--c-q)" stroke-width="2"/><text x="142" y="309" font-size="21" fill="var(--c-q)" text-anchor="middle" font-weight="500">x₇₆₈</text><circle cx="459" cy="117" r="27" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="459" y="124" font-size="21" fill="var(--c-v)" text-anchor="middle" font-weight="500">c₁</text><circle cx="459" cy="183" r="27" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="459" y="190" font-size="21" fill="var(--c-v)" text-anchor="middle" font-weight="500">c₂</text><circle cx="459" cy="302" r="27" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="459" y="309" font-size="21" fill="var(--c-v)" text-anchor="middle" font-weight="500">c₁₉₂</text><text x="142" y="249" font-size="32" fill="var(--c-q)" text-anchor="middle" font-weight="500">⋮</text><text x="459" y="249" font-size="32" fill="var(--c-v)" text-anchor="middle" font-weight="500">⋮</text><path d="M551 117 L491 117" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><path d="M501.1316709340317 112.71639823460484 L491 117" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><path d="M491 117 L501.1316709340317 121.28360176539515" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><text x="568" y="124" font-size="25" fill="var(--c-k)" text-anchor="start" font-weight="500">+ b₁</text><text x="680" y="100" font-size="27" fill="var(--c-v)" text-anchor="start" font-weight="500">Open just the first output neuron</text><text x="680" y="157" font-size="30" fill="var(--c-v)" text-anchor="start" font-weight="500">c₁ = w₁,₁x₁ + w₁,₂x₂ + …</text><text x="748" y="198" font-size="30" fill="var(--c-v)" text-anchor="start" font-weight="500">+ w₁,₇₆₈x₇₆₈ + b₁</text><text x="680" y="260" font-size="27" fill="var(--ink)" text-anchor="start" font-weight="500">Every output has its own</text><text x="680" y="301" font-size="30" fill="var(--c-k)" text-anchor="start" font-weight="500">768 weights + 1 bias.</text><path d="M35 343 L1125 343" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray=""/><text x="35" y="382" font-size="31" fill="var(--c-e)" text-anchor="start" font-weight="500">192 × 768 weights + 192 biases = 147,648 parameters</text><text x="35" y="427" font-size="23" fill="var(--ink-2)" text-anchor="start" font-weight="500">Patch projection: no hidden layer or activation. Later MLP: Linear → GELU → Linear.</text></svg>