<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 486" role="img" aria-label="Join the head messages and project back to 192" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Join the head messages and project back to 192</title><rect x="20" y="13" width="1090" height="133" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="35" y="45" font-size="24" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace">joined <tspan fill="#374151" class="py-operator">=</tspan> messages<tspan fill="#374151" class="py-operator">.</tspan><tspan fill="#174f9e" class="py-call">transpose</tspan><tspan fill="#374151" class="py-operator">(</tspan><tspan fill="#9a410c" class="py-number">1</tspan><tspan fill="#374151" class="py-operator">,</tspan> <tspan fill="#9a410c" class="py-number">2</tspan><tspan fill="#374151" class="py-operator">)</tspan>     <tspan fill="#526174" class="py-comment"># B, 197, 3, 64</tspan></text><text x="35" y="82" font-size="24" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace">joined <tspan fill="#374151" class="py-operator">=</tspan> joined<tspan fill="#374151" class="py-operator">.</tspan><tspan fill="#174f9e" class="py-call">reshape</tspan><tspan fill="#374151" class="py-operator">(</tspan>B<tspan fill="#374151" class="py-operator">,</tspan> N<tspan fill="#374151" class="py-operator">,</tspan> D<tspan fill="#374151" class="py-operator">)</tspan>      <tspan fill="#526174" class="py-comment"># B, 197, 192</tspan></text><text x="35" y="119" font-size="24" fill="#17202a" xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace"><tspan fill="#7135a5" class="py-keyword">return</tspan> self<tspan fill="#374151" class="py-operator">.</tspan><tspan fill="#174f9e" class="py-call">proj</tspan><tspan fill="#374151" class="py-operator">(</tspan>joined<tspan fill="#374151" class="py-operator">)</tspan>             <tspan fill="#526174" class="py-comment"># B, 197, 192</tspan></text><rect x="35.0" y="338" width="323.3333333333333" height="80" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="196.66666666666666" y="371.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">Three messages per row</text><text x="196.66666666666666" y="401.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">3 × 64</text><path d="M365.3333333333333 378 L390.3333333333333 378" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M380.2016623993016 382.28360176539513 L390.3333333333333 378" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M390.3333333333333 378 L380.2016623993016 373.71639823460487" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><rect x="398.3333333333333" y="338" width="323.3333333333333" height="80" rx="5" fill="var(--card)" stroke="var(--c-v)" stroke-width="2"/><text x="560.0" y="371.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">Concatenate features</text><text x="560.0" y="401.0" font-size="25" fill="var(--c-v)" text-anchor="middle" font-weight="500">192</text><path d="M728.6666666666666 378 L753.6666666666666 378" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M743.5349957326349 382.28360176539513 L753.6666666666666 378" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""/><path d="M753.6666666666666 378 L743.5349957326349 373.71639823460487" fill="none" stroke="var(--c-v)" stroke-width="2.5" stroke-dasharray=""