<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Keys choose the source; values supply the message" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Keys choose the source; values supply the message</title><text x="35" y="40" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">Keep the receiver’s query fixed; change one source.</text><rect x="35" y="105" width="310" height="76" rx="5" fill="var(--card)" stroke="var(--c-k)" stroke-width="2"/><text x="190.0" y="136.0" font-size="24" fill="var(--c-k)" text-anchor="middle" font-weight="500">Change its key</text><text x="190.0" y="166.0" font-size="24" fill="var(--c-k)" text-anchor="middle" font-weight="500">What matches?</text><path d="M357 143 L435 143" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><path d="M424.8683290659683 147.28360176539516 L435 143" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><path d="M435 143 L424.8683290659683 138.71639823460484" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><rect x="451" y="105" width="300" height="76" rx="5" fill="var(--card)" stroke="var(--c-k)" stroke-width="2"/><text x="601.0" y="136.0" font-size="23" fill="var(--c-k)" text-anchor="middle" font-weight="500">Different scores</text><text x="601.0" y="166.0" font-size="23" fill="var(--c-k)" text-anchor="middle" font-weight="500">different source weights</text><path d="M763 143 L830 143" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><path d="M819.8683290659683 147.28360176539516 L830 143" fill="none" stroke="var(--c-k)" stroke-width="2.5" stroke-dasharray=""/><path d="M830 143 L819.8683290659683 138.71639823460484" fill="none" stroke="var(--c-k)" s