<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Where does the 0.229 beside P1 come from?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Where does the 0.229 beside P1 come from?</title><text x="35" y="95" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">all exponentials</text><text x="440" y="95" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">[1, e, e, e, e]</text><g data-build="1"><text x="35" y="200" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">their sum</text><text x="440" y="200" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">1 + 4e = 11.873</text></g><g data-build="2"><text x="35" y="305" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">P1’s share</text><text x="440" y="305" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">e / (1 + 4e) = 0.229</text></g></svg>