<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Where does the 0.229 beside P1 come from?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Where does the 0.229 beside P1 come from?</title><text x="35" y="95" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">all exponentials</text><text x="440" y="95" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">[1, e, e, e, e]</text><g data-build="1"><text x="35" y="200" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">their sum</text><text x="440" y="200" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">1 + 4e = 11.873</text></g><g data-build="2"><text x="35" y="305" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">P1’s share</text><text x="440" y="305" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">e / (1 + 4e) = 0.229</text></g></svg>