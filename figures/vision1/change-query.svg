<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What if the query cared only about ink?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>What if the query cared only about ink?</title><text x="35" y="70" font-size="30" fill="var(--ink-2)" text-anchor="start" font-weight="500">same keys and values</text><text x="35" y="150" font-size="35" fill="var(--c-q)" text-anchor="start" font-weight="500">query: [1,1] → [1,0]</text><g data-build="1"><text x="35" y="245" font-size="35" fill="var(--c-a)" text-anchor="start" font-weight="500">scores: [0,1,1,0,0]</text></g><g data-build="2"><text x="35" y="330" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">weights: [0.119, 0.322, 0.322, 0.119, 0.119]</text></g><g data-build="3"><text x="35" y="420" font-size="32" fill="var(--c-v)" text-anchor="start" font-weight="500">message: [0.644, 0.237]</text></g></svg>