<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What if the query cared only about ink?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>What if the query cared only about ink?</title><text x="35" y="70" font-size="30" fill="var(--ink-2)" text-anchor="start" font-weight="500">same keys and values</text><text x="35" y="150" font-size="35" fill="var(--c-q)" text-anchor="start" font-weight="500">query: [1,1] → [1,0]</text><g data-build="1"><text x="35" y="245" font-size="35" fill="var(--c-a)" text-anchor="start" font-weight="500">scores: [0,1,1,0,0]</text></g><g data-build="2"><text x="35" y="330" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">weights: [0.119, 0.322, 0.322, 0.119, 0.119]</text></g><g data-build="3"><text x="35" y="420" font-size="32" fill="var(--c-v)" text-anchor="start" font-weight="500">message: [0.644, 0.237]</text></g></svg>