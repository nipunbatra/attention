<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Your turn: trace every important shape" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Your turn: trace every important shape</title><text x="30" y="70" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">RGB image: 128 × 128</text><text x="30" y="155" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">patch: 16 × 16      D = 64      heads = 4</text><g data-build="1"><text x="30" y="255" font-size="32" fill="var(--c-e)" text-anchor="start" font-weight="500">64 patch rows + CLS → E is 65 × 64</text></g><g data-build="2"><text x="30" y="340" font-size="29" fill="var(--c-q)" text-anchor="start" font-weight="500">Q per head: 65 × 16      A per head: 65 × 65</text></g><g data-build="3"><text x="30" y="423" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">W_patch: 768 × 64      W_O: 64 × 64</text></g></svg>