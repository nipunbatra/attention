<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Your turn: trace every important shape" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Your turn: trace every important shape</title><text x="30" y="70" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">RGB image: 128 × 128</text><text x="30" y="155" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">patch: 16 × 16      D = 64      heads = 4</text><g data-build="1"><text x="30" y="255" font-size="32" fill="var(--c-e)" text-anchor="start" font-weight="500">64 patch rows + CLS → E is 65 × 64</text></g><g data-build="2"><text x="30" y="340" font-size="29" fill="var(--c-q)" text-anchor="start" font-weight="500">Q per head: 65 × 16      A per head: 65 × 65</text></g><g data-build="3"><text x="30" y="423" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">W_patch: 768 × 64      W_O: 64 × 64</text></g></svg>