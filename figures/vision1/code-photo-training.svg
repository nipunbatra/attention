<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Connect the loss diagram to one training step" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Connect the loss diagram to one training step</title><rect x="20" y="23" width="690" height="226" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="55" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">model.train()</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="89" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">optimizer.zero_grad(set_to_none=True)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="123" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">logits = model(images)                   # B, 1000</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="157" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">loss = F.cross_entropy(logits, labels)    # labels: B</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="191" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">loss.backward()</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="225" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">optimizer.step()</text><rect x="790" y="31" width="310" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="945.0" y="62.0" font-size="21" fill="var(--c-e)" text-anchor="middle" font-weight="500">Images B × 3 × 224 × 224</text><text x="945.0" y="92.0" font-size="21" fill="var(--c-e)" text-anchor="middle" font-weight="500">labels B</text><path d="M945 115 L945 147" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M940.7163982346049 136.86832906596825 L945 147" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M945 147 L949.2836017653951 136.86832906596825" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="790" y="161" width="310" height="76" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="945.0" y="192.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">Forward → cross-entropy</text><text x="945.0" y="222.0" font-size="23" fill="var(--c-a)" text-anchor="middle" font-weight="500">one scalar loss</text><path d="M945 244 L945 276" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M940.7163982346049 265.8683290659683 L945 276" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><path d="M945 276 L949.2836017653951 265.8683290659683" fill="none" stroke="var(--c-a)" stroke-width="2.5" stroke-dasharray=""/><rect x="790" y="289" width="310" height="76" rx="5" fill="var(--card)" stroke="var(--c-a)" stroke-width="2"/><text x="945.0" y="320.0" font-size="22" fill="var(--c-a)" text-anchor="middle" font-weight="500">backward: gradients</text><text x="945.0" y="350.0" font-size="22" fill="var(--c-a)" text-anchor="middle" font-weight="500">step: parameters change</text></svg>