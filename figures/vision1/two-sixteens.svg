<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="These two 16s mean different things" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>These two 16s mean different things</title><text x="35" y="70" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">2 × 2 × 1 pixels per patch</text><text x="35" y="155" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">16 patches per image</text><g data-build="1"><text x="35" y="270" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">D = 16 numbers per patch row</text></g><g data-build="2"><text x="35" y="395" font-size="37" fill="var(--ink)" text-anchor="start" font-weight="500">[batch, 16 rows, 16 coordinates]</text></g></svg>