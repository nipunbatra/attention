<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="These patches look the same. How do we tell them apart?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>These patches look the same. How do we tell them apart?</title><rect x="50" y="75" width="280" height="150" rx="4" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="190" y="125" font-size="34" fill="var(--c-e)" text-anchor="middle" font-weight="500">P1</text><text x="190" y="185" font-size="32" fill="var(--c-e)" text-anchor="middle" font-weight="500">[1,0,0,1]</text><rect x="765" y="75" width="280" height="150" rx="4" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="905" y="125" font-size="34" fill="var(--c-e)" text-anchor="middle" font-weight="500">P2</text><text x="905" y="185" font-size="32" fill="var(--c-e)" text-anchor="middle" font-weight="500">[1,0,0,1]</text><g data-build="1"><text x="50" y="310" font-size="31" fill="var(--ink-2)" text-anchor="start" font-weight="500">+ [0,0,0,0]</text><text x="765" y="310" font-size="31" fill="var(--ink-2)" text-anchor="start" font-weight="500">+ [0,0,1,0]</text></g><g data-build="2"><text x="50" y="410" font-size="32" fill="var(--c-e)" text-anchor="start" font-weight="500">= [1,0,0,1]</text><text x="765" y="410" font-size="32" fill="var(--c-e)" text-anchor="start" font-weight="500">= [1,0,1,1]</text></g></svg>