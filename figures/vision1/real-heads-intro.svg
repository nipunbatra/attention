<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="From one completed head to three parallel heads" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>From one completed head to three parallel heads</title><text x="35" y="65" font-size="38" fill="var(--mixing)" text-anchor="start" font-weight="600">Head 1 is complete.</text><text x="35" y="127" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Q and K → source weights → mix V → a message for every row.</text><rect x="35" y="190" width="485" height="102" rx="5" fill="var(--transparent)" stroke="var(--mixing)" stroke-width="2"/><text x="277.5" y="234.0" font-size="29" fill="var(--mixing)" text-anchor="middle" font-weight="500">197 input rows</text><text x="277.5" y="264.0" font-size="29" fill="var(--mixing)" text-anchor="middle" font-weight="500">197 messages, each 64 features</text><path d="M546 241 L615 241" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M604.8683290659683 245.28360176539516 L615 241" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M615 241 L604.8683290659683 236.71639823460484" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="644" y="190" width="480" height="102" rx="5" fill="var(--transparent)" stroke="var(--mixing)" stroke-width="2"/><text x="884.0" y="234.0" font-size="29" fill="var(--mixing)" text-anchor="middle" font-weight="500">Now use three heads in parallel</text><text x="884.0" y="264.0" font-size="29" fill="var(--mixing)" text-anchor="middle" font-weight="500">Each reads the same input rows</text><text x="35" y="370" font-size="33" fill="var(--ink)" text-anchor="start" font-weight="500">First combine their messages. Then continue to the MLP.</text></svg>