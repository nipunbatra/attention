<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Read the RGB values of each pixel" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Read the RGB values of each pixel</title><rect x="50" y="100" width="100" height="100" fill="rgb(255,0,0)" stroke="var(--line)" stroke-width="2"/><text x="100.0" y="164.0" font-size="28" fill="var(--card)" text-anchor="middle" font-weight="500">A</text><rect x="150" y="100" width="100" height="100" fill="rgb(0,255,0)" stroke="var(--line)" stroke-width="2"/><text x="200.0" y="164.0" font-size="28" fill="var(--ink)" text-anchor="middle" font-weight="500">B</text><rect x="50" y="200" width="100" height="100" fill="rgb(0,0,255)" stroke="var(--line)" stroke-width="2"/><text x="100.0" y="264.0" font-size="28" fill="var(--card)" text-anchor="middle" font-weight="500">C</text><rect x="150" y="200" width="100" height="100" fill="rgb(255,255,255)" stroke="var(--line)" stroke-width="2"/><text x="200.0" y="264.0" font-size="28" fill="var(--ink)" text-anchor="middle" font-weight="500">D</text><text x="150" y="350" font-size="31" fill="var(--c-e)" text-anchor="middle" font-weight="500">2 × 2 × 3</text><text x="395" y="50" font-size="28" fill="var(--ink-2)" text-anchor="start" font-weight="500">pixel</text><text x="610" y="50" font-size="28" fill="var(--ink-2)" text-anchor="start" font-weight="500">R</text><text x="780" y="50" font-size="28" fill="var(--ink-2)" text-anchor="start" font-weight="500">G</text><text x="950" y="50" font-size="28" fill="var(--ink-2)" text-anchor="start" font-weight="500">B</text><text x="395" y="115" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">A</text><text x="610" y="115" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">1</text><text x="780" y="115" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">0</text><text x="950" y="115" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">0</text><g data-build="1"><text x="395" y="182" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">B</text><text x="610" y="182" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">0</text><text x="780" y="182" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">1</text><text x="950" y="182" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">0</text></g><g data-build="2"><text x="395" y="249" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">C</text><text x="610" y="249" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">0</text><text x="780" y="249" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">0</text><text x="950" y="249" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">1</text></g><g data-build="3"><text x="395" y="316" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">D</text><text x="610" y="316" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">1</text><text x="780" y="316" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">1</text><text x="950" y="316" font-size="33" fill="var(--c-e)" text-anchor="start" font-weight="500">1</text></g><g data-build="3"><text x="395" y="410" font-size="32" fill="var(--c-e)" text-anchor="start" font-weight="500">4 pixels × 3 channels = 12 values</text></g></svg>