<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="The class loss sends a gradient into the final CLS row" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>The class loss sends a gradient into the final CLS row</title><text x="35" y="52" font-size="28" fill="var(--ink)" text-anchor="start" font-weight="500">In our worksheet, only CLS coordinate 1 scores the classes.</text><rect x="35" y="116" width="250" height="74" rx="6" fill="var(--transparent)" stroke="var(--c-q)" stroke-width="2"/><text x="160.0" y="146.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">CLS coordinate u₁</text><text x="160.0" y="176.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">−0.224</text><path d="M285 153 L465 99" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M456.5265031760678 106.01426058646322 L465 99" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M465 99 L454.06473535627873 97.8083678538328" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><text x="365" y="105" font-size="24" fill="var(--ink-2)" text-anchor="middle" font-weight="500">× (−4)</text><rect x="485" y="61" width="250" height="74" rx="6" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="610.0" y="91.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">Across score</text><text x="610.0" y="121.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">gradient −0.143</text><path d="M285 153 L465 241" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M454.01646398605044 240.39838830607016 L465 241" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M465 241 L457.77926657972205 232.70174663719638" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><text x="365" y="250" font-size="24" fill="var(--ink-2)" text-anchor="middle" font-weight="500">× 4</text><rect x="485" y="203" width="250" height="74" rx="6" fill="var(--t-e)" stroke="var(--c-e)" stroke-width="2"/><text x="610.0" y="233.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">Down score</text><text x="610.0" y="263.0" font-size="23" fill="var(--c-e)" text-anchor="middle" font-weight="500">gradient 0.143</text><g data-build="1"><text x="795" y="138" font-size="29" fill="var(--c-a)" text-anchor="start" font-weight="500">Add both paths</text><text x="795" y="199" font-size="27" fill="var(--c-a)" text-anchor="start" font-weight="500">(−4) × −0.143</text><text x="795" y="245" font-size="27" fill="var(--c-a)" text-anchor="start" font-weight="500">+ 4 × 0.143</text><text x="795" y="300" font-size="34" fill="var(--c-a)" text-anchor="start" font-weight="500">= 1.144</text></g><g data-build="1"><text x="35" y="412" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">Gradient of the final CLS row: [1.144, 0.000, 0.000, 0.000]</text></g></svg>