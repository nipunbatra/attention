<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Which assumptions are built into the architecture?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Which assumptions are built into the architecture?</title><rect x="30" y="20" width="250" height="80" rx="0" fill="var(--t-e)" stroke="var(--line)" stroke-width="2"/><text x="50" y="69" font-size="29" fill="var(--neutral)" text-anchor="start" font-weight="650"></text><rect x="280" y="20" width="395" height="80" rx="0" fill="var(--t-e)" stroke="var(--line)" stroke-width="2"/><text x="300" y="69" font-size="29" fill="var(--mixing)" text-anchor="start" font-weight="650">CNN</text><rect x="675" y="20" width="455" height="80" rx="0" fill="var(--t-e)" stroke="var(--line)" stroke-width="2"/><text x="695" y="69" font-size="29" fill="var(--vision)" text-anchor="start" font-weight="650">ViT</text><rect x="30" y="100" width="250" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="50" y="149" font-size="25" fill="var(--neutral)" text-anchor="start" font-weight="500">Basic units</text><rect x="280" y="100" width="395" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="300" y="149" font-size="25" fill="var(--mixing)" text-anchor="start" font-weight="500">Local feature maps</text><rect x="675" y="100" width="455" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="695" y="149" font-size="25" fill="var(--vision)" text-anchor="start" font-weight="500">Patch-token rows</text><rect x="30" y="180" width="250" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="50" y="229" font-size="25" fill="var(--neutral)" text-anchor="start" font-weight="500">Mixing rule</text><rect x="280" y="180" width="395" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="300" y="229" font-size="25" fill="var(--mixing)" text-anchor="start" font-weight="500">Shared local convolution</text><rect x="675" y="180" width="455" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="695" y="229" font-size="25" fill="var(--vision)" text-anchor="start" font-weight="500">Content-dependent attention</text><rect x="30" y="260" width="250" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="50" y="309" font-size="25" fill="var(--neutral)" text-anchor="start" font-weight="500">Locality</text><rect x="280" y="260" width="395" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="300" y="309" font-size="25" fill="var(--mixing)" text-anchor="start" font-weight="500">Built into each filter</text><rect x="675" y="260" width="455" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="695" y="309" font-size="25" fill="var(--vision)" text-anchor="start" font-weight="500">Less spatial structure built in</text><rect x="30" y="340" width="250" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="50" y="389" font-size="25" fill="var(--neutral)" text-anchor="start" font-weight="500">Position</text><rect x="280" y="340" width="395" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="300" y="389" font-size="25" fill="var(--mixing)" text-anchor="start" font-weight="500">Grid structure</text><rect x="675" y="340" width="455" height="80" rx="0" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text x="695" y="389" font-size="25" fill="var(--vision)" text-