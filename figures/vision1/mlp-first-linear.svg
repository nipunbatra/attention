<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How does the MLP make a wider row?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How does the MLP make a wider row?</title><text x="35" y="65" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">input: [1, −1]</text><text x="520" y="130" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">1</text><text x="585" y="130" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">0</text><text x="650" y="130" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">1</text><text x="520" y="179" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">0</text><text x="585" y="179" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">1</text><text x="650" y="179" font-size="28" fill="var(--c-e)" text-anchor="middle" font-weight="500">1</text><path d="M496.5 99 H487.5 V193 H496.5 M673.5 99 H682.5 V193 H673.5" stroke="var(--c-e)" fill="none" stroke-width="2"/><g data-build="1"><text x="35" y="275" font-size="36" fill="var(--c-v)" text-anchor="start" font-weight="500">[1, −1] W₁ = [1, −1, 0]</text></g><g data-build="2"><text x="35" y="405" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">2 coordinates → 3 hidden coordinates</text></g></svg>