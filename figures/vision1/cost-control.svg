<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Can you predict the cost before changing the resolution?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Can you predict the cost before changing the resolution?</title><text x="30" y="75" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">image width / height</text><text x="600" y="75" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">patch width / height</text><text x="30" y="165" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">Predict the token count first.</text></svg>