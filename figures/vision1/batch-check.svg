<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="A quick check before training" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>A quick check before training</title><text x="35" y="60" font-size="33" fill="var(--ink)" text-anchor="start" font-weight="500">First output row for image A</text><text x="460" y="145" font-size="30" fill="var(--ink-2)" text-anchor="start" font-weight="500">A alone</text><text x="820" y="145" font-size="30" fill="var(--ink-2)" text-anchor="start" font-weight="500">A beside B</text><g data-build="1"><text x="35" y="260" font-size="30" fill="var(--c-e)" text-anchor="start" font-weight="500">correct layout</text><text x="460" y="260" font-size="37" fill="var(--c-e)" text-anchor="start" font-weight="500">[4,0]</text><text x="820" y="260" font-size="37" fill="var(--c-e)" text-anchor="start" font-weight="500">[4,0]</text></g><g data-build="2"><text x="35" y="360" font-size="30" fill="var(--c-a)" text-anchor="start" font-weight="500">wrong layout</text><text x="460" y="360" font-size="37" fill="var(--c-a)" text-anchor="start" font-weight="500">[2,0]</text><text x="820" y="360" font-size="37" fill="var(--c-a)" text-anchor="start" font-weight="500">[1,1]</text></g></svg>