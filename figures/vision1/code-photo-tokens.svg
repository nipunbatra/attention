<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Turn the feature grid into the 197 input rows" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Turn the feature grid into the 197 input rows</title><rect x="20" y="23" width="690" height="328" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="55" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">B = x.shape[0]</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="89" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">grid = self.patch(x)                 # B, 192, 14, 14</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="123" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">rows = grid.flatten(2).transpose(1, 2)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="157" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">cls = self.cls.expand(B, -1, -1)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="191" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">rows = torch.cat([cls, rows], dim=1)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="225" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500">return rows + self.pos</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="259" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500"></text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="293" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500"># cls parameter: (1, 1, 192)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="327" font-size="21" fill="var(--ink)" text-anchor="start" font-weight="500"># pos parameter: (1, 197, 192)</text><rect x="770" y="18" width="355" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="947.5" y="49.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Convolution output</text><text x="947.5" y="79.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 192 × 14 × 14</text><path d="M947 100 L947 135" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M942.7163982346049 124.86832906596827 L947 135" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M947 135 L951.2836017653951 124.86832906596827" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="770" y="149" width="355" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="947.5" y="180.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">flatten spatial; transpose</text><text x="947.5" y="210.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 196 × 192</text><path d="M947 230 L947 268" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M942.7163982346049 257.8683290659683 L947 268" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M947 268 L951.2836017653951 257.8683290659683" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="770" y="281" width="355" height="76" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="947.5" y="312.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">prepend CLS; add position</text><text x="947.5" y="342.0" font-size="23" fill="var(--c-q)" text-anchor="middle" font-weight="500">B × 197 × 192</text></svg>