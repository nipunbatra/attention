<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Turn the feature grid into the 197 input rows" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Turn the feature grid into the 197 input rows</title><rect x="20" y="13" width="1090" height="352" rx="5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="45" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500"># x: (B, 3, 224, 224)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="75" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500">B = x.shape[0]                          # integer: number of images</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="105" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500">grid = self.patch(x)                    # (B, 192, 14, 14)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="135" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500">rows = grid.flatten(2)                  # (B, 192, 196)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="165" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500">rows = rows.transpose(1, 2)             # (B, 196, 192)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="195" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500">cls = self.cls.expand(B, -1, -1)        # (B, 1, 192)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="225" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500">rows = torch.cat([cls, rows], dim=1)    # (B, 197, 192)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="255" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500">return rows + self.pos                  # (B, 197, 192)</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="285" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500"></text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="315" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500"># self.cls: (1, 1, 192)   - shared starting row</text><text xml:space="preserve" font-family="SFMono-Regular,Consolas,monospace" x="35" y="345" font-size="22" fill="var(--ink)" text-anchor="start" font-weight="500"># self.pos: (1, 197, 192) - broadcasts across the B images</text><rect x="35" y="382" width="300" height="48" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="185.0" y="414.0" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 192 × 14 × 14</text><path d="M347 406 L418 406" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M407.8683290659683 410.28360176539513 L418 406" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M418 406 L407.8683290659683 401.71639823460487" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="430" y="382" width="280" height="48" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="570.0" y="414.0" font-size="25" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 196 × 192</text><path d="M722 406 L793 406" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M782.8683290659683 410.28360176539513 L793 406" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><path d="M793 406 L782.8683290659683 401.71639823460487" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray=""/><rect x="805" y="382" width="310" height="48" rx="5" fill="var(--t-q)" stroke="var(--c-q)" stroke-width="2"/><text x="960.0" y="414.0" font-size="25" fill="var(--c-q)" text-anchor="middle" font-weight="500">B × 197 × 192</text></svg>