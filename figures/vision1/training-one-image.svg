<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Suppose the model gets this training image wrong" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Suppose the model gets this training image wrong</title><text x="35" y="75" font-size="34" fill="var(--c-e)" text-anchor="start" font-weight="500">known label: horizontal</text><g data-build="1"><text x="35" y="185" font-size="35" fill="var(--c-a)" text-anchor="start" font-weight="500">prediction: [0.30, 0.70]</text></g><g data-build="2"><text x="35" y="295" font-size="35" fill="var(--c-a)" text-anchor="start" font-weight="500">loss = −log(0.30) = 1.204</text></g><g data-build="3"><text x="35" y="410" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">Use the known label to correct the weights.</text></g></svg>