<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Why package patch projection as Conv2d?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Why package patch projection as Conv2d?</title><text x="35" y="34" font-size="28" fill="var(--ink)" text-anchor="start" font-weight="500">One image operation applies all 192 filters at all 196 locations.</text><text x="35" y="99" font-size="27" fill="var(--c-e)" text-anchor="start" font-weight="600">Linear route</text><rect x="35" y="125" width="280" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="175.0" y="156.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Image grid</text><text x="175.0" y="186.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 3 × 224 × 224</text><path d="M324 163 L406 163" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M395.8683290659683 167.28360176539516 L406 163" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><path d="M406 163 L395.8683290659683 158.71639823460484" fill="none" stroke="var(--c-e)" stroke-width="2.5" stroke-dasharray=""/><rect x="417" y="125" width="300" height="76" rx="5" fill="var(--card)" stroke="var(--c-e)" stroke-width="2"/><text x="567.0" y="156.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">Explicit patch rows</text><text x="567.0" y="186.0" font-size="24" fill="var(--c-e)" text-anchor="middle" font-weight="500">B × 196 × 768</text><path d="M727 163 L798 163" fill="none" strok