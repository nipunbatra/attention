<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What is one coloured square actually showing?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>What is one coloured square actually showing?</title><text x="35" y="70" font-size="38" fill="var(--c-a)" text-anchor="start" font-weight="500">A[row, column]</text><g data-build="1"><text x="35" y="180" font-size="34" fill="var(--c-q)" text-anchor="start" font-weight="500">row = receiver: whose query?</text></g><g data-build="2"><text x="35" y="290" font-size="32" fill="var(--c-k)" text-anchor="start" font-weight="500">column = source: whose key/value?</text></g><g data-build="3"><text x="35" y="410" font-size="28" fill="var(--ink)" text-anchor="start" font-weight="500">one CLS row → 196 patch weights + 1 CLS weight</text></g></svg>