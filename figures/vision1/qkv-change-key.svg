<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Change only the keys. What happens?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Change only the keys. What happens?</title><text x="35" y="65" font-size="31" fill="var(--ink-2)" text-anchor="start" font-weight="500">Keep q = 1 and both values fixed.</text><text x="35" y="165" font-size="36" fill="var(--c-k)" text-anchor="start" font-weight="500">keys: [ln 3, 0] → [0, ln 3]</text><g data-build="1"><text x="35" y="275" font-size="36" fill="var(--c-a)" text-anchor="start" font-weight="500">weights: [¾, ¼] → [¼, ¾]</text></g><g data-build="2"><text x="35" y="390" font-size="36" fill="var(--c-v)" text-anchor="start" font-weight="500">message: [1.5, 0.5] → [0.5, 1.5]</text></g></svg>