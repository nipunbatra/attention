<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Change only the keys. What happens?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Change only the keys. What happens?</title><text x="35" y="65" font-size="31" fill="var(--ink-2)" text-anchor="start" font-weight="500">Keep q = 1 and both values fixed.</text><text x="35" y="165" font-size="36" fill="var(--c-k)" text-anchor="start" font-weight="500">keys: [ln 3, 0] → [0, ln 3]</text><g data-build="1"><text x="35" y="275" font-size="36" fill="var(--c-a)" text-anchor="start" font-weight="500">weights: [¾, ¼] → [¼, ¾]</text></g><g data-build="2"><text x="35" y="390" font-size="36" fill="var(--c-v)" text-anchor="start" font-weight="500">message: [1.5, 0.5] → [0.5, 1.5]</text></g></svg>