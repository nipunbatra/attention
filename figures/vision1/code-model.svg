<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How does the full model produce image logits?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>How does the full model produce image logits?</title><text x="35" y="60" font-size="28" fill="var(--c-e)" text-anchor="start" font-weight="500">16 patch rows</text><g data-build="1"><text x="35" y="145" font-size="26" fill="var(--c-e)" text-anchor="start" font-weight="500">+ CLS → 17 rows</text></g><g data-build="2"><text x="35" y="230" font-size="24" fill="var(--ink)" text-anchor="start" font-weight="500">2 blocks → 17 rows</text></g><g data-build="3"><text x="35" y="315" font-size="25" fill="var(--c-a)" text-anchor="start" font-weight="500">read CLS → 2 logits</text></g></svg>