<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How does the full model produce image logits?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How does the full model produce image logits?</title><text x="35" y="60" font-size="28" fill="var(--c-e)" text-anchor="start" font-weight="500">16 patch rows</text><g data-build="1"><text x="35" y="145" font-size="26" fill="var(--c-e)" text-anchor="start" font-weight="500">+ CLS → 17 rows</text></g><g data-build="2"><text x="35" y="230" font-size="24" fill="var(--ink)" text-anchor="start" font-weight="500">2 blocks → 17 rows</text></g><g data-build="3"><text x="35" y="315" font-size="25" fill="var(--c-a)" text-anchor="start" font-weight="500">read CLS → 2 logits</text></g></svg>