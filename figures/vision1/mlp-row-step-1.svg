<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Apply GELU to each hidden coordinate" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Apply GELU to each hidden coordinate</title><text x="30" y="80" font-size="36" fill="var(--c-e)" text-anchor="start" font-weight="500">one row: [1, −1]</text><g><text x="30" y="170" font-size="33" fill="var(--ink)" text-anchor="start" font-weight="500">linear → [1, −1, 0]</text></g><g data-build="1"><text x="30" y="260" font-size="33" fill="var(--c-v)" text-anchor="start" font-weight="500">GELU → [0.841, −0.159, 0]</text></g></svg>