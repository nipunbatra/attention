<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Apply GELU to each hidden coordinate" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>Apply GELU to each hidden coordinate</title><text x="30" y="80" font-size="36" fill="var(--c-e)" text-anchor="start" font-weight="500">one row: [1, −1]</text><g><text x="30" y="170" font-size="33" fill="var(--ink)" text-anchor="start" font-weight="500">linear → [1, −1, 0]</text></g><g data-build="1"><text x="30" y="260" font-size="33" fill="var(--c-v)" text-anchor="start" font-weight="500">GELU → [0.841, −0.159, 0]</text></g></svg>