<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Explain one classifier from pixels to learning" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>Explain one classifier from pixels to learning</title><text x="35" y="55" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">One image: 224 × 224 RGB. Patches: 16 × 16. Width: 192.</text><text x="35" y="138" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">1. How many patch rows? What changes when we add CLS?</text><text x="35" y="197" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">2. Three heads: what is the width of one head’s message?</text><text x="35" y="256" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">3. Dog/cat head: how many outputs and trainable parameters?</text><text x="35" y="315" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">4. If the model is wrong, how does the loss reach the patch layer?</text><text x="35" y="374" font-size="26" fill="var(--ink)" text-anchor="start" font-weight="500">5. If we remove CLS, how will we form one image representation?</text></svg>