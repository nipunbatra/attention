<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What does one epoch mean in this experiment?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>What does one epoch mean in this experiment?</title><text x="35" y="80" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">512 training images</text><g data-build="1"><text x="35" y="195" font-size="36" fill="var(--ink)" text-anchor="start" font-weight="500">64 images per batch</text></g><g data-build="2"><text x="35" y="310" font-size="35" fill="var(--c-d)" text-anchor="start" font-weight="500">512 / 64 = 8 updates per epoch</text></g><g data-build="3"><text x="35" y="420" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">80 epochs → 640 optimizer steps</text></g></svg>