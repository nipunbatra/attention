<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What does one epoch mean in this experiment?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>What does one epoch mean in this experiment?</title><text x="35" y="80" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">512 training images</text><g data-build="1"><text x="35" y="195" font-size="36" fill="var(--ink)" text-anchor="start" font-weight="500">64 images per batch</text></g><g data-build="2"><text x="35" y="310" font-size="35" fill="var(--c-d)" text-anchor="start" font-weight="500">512 / 64 = 8 updates per epoch</text></g><g data-build="3"><text x="35" y="420" font-size="31" fill="var(--ink)" text-anchor="start" font-weight="500">80 epochs → 640 optimizer steps</text></g></svg>