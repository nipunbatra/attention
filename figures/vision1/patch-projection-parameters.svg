<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="How many parameters does this one layer learn?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#14171F;--ink-2:#4A5160;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--c-e:#245EDB;--t-e:#E4ECFF;--c-q:#8B2CDE;--t-q:#F1E5FC;--c-k:#AA4E08;--c-v:#0F766E;--c-a:#BE123C;--c-d:#147737;"><title>How many parameters does this one layer learn?</title><text x="35" y="55" font-size="36" fill="var(--c-e)" text-anchor="start" font-weight="500">nn.Linear(768, 192)</text><text x="850" y="55" font-size="25" fill="var(--ink-2)" text-anchor="start" font-weight="500">parameter count</text><text x="35" y="145" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">weights W</text><text x="400" y="145" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">768 × 192</text><g data-build="1"><text x="850" y="145" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">147,456</text></g><g data-build="2"><text x="35" y="245" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">bias b</text><text x="400" y="245" font-size="30" fill="var(--ink)" text-anchor="start" font-weight="500">1 per output</text><text x="850" y="245" font-size="35" fill="var(--c-e)" text-anchor="start" font-weight="500">192</text></g><g data-build="3"><path d="M35 285 L1120 285" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray=""/><text x="35" y="345" font-size="29" fill="var(--ink-2)" text-anchor="start" font-weight="500">total parameters</text><text x="850" y="345" font-size="38" fill="var(--c-e)" text-anchor="start" font-weight="500">147,648</text></g><g data-build="3"><text x="35" y="425" font-size="29" fill="var(--ink)" text-anchor="start" font-weight="500">Every one of the 196 patches reuses this same parameter set.</text></g></svg>