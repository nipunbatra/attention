<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="What is stored, and what changes with the image?" style="font-family:Avenir Next,Segoe UI,sans-serif;--ink:#30343B;--ink-2:#59616D;--ink-3:#6B7280;--line:#D9DDE5;--card:#FFFFFF;--transparent:transparent;--vision:#3478E5;--language:#8B5BB5;--mixing:#178F82;--special:#B98224;--loss:#D45555;--neutral:#30343B;--cnn:#6E817B;--t-special:#FBF1DB;--t-language:#F1EAF7;--t-mixing:#E6F3EF;--t-e:#EAF1FC;--t-q:#F1EAF7;--c-e:#3478E5;--c-q:#8B5BB5;--c-k:#B98224;--c-v:#178F82;--c-a:#D45555;--c-d:#6E817B;"><title>What is stored, and what changes with the image?</title><text x="292" y="43" font-size="29" fill="var(--special)" text-anchor="middle" font-weight="650">LEARNED PARAMETERS</text><text x="865" y="43" font-size="29" fill="var(--vision)" text-anchor="middle" font-weight="650">COMPUTED FOR EACH IMAGE</text><rect x="35" y="78" width="535" height="61" rx="5" fill="var(--t-special)" stroke="var(--special)" stroke-width="2"/><text x="302.5" y="116.5" font-size="25" fill="var(--special)" text-anchor="middle" font-weight="500">Patch projection W, b</text><rect x="598" y="78" width="525" height="61" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="860.5" y="116.5" font-size="26" fill="var(--vision)" text-anchor="middle" font-weight="500">Patch embeddings</text><rect x="35" y="157" width="535" height="61" rx="5" fill="var(--t-special)" stroke="var(--special)" stroke-width="2"/><text x="302.5" y="195.5" font-size="25" fill="var(--special)" text-anchor="middle" font-weight="500">Position table + starting CLS</text><rect x="598" y="157" width="525" height="61" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="860.5" y="195.5" font-size="26" fill="var(--vision)" text-anchor="middle" font-weight="500">Q, K, V and attention weights</text><rect x="35" y="236" width="535" height="61" rx="5" fill="var(--t-special)" stroke="var(--special)" stroke-width="2"/><text x="302.5" y="274.5" font-size="25" fill="var(--special)" text-anchor="middle" font-weight="500">Transformer weights, including W_Q/K/V</text><rect x="598" y="236" width="525" height="61" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="860.5" y="274.5" font-size="26" fill="var(--vision)" text-anchor="middle" font-weight="500">Contextual patch states + final CLS</text><rect x="35" y="315" width="535" height="61" rx="5" fill="var(--t-special)" stroke="var(--special)" stroke-width="2"/><text x="302.5" y="353.5" font-size="25" fill="var(--special)" text-anchor="middle" font-weight="500">Classifier weights + biases</text><rect x="598" y="315" width="525" height="61" rx="5" fill="var(--t-e)" stroke="var(--vision)" stroke-width="2"/><text x="860.5" y="353.5" font-size="26" fill="var(--vision)" text-anchor="middle" font-weight="500">Logits + probabilities</text></svg>